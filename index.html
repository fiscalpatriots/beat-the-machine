<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263f">
<title>Second Pass: Beat the Machine</title>
<style>
:root{
  --ink:#12263f;
  --ink-soft:#4a5b70;
  --paper:#f6f3ec;
  --card:#ffffff;
  --line:#dfd8c9;
  --accept:#0f7a52;
  --accept-bg:#e4f4ec;
  --reject:#b3261e;
  --reject-bg:#fbe9e7;
  --machine:#5746e3;
  --machine-bg:#ecebfd;
  --gold:#9a6a00;
  --gold-bg:#fdf2d8;
  --bar-old:#cfc6b2;
  --neg:#9c5a52;
  --shadow:0 2px 0 rgba(18,38,63,.08), 0 8px 24px rgba(18,38,63,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:0 18px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:30px;line-height:1.12;margin:0 0 10px;letter-spacing:-.5px}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;letter-spacing:-.3px}
h3{font-size:19px;line-height:1.22;margin:0 0 6px;letter-spacing:-.2px}
p{margin:0 0 14px}
.sub{color:var(--ink-soft);font-size:16px}
.tiny{font-size:13px;color:var(--ink-soft)}

#bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 8px}
#track{line-height:0}
#trk{display:block;width:100%;height:auto;overflow:visible}
#fill{transition:width .32s cubic-bezier(.3,.8,.35,1)}
#carpos{transition:transform .32s cubic-bezier(.3,.8,.35,1)}
#carfx.burst{animation:burst .2s ease-out}
#carfx.pit{animation:pit .2s ease-in-out}
@keyframes burst{0%{transform:translateX(0)}45%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes pit{0%{transform:translateY(0)}50%{transform:translateY(6.5px)}100%{transform:translateY(0)}}
#burst{opacity:0}
#burst.on{animation:speedlines .2s ease-out}
@keyframes speedlines{0%{opacity:0;transform:translateX(3px)}35%{opacity:.85}100%{opacity:0;transform:translateX(-7px)}}
#flame{opacity:0;transition:opacity .2s ease}
#flame.on{opacity:1}
#chq{opacity:.5;transition:opacity .2s ease}
#chq.lit{opacity:1}
@media (prefers-reduced-motion:reduce){
  #fill,#carpos,#flame,#chq{transition:none}
  #carfx.burst,#carfx.pit,#burst.on{animation:none}
}
#label{display:flex;justify-content:space-between;align-items:center;min-height:25px;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.scorepill{font-weight:700;color:var(--ink);background:#ece6d8;border-radius:99px;padding:3px 10px}

#screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
.icon{width:68px;height:68px;display:block;margin:0 0 14px}
.icon svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.big{width:96px;height:96px}

button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:14px;padding:16px;font-size:18px;font-weight:700;margin-top:12px;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:15px 16px;font-size:17px;margin-top:10px;box-shadow:var(--shadow);
}
.choice:active{transform:translateY(1px)}
.choice.on{border-color:var(--ink);background:#fff}
.choice .tick{width:22px;height:22px;border-radius:99px;border:2px solid var(--line);flex:0 0 auto}
.choice.on .tick{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{
  border:2px solid var(--line);background:var(--card);border-radius:99px;
  padding:10px 14px;font-size:15px;font-weight:600;
}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.sm{padding:8px 12px;font-size:14px}

input[type=text],textarea{
  width:100%;font:inherit;padding:15px;border:2px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);
}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.acct{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.3px;background:var(--machine-bg);color:var(--machine);border-radius:99px;padding:5px 12px;margin-bottom:10px}
.move{font-size:16px;line-height:1.35;margin:0 0 12px}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.says{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--machine);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.says svg{width:20px;height:20px;fill:none;stroke:var(--machine);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.quote{font-size:17px;line-height:1.4;margin:0}

.file{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 0}
.file h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
.file ul{margin:0;padding:0 0 0 16px}
.file li{font-size:14px;line-height:1.4;margin:0 0 5px}
.file li:last-child{margin-bottom:0}

.ask{font-weight:700;font-size:15px;margin:16px 0 0;color:var(--ink-soft)}
.two{display:flex;gap:10px;margin-top:10px}
.two .btn{margin-top:0;flex:1;padding:17px 6px;font-size:17px}
.btn.call{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.call:active{background:var(--paper)}

.verdict{border-radius:18px;padding:16px 18px;margin-bottom:12px;border:2px solid}
.verdict.good{background:var(--accept-bg);border-color:var(--accept)}
.verdict.bad{background:var(--reject-bg);border-color:var(--reject)}
.verdict h2{margin:0 0 4px;font-size:20px}
.type{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.bonus{display:inline-block;background:var(--gold-bg);color:var(--gold);border:2px solid var(--gold);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;margin-top:10px}
.why{margin:0 0 4px}
.streak{font-size:15px;font-weight:700;color:var(--gold);margin:10px 0 0}

.split{margin:16px 0 0}
.splitbar{height:12px;border-radius:99px;background:#e6e0d2;overflow:hidden;display:flex}
.splitbar i{display:block;height:100%}
.splitbar i.c{background:var(--ink)}
.splitbar i.k{background:var(--accept)}
.splitlab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:6px}
.key{display:inline-block;width:9px;height:9px;border-radius:99px;vertical-align:middle;margin-right:5px}
.key.c{background:var(--ink)}
.key.k{background:var(--accept)}

.link{background:none;border:none;padding:8px 0;text-decoration:underline;font-size:15px;color:var(--ink-soft)}
.hidden{display:none!important}

#sheet{position:fixed;inset:0;background:rgba(18,38,63,.55);z-index:20;display:flex;align-items:flex-end}
#sheetbody{background:var(--paper);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px 24px;max-width:520px;margin:0 auto}
/* the statement: round one reads it, and the Ledger button reopens it during play */
.stmt{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 0 rgba(18,38,63,.05), 0 10px 28px rgba(18,38,63,.07)}
.stmthead{padding:14px 12px 12px;border-bottom:1px solid var(--line)}
.stmthead b{display:block;font-size:17px;letter-spacing:-.2px}
.stmthead span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.stmttbl{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stmttbl col.c1{width:27.5%}.stmttbl col.c2{width:27.5%}.stmttbl col.c3{width:26%}.stmttbl col.c4{width:19%}
.stmttbl th{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);
  padding:9px 3px;text-align:right;border-bottom:1px solid var(--line);vertical-align:bottom}
.stmttbl td{padding:3px;text-align:right;font-size:15px;vertical-align:top;border:none}
.stmttbl tr.z td{background:#fbf9f4}
.stmttbl tr.grp td{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);
  background:#f3efe6;padding:7px 6px;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stmttbl tr.nmrow td{text-align:left;padding:9px 6px 3px;border-top:1px solid #f0ece2}
.stmttbl tr.figrow td{padding:0 3px 9px}
.stmttbl tr.grp+tr.nmrow td{border-top:none}
.stmttbl .nm{display:block;font-size:13px;line-height:1.2;font-weight:600}
.stmttbl .no{display:inline-block;font-size:11px;color:var(--ink-soft);margin-top:1px}
.stmttbl .mbar{display:block;height:4px;border-radius:99px;background:#efeadd;margin-top:5px;overflow:hidden}
.stmttbl .mbar i{display:block;height:100%;background:var(--bar-old);border-radius:99px}
.stmttbl td.ch{color:var(--ink);font-weight:600}
.stmttbl td.ch.neg{color:var(--neg)}
.stmttbl td.pc{color:var(--ink-soft)}
.stmttbl td.pc.neg{color:var(--neg)}
.stmttbl tr.subnm td{border-top:1px solid var(--ink);padding-top:9px;text-align:left}
.stmttbl tr.subnm td,.stmttbl tr.subfig td{font-weight:700;background:#fff}
.stmttbl tr.netnm td{border-top:3px double var(--ink);padding-top:10px;text-align:left}
.stmttbl tr.netnm td,.stmttbl tr.netfig td{font-weight:800;background:#fff}
.stmttbl tr.here td{background:var(--machine-bg)}
.stmttbl tr.here td:first-child{box-shadow:inset 3px 0 0 var(--machine)}
.stmttbl tr.here .mbar i{background:var(--machine)}
.cap{margin:0;padding:10px 12px 12px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line)}

/* the card header and the account's own statement line */
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cardhead.plain{margin-bottom:10px;align-items:center}
.revlabel{font-size:13px;font-weight:700;color:var(--ink-soft)}
.ledgerbtn{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700}
.ledgerbtn:active{transform:translateY(1px)}
.strip{background:var(--machine-bg);border-left:3px solid var(--machine);border-radius:0 10px 10px 0;
  padding:10px 12px;margin:0 0 14px;font-variant-numeric:tabular-nums}
.striptop{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.striptop b{color:var(--machine);font-size:13px}
.striptop span{font-size:14px;font-weight:600}
.stripnums{display:flex;gap:10px;align-items:flex-start}
.stripnums>span{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.stripnums>span>i{display:block;font-style:normal;font-size:15px;font-weight:700;color:var(--ink);
  text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch{display:block;font-size:15px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch.neg{color:var(--neg)}
.stripnums .ch i{display:block;font-style:normal;font-size:13px;font-weight:400;color:var(--ink-soft);margin:0}

.final{text-align:center}
.trophywrap{display:flex;justify-content:center;margin:4px 0 6px}
.trophy{width:132px;height:auto;animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
.trophy .glint{animation:sweep 1.1s ease-out .5s both}
@keyframes rise{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(130px)}}
@media (prefers-reduced-motion:reduce){.trophy,.trophy .glint{animation:none}.trophy .glint{opacity:0}}
.rankbig{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.stats{display:flex;gap:8px;margin:0 0 10px}
.lapwrap{margin:0 0 18px}
.lap{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:6px 14px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats div{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px}
.stats b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px;line-height:1.2}
.earned{margin:12px 0 16px;font-size:16px;color:var(--ink-soft)}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:#b3aa96}
.badge svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.sharecard{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:left}
.sharecard p{margin:0 0 10px;font-size:16px;font-weight:600}
.sharecard .btn{margin-top:0;padding:11px;font-size:16px}
.coach{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:18px 0 0;text-align:left;box-shadow:var(--shadow)}
.coach h3{margin:0 0 10px}
.miss{border-top:1px solid var(--line);padding:10px 0 0;margin:10px 0 0}
.miss:first-of-type{border-top:none;padding-top:0;margin-top:0}
.miss b{display:block;font-size:15px}
.miss em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--machine);margin:2px 0 4px}
.miss span{display:block;font-size:14px;color:var(--ink-soft);line-height:1.4}
</style>
</head>
<body>

  <div id="screen"></div>
</div>
<iframe name="gfsink" id="gfsink" class="hidden" title="submit"></iframe>

};
function icon(name, big){ return '<span class="icon'+(big?' big':'')+'"><svg viewBox="0 0 24 24">'+I[name]+'</svg></span>'; }

/* ---------- the ledger ---------- */
var ROWS = [
 ["4000","Product revenue, distribution",5240000,5612000,1],
 ["4100","Service revenue, equipment maintenance",812000,1041000,1],
 ["4200","Freight billed to customers",186000,121000,1],
 ["5000","Cost of product sold",3930000,4278000,0],
 ["5100","Inbound freight",214000,287800,1],

 ["6200","Repairs and maintenance, depots",41000,118600,1],

 ["7400","Inventory shrink adjustment",6400,8900,0]
];

var THRESHOLD = "A line owes commentary only when it clears both $25,000 and 10 percent.";

/* ---------- the fourteen lines, and the key ----------
   key "flag"  the memo's line on this account does not hold
   key "stand" the line is clean and a careful reviewer leaves it alone
   post        what the answer sends to the existing form, which asks C1 the
               other way round from the rest, so card one is inverted on purpose */
var CARDS = [
 {n:1, icon:"coins", acct:"4200", name:"Freight billed to customers",
  prior:186000, current:121000,
  memo:"Freight billed to customers fell from $186,000 to $121,000, a decrease of $6,500 and 3.5 percent, so neither leg of the threshold is met and no commentary is owed on this line.",

        THRESHOLD],
  key:"flag", type:"arithmetic",
  why:"The fall is $65,000 and 34.9 percent, so both legs clear and this line owes an explanation that the memo never gives.",
  tell:"The subtraction is right there on the ledger. $186,000 less $121,000 is $65,000, not $6,500.",
  post:{flag:"Reject", stand:"Accept"}},

 {n:2, icon:"wrench", acct:"6200", name:"Repairs and maintenance, depots",
  prior:41000, current:118600,
  memo:"Depot repairs and maintenance of $118,600 reflects the roof and dock leveler program, which finished on June 30. The remaining depot repairs are scheduled to finish in August, and that spend is not yet in these numbers.",

  key:"flag", type:"timing",
  why:"One programme cannot be finished on June 30 and still have work running into August, and which version is true decides whether June owes an accrual.",

/* Twelve of the fourteen lines carry a problem and two are clean. Neither number is
   printed anywhere, because a player who knew the split could flag everything. */

/* ---------- state ---------- */
/* organisations, tapped on the way in so the pooled results can be counted by chapter */
var ORGS = ["Beta Alpha Psi", "ACFE", "ASM", "NABA", "AAA", "GMU Student"];

var S = {
  step:0, codename:"", orgs:[],
  calls:[], confPost:null, qd:null,
  caught:0, cleared:0, falseFlags:0, streak:0, best:0, started:0,
  lapStart:0, lapEnd:0
};
for(var i=0;i<14;i++){ S.calls.push(null); }

var screen = document.getElementById("screen");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function go(n){ S.step = n; render(); window.scrollTo(0,0); }
function money(v){ return "$" + Math.round(Math.abs(v)).toLocaleString("en-US"); }
function pctOf(c){ return (Math.abs(c.current-c.prior)/c.prior*100).toFixed(1); }
function dirWord(c){ return c.current>=c.prior ? "up" : "down"; }

/* ---------- the track. Fourteen segments, one car, a chequered flag at the end. ---------- */
var CAR_X0 = 9, CAR_X1 = 283;
function buildTrack(){
  var ticks = "", k, x;
  for(k=1;k<14;k++){
    x = CAR_X0 + (k/14)*(CAR_X1-CAR_X0);
    ticks += '<rect x="'+(x-0.4).toFixed(1)+'" y="9" width="0.8" height="7" fill="#fff" opacity=".7"/>';
  }
  var chq = "", r, c;
  for(r=0;r<4;r++){ for(c=0;c<2;c++){
    if((r+c)%2===0) chq += '<rect x="'+(287.4+c*3.4)+'" y="'+(8+r*3.5)+'" width="3.4" height="3.5" fill="var(--ink)"/>';
  } }
  document.getElementById("track").innerHTML =
    '<svg id="trk" viewBox="0 0 300 26" role="img" aria-label="Fourteen lines, one segment each">'+
      '<rect x="4" y="19" width="292" height="3.4" rx="1.7" fill="#ece6d8"/>'+
      '<rect x="4" y="8" width="292" height="9" rx="4.5" fill="#e6e0d2"/>'+
      '<rect id="fill" x="4" y="8" width="0.1" height="9" rx="4.5" fill="var(--ink)" opacity=".28"/>'+
      ticks+
      '<g id="chq"><rect x="286.6" y="8" width="0.8" height="14.4" fill="var(--ink)"/>'+chq+'</g>'+
      '<g id="carpos" style="transform:translate('+CAR_X0+'px,0px)">'+
        '<g id="burst"><rect x="-21" y="11.3" width="7" height="1.2" rx=".6" fill="var(--ink-soft)"/>'+
          '<rect x="-17.5" y="14.1" width="5" height="1.2" rx=".6" fill="var(--ink-soft)"/></g>'+
        '<g id="flame"><path d="M-7.5 12.9 q-6.5 -3.4 -11.5 0 q5 3.4 11.5 0z" fill="#e08a2b"/>'+
          '<path d="M-7.5 12.9 q-3.8 -1.9 -6.8 0 q3 1.9 6.8 0z" fill="#f3c54a"/></g>'+
        '<g id="carfx">'+
          '<rect x="-7" y="11" width="14" height="4.1" rx="1.6" fill="var(--ink)"/>'+
          '<path d="M-2.8 11 L-1.4 8.3 L2.4 8.3 L3.9 11 Z" fill="var(--ink)"/>'+
          '<circle cx="-4" cy="15.4" r="1.9" fill="#2a3a4f"/>'+
          '<circle cx="4" cy="15.4" r="1.9" fill="#2a3a4f"/>'+
        '</g>'+
      '</g>'+
    '</svg>';
}
function lapsDone(){ return S.calls.filter(function(v){ return v!==null; }).length; }
function paintTrack(){
  var done = lapsDone();
  var x = CAR_X0 + (done/14)*(CAR_X1-CAR_X0);
  var pos = document.getElementById("carpos"), f = document.getElementById("fill"),
      fl = document.getElementById("flame"), cq = document.getElementById("chq");
  if(pos) pos.style.transform = "translate("+x.toFixed(1)+"px,0px)";
  if(f) f.setAttribute("width", Math.max(0.1, x-4).toFixed(1));
  if(fl) fl.classList.toggle("on", S.streak>=3);
  if(cq) cq.classList.toggle("lit", done>=14);
}
/* a right call is a short burst, a wrong one drops into the pit and rejoins */
function carFx(right){
  var fx = document.getElementById("carfx"), bu = document.getElementById("burst");
  if(!fx) return;
  fx.classList.remove("burst","pit");
  if(bu) bu.classList.remove("on");
  fx.getBoundingClientRect();
  fx.classList.add(right ? "burst" : "pit");
  if(right && bu) bu.classList.add("on");
  setTimeout(function(){
    fx.classList.remove("burst","pit");
    if(bu) bu.classList.remove("on");
  }, 240);
}
function lapMs(){
  if(!S.lapStart) return 0;
  return (S.lapEnd || Date.now()) - S.lapStart;
}
function lapText(){
  var t = Math.round(lapMs()/1000), m = Math.floor(t/60), sec = t%60;
  return m + ":" + (sec<10 ? "0" : "") + sec;
}
function lapMinutes(){ return String(Math.max(1, Math.round(lapMs()/60000))); }

function progress(){
  paintTrack();
  var lab = document.getElementById("step");
  var sc = document.getElementById("score");
  if(S.step>=3 && S.step<=16){
    var seen = S.calls.filter(function(v){ return v!==null; }).length;
    lab.textContent = "Line "+(S.step-2)+" of 14";
    if(seen){ sc.classList.remove("hidden"); sc.textContent = "Right "+(S.caught+S.cleared)+" of "+seen; }
    else sc.classList.add("hidden");
  } else if(S.step===0){ lab.textContent=""; sc.classList.add("hidden"); }
  else { lab.textContent = "Second Pass"; sc.classList.add("hidden"); }
}

/* ---------- the ledger, on call from every card ---------- */
function rowFor(acct){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===acct) return ROWS[i]; }
  return null;
}
function moveCell(d){ return d<0 ? "("+money(d)+")" : (d>0 ? "+"+money(d) : "$0"); }

/* the account under review, printed on the card as its statement line */
function strip(acct){
  var r = rowFor(acct); if(!r) return "";
  return '<div class="strip"><div class="striptop"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>'+
    '<div class="stripnums"><span>May<i>'+money(r[2])+'</i></span>'+
    '<span>June<i>'+money(r[3])+'</i></span>'+
    '<span>Change'+changeCell(r[2], r[3])+'</span></div></div>';
}

/* ---------- the statement, one component for the orientation screen and the sheet ---------- */
var GROUPS = [
  {title:"Revenue", accts:["4000","4100","4200"], total:"Total revenue"},
  {title:"Cost of sales", accts:["5000","5100"], total:"Total cost of sales"},
  {title:"Operating expenses", accts:["6000","6100","6200","6300","6400","6500","7000","7100","7400"], total:"Total operating expenses"}
];
function sumOf(accts, col){
  var t = 0;
  accts.forEach(function(a){ var r = rowFor(a); if(r) t += r[col]; });
  return t;
}
function changeCell(prior, current){
  var d = current - prior;
  var pc = prior ? (d/prior*100).toFixed(1)+"%" : "0.0%";
  return '<span class="ch '+(d<0?"neg":"pos")+'">'+moveCell(d)+'<i>'+pc+'</i></span>';
}
/* the same movement as two statement cells, Change and Percent */
function changeTds(prior, current){
  var d = current - prior;
  var pc = (prior ? (d/prior*100).toFixed(1) : "0.0")+"%";
  var neg = d<0 ? " neg" : "";
  return '<td class="ch'+neg+'">'+moveCell(d)+'</td><td class="pc'+neg+'">'+pc+'</td>';
}
/* one account is two rows: the name and its movement bar across the full width, then the
   four figures under it, so May, June, Change and Percent all hold 15px type at 375px */
function acctRows(r, acct, max, z){
  var d = r[3]-r[2];
  var w = Math.max(3, Math.round(Math.abs(d)/max*100));
  var mark = (r[0]===acct) ? " here" : "";
  var id = (r[0]===acct) ? ' id="hererow"' : "";
  return '<tr class="nmrow'+(z%2?" z":"")+mark+'"'+id+'><td colspan="4">'+
      '<span class="nm">'+esc(r[1])+'</span><span class="no">'+r[0]+'</span>'+
      '<span class="mbar"><i style="width:'+w+'%"></i></span></td></tr>'+
    '<tr class="figrow'+(z%2?" z":"")+mark+'"><td>'+money(r[2])+'</td><td>'+money(r[3])+'</td>'+
      changeTds(r[2], r[3])+'</tr>';
}
function totalRows(label, pr, cu, cls){
  return '<tr class="'+cls+'nm"><td colspan="4">'+label+'</td></tr>'+
    '<tr class="'+cls+'fig"><td>'+money(pr)+'</td><td>'+money(cu)+'</td>'+changeTds(pr,cu)+'</tr>';
}
function statement(acct){
  var max = 0;
  ROWS.forEach(function(r){ max = Math.max(max, Math.abs(r[3]-r[2])); });
  var body = "", z = 0;
  GROUPS.forEach(function(g){
    body += '<tr class="grp"><td colspan="4">'+g.title+'</td></tr>';
    g.accts.forEach(function(a){
      var r = rowFor(a); if(!r) return;
      z++;
      body += acctRows(r, acct, max, z);
    });
    body += totalRows(g.total, sumOf(g.accts,2), sumOf(g.accts,3), "sub");
  });
  var netP = sumOf(GROUPS[0].accts,2) - sumOf(GROUPS[1].accts,2) - sumOf(GROUPS[2].accts,2);
  var netC = sumOf(GROUPS[0].accts,3) - sumOf(GROUPS[1].accts,3) - sumOf(GROUPS[2].accts,3);
  body += totalRows("Net of the accounts shown", netP, netC, "net");
  return '<div class="stmt">'+
    '<div class="stmthead"><b>Halyard Provisioning Group, Inc.</b><span>June close, prepared from the general ledger</span></div>'+
    '<table class="stmttbl"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>'+
    '<thead><tr><th>May</th><th>June</th><th>Change</th><th>Percent</th></tr></thead>'+
    '<tbody>'+body+'</tbody></table>'+
    '<p class="cap">The fourteen accounts the memo was written against.</p></div>';
}

function openSheet(acct){

    var d = document.createElement("div");
  d.id="sheet";
  d.innerHTML = '<div id="sheetbody">'+statement(acct)+'<button class="btn" id="closesheet">Close</button></div>';
  document.body.appendChild(d);
  var here = document.getElementById("hererow");
  if(here && here.scrollIntoView) here.scrollIntoView({block:"center"});
  /* a tap that opens the sheet also sends a click a moment later, and that one would land
     on the backdrop and shut it again, so the first 400ms are ignored */
  var opened = Date.now();
  d.addEventListener("click", function(ev){
    if(Date.now() - opened < 400) return;
    if(ev.target.id==="sheet"||ev.target.id==="closesheet") d.remove();
  });
}
function ledgerBtn(acct){ return '<button class="ledgerbtn" data-acct="'+acct+'">Ledger</button>'; }
function wireLedger(){
  var b = screen.querySelector(".ledgerbtn");
  if(b) b.addEventListener("click", function(){ openSheet(b.getAttribute("data-acct")); });
}

/* ---------- the picture of the movement. Every figure lives in the strip above it. ---------- */
function chart(c){
  var max = Math.max(c.prior, c.current);
  var wa = Math.round(250 * c.prior / max);
  var wb = Math.round(250 * c.current / max);
  var d = c.current - c.prior;
  return '<svg class="chart" viewBox="0 0 300 74" role="img" aria-label="'+esc(c.name+', May '+money(c.prior)+', June '+money(c.current))+'">'+
    '<text x="0" y="21" font-size="13" fill="var(--ink-soft)">May</text>'+
    '<rect x="44" y="7" width="'+wa+'" height="18" rx="3" fill="var(--bar-old)"/>'+
    '<text x="0" y="55" font-size="13" fill="var(--ink)">June</text>'+
    '<rect x="44" y="41" width="'+wb+'" height="18" rx="3" fill="'+(d<0?"var(--neg)":"var(--ink)")+'"/>'+
  '</svg>';
}

/* ---------- screens ---------- */
function render(){
  progress();
  var s = S.step;
  if(s===0) return intro();
  if(s===1) return identity();
  if(s===2) return roundOne();
  if(s>=3 && s<=16) return card(s-3);
  if(s===17) return confPost();
  if(s===18) return submitScreen();
  if(s>=19) return done();
}

function intro(){
  screen.innerHTML =
    icon("robot", true)+
    '<h1>Second Pass:<br>Beat the Machine</h1>'+
    '<p>The June close commentary at Halyard wasn\'t written by a person. The controller gave an AI assistant the ledger and asked it to explain the month, and every figure it quotes is right.</p>'+
    '<p>The explanations are the assistant\'s own guesswork, because the ledger doesn\'t carry any. Enough of them are wrong in a way that would satisfy a reviewer and stop them looking further. You\'ll read fourteen lines and flag the ones that don\'t hold.</p>'+
    '<button class="btn" id="go">Play</button>'+
    '<p class="tiny" style="margin-top:14px">About ten minutes, and nothing here identifies you.</p>';
  document.getElementById("go").addEventListener("click", function(){ S.started = Date.now(); go(1); });
}

function identity(){
  var chips = ORGS.map(function(o,idx){
    return '<button class="chip'+(S.orgs.indexOf(o)>-1?" on":"")+'" data-i="'+idx+'">'+esc(o)+'</button>';
  }).join("");
  screen.innerHTML =
    icon("badge")+
    '<h2>Before you start</h2>'+
    '<p class="sub">A codename for the leaderboard, and the chapters you belong to.</p>'+
    '<input type="text" id="cn" placeholder="Silver Ledger" autocomplete="off" value="'+esc(S.codename)+'">'+
    '<div class="chips" id="orgs" style="margin-top:14px">'+chips+'</div>'+
    '<button class="btn" id="next" disabled>Start</button>';
  var inp = document.getElementById("cn"), nx = document.getElementById("next");
  function upd(){ nx.disabled = S.codename.length < 2 || S.orgs.length === 0; }
  inp.addEventListener("input", function(){ S.codename = inp.value.trim(); upd(); });
  Array.prototype.forEach.call(screen.querySelectorAll("#orgs .chip"), function(b){
    b.addEventListener("click", function(){
      var o = ORGS[parseInt(b.getAttribute("data-i"),10)], at = S.orgs.indexOf(o);
      if(at>-1){ S.orgs.splice(at,1); b.classList.remove("on"); }
      else { S.orgs.push(o); b.classList.add("on"); }
      upd();
    });
  });
  nx.addEventListener("click", function(){ go(2); });
  S.codename = inp.value.trim();
  upd();
}






function scaleChips(iconName, head, sub, key, next){
  var html = icon(iconName)+'<h2>'+head+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'')+'<div class="chips">';
  for(var i=0;i<=10;i++){
    html += '<button class="chip'+(S[key]===String(i)?" on":"")+'" data-v="'+i+'">'+(i*10)+'%</button>';
  }
  html += '</div>';
  screen.innerHTML = html;
  Array.prototype.forEach.call(screen.querySelectorAll(".chip"), function(b){
    b.addEventListener("click", function(){ S[key] = b.getAttribute("data-v"); go(next); });
  });
}

function confPost(){ scaleChips("badge","How much do you think you got right?","One tap, then your calls go in.","confPost",18); }

function roundOne(){
  screen.innerHTML = '<h2>The ledger, May against June</h2>'+
    '<p class="sub">Read it before the memo. You can open it again from any card.</p>'+
    statement("")+
    '<button class="btn" id="next">Continue</button>';
  document.getElementById("next").addEventListener("click", function(){ go(3); });
}

function card(i){
  var c = CARDS[i];
  if(!S.lapStart) S.lapStart = Date.now();
  var memoBlock = c.memo
    ? '<div class="says"><svg viewBox="0 0 24 24">'+I.robot+'</svg> What the memo says</div><p class="quote">'+esc(c.memo)+'</p>'
    : '<div class="says"><svg viewBox="0 0 24 24">'+I.robot+'</svg> What the memo says</div><p class="quote">Nothing. This account is not mentioned anywhere in the commentary.</p>';
  var fileBlock = c.file.length
    ? '<div class="file"><h4>On file</h4><ul>'+c.file.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join("")+'</ul></div>'
    : "";
  screen.innerHTML =
    '<div class="card">'+
      '<div class="cardhead">'+icon(c.icon)+ledgerBtn(c.acct)+'</div>'+
      strip(c.acct)+
      chart(c)+
      memoBlock+
      fileBlock+
      '<p class="ask">Does the memo\'s explanation hold?</p>'+
      '<div class="two">'+
        '<button class="btn call" id="stand">Let it stand</button>'+
        '<button class="btn call" id="flag">Flag it</button>'+
      '</div>'+
    '</div>';
  wireLedger();
  document.getElementById("flag").addEventListener("click", function(){ answer(i,"flag"); });
  document.getElementById("stand").addEventListener("click", function(){ answer(i,"stand"); });
}


function answer(i, val){
  var c = CARDS[i];
  S.calls[i] = val;
  if(i === 13) S.lapEnd = Date.now();
  var right = (val === c.key);
  if(right){
    if(c.key==="flag") S.caught++; else S.cleared++;
    S.streak++;
    if(S.streak > S.best) S.best = S.streak;
  } else {
    if(val === "flag") S.falseFlags++;
    S.streak = 0;
  }
  carFx(right);
  reveal(i, right);
}

function splitBar(){
  var seen = S.calls.filter(function(v){ return v!==null; }).length;
  var right = S.caught + S.cleared;
  var cw = seen ? Math.round(right/seen*100) : 0;
  return '<div class="split"><div class="splitbar"><i class="c" style="width:'+cw+'%"></i></div>'+
    '<div class="splitlab"><span>'+right+' of '+seen+' right so far</span></div></div>';
}


function reveal(i, right){
  var c = CARDS[i];
  var head = right ? (c.key==="flag" ? "Caught it" : "Cleared it")
                   : (c.key==="flag" ? "That one got past you" : "You flagged a clean line");
  progress();
  var celebration = "";
  if(right && c.key==="flag" && c.type==="invented driver") celebration = '<span class="bonus">Invented driver caught</span>';
  var streakLine = "";
  if(right && S.streak>=3) streakLine = '<p class="streak">'+S.streak+' in a row.</p>';
  var costLine = (!right && c.key==="stand")
    ? '<p class="tiny" style="margin:8px 0 0">A false flag scores the same as a line that gets past you.</p>'
    : "";
  screen.innerHTML =
    '<div class="cardhead plain"><span class="revlabel">Line '+c.n+' of 14</span>'+ledgerBtn(c.acct)+'</div>'+
    strip(c.acct)+
    '<div class="verdict '+(right?"good":"bad")+'" style="margin-top:12px">'+
      '<h2>'+head+'</h2>'+
      '<span class="type">'+esc(c.type)+'</span>'+
      celebration+
    '</div>'+
    '<p class="why">'+esc(c.why)+'</p>'+
    costLine+
    streakLine+
    splitBar()+
    '<button class="btn" id="next">'+(i===13?"See how you did":"Next line")+'</button>';
  wireLedger();
  document.getElementById("next").addEventListener("click", function(){ go(S.step+1); });
  window.scrollTo(0,0);
}





/* ---------- generated summaries. Nothing here is typed by the player. ---------- */
var ROUND1_NOTE = "Not collected. The ledger screen is orientation only in this version.";

function flaggedAccounts(){
  var out = [];
  CARDS.forEach(function(c){ if(c.key==="flag" && out.indexOf(c.acct)===-1) out.push(c.acct); });
  return out;
}
function acctName(code){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===code) return code+" "+ROWS[i][1]; }
  return code;
}
function missedCards(){
  var out = [];
  CARDS.forEach(function(c,idx){ if(S.calls[idx] !== c.key) out.push(c); });
  return out;
}
/* The organisation taps ride at the front of question A, behind a fixed prefix, so the
   responses sheet can be counted by chapter without a new form question. */
function orgLine(){ return "Organisations: " + S.orgs.join("; ") + "."; }
function summaryA(){
  return orgLine() + " " + ROUND1_NOTE;
}

function summaryB(){
  var miss = missedCards();
  var parts = [];
  parts.push(miss.length
    ? "Lines missed: " + miss.map(function(c){ return c.n+" "+c.acct+" ("+c.type+")"; }).join("; ") + "."
    : "No lines missed.");
  parts.push("Pattern: " + patternLine());
  parts.push("Result: " + (S.caught+S.cleared) + " of 14 calls correct, " + S.caught + " caught, " +
             S.cleared + " let stand correctly, " + S.falseFlags + " false flag" + (S.falseFlags===1?"":"s") +
             ", rank " + rank() + ".");
  parts.push("Intake scales (expected quality, confidence before, close experience) were not asked in this version and carry placeholder values.");
  parts.push("Longest run of correct calls: " + S.best + ".");
  return parts.join(" ");
}

function typeNoun(type, n){
  if(type==="clean line") return n===1 ? "clean line" : "clean lines";
  return type + (n===1 ? " problem" : " problems");
}
function patternLine(){
  var tally = {};
  CARDS.forEach(function(c,idx){
    if(!tally[c.type]) tally[c.type] = {tot:0, miss:0};
    tally[c.type].tot++;
    if(S.calls[idx] !== c.key) tally[c.type].miss++;
  });
  var clean = [], bad = [];
  Object.keys(tally).forEach(function(t){
    var v = tally[t];
    if(v.miss===0 && v.tot>=2) clean.push({t:t, tot:v.tot});
    if(v.miss>0) bad.push({t:t, tot:v.tot, miss:v.miss});
  });
  if(!bad.length) return "you called all fourteen lines the way the ledger has them.";
  bad.sort(function(a,b){ return b.miss - a.miss; });
  var worst = bad[0];
  var badBit;
  if(worst.miss === worst.tot && worst.tot > 1) badBit = (worst.tot===2 ? "both " : "all "+worst.tot+" ") + typeNoun(worst.t, worst.tot) + " got past you";
  else if(worst.miss === worst.tot) badBit = "the " + typeNoun(worst.t,1) + " got past you";
  else badBit = "you missed " + worst.miss + " of the " + worst.tot + " " + typeNoun(worst.t, worst.tot);
  if(clean.length){
    clean.sort(function(a,b){ return b.tot - a.tot; });
    return "you caught every " + typeNoun(clean[0].t, 1) + ", and " + badBit + ".";
  }
  if(bad.length > 1){
    var second = bad[1];
    return badBit + ", and the " + typeNoun(second.t,1) + " went the same way.";
  }
  return badBit + ".";
}

function rank(){
  var right = S.caught + S.cleared;
  if(right>=14) return "Partner";
  if(right>=13) return "Manager";
  if(right>=11) return "Senior";
  if(right>=8) return "Staff";
  return "Trainee";
}
function tier(){
  var right = S.caught + S.cleared;
  if(right>=14) return "sweep";
  if(right>=13) return "gold";
  if(right>=11) return "silver";
  return "bronze";
}

/* ---------- payload and submit ---------- */
function payload(){
  var p = {};
  p["entry."+E.codename] = S.codename;
  p["entry."+E.round1] = ROUND1_NOTE;
  /* the form makes these three required and this version does not ask them, so they carry
     a fixed placeholder and the note in question B says so. They are not player answers. */
  p["entry."+E.expect] = "3";
  p["entry."+E.confPre] = "5";
  p["entry."+E.experience] = "Once or twice";
  for(var i=0;i<14;i++){
    var c = CARDS[i];
    var call = S.calls[i] || "stand";
    p["entry."+E.call[i]] = c.post[call];
    p["entry."+E.why[i]] = "Line "+c.n+", account "+c.acct+". Called: "+call+". Key: "+c.key+
                           ". Type: "+c.type+". "+(S.calls[i]===c.key ? "Correct." : "Missed.");
  }
  p["entry."+E.confPost] = S.confPost;
  p["entry."+E.qa] = summaryA();
  p["entry."+E.qb] = summaryB();
  p["entry."+E.qc] = "Not asked in this version.";
  p["entry."+E.qd] = lapMinutes();
  var fbzx = String(Math.floor(Math.random()*9007199254740991));
  p["fvv"] = "1";
  p["pageHistory"] = "0,1,2";
  p["fbzx"] = fbzx;
  p["partialResponse"] = '[null,null,"'+fbzx+'"]';
  p["submissionTimestamp"] = "-1";
  return p;
}

function asText(){
  var out = ["Second Pass: Beat the Machine", "Codename: "+S.codename, orgLine(), ""];
  out.push("Round one: "+ROUND1_NOTE);
  out.push("Intake scales not asked in this version.");
  out.push("");
  for(var i=0;i<14;i++){
    out.push("Line "+(i+1)+" ("+CARDS[i].acct+"): "+S.calls[i]+", key "+CARDS[i].key+", "+CARDS[i].type);
  }
  out.push("");
  out.push("Confidence after: "+(S.confPost*10)+"%");
  out.push(summaryA());
  out.push(summaryB());
  out.push("Lap time: "+lapText()+", posted as "+lapMinutes()+" minute(s)");
  return out.join("\n");
}

var submitted = false;
function submitScreen(){
  screen.innerHTML = icon("robot",true)+'<h2>Sending your calls</h2>';
  if(submitted) return;
  submitted = true;
  var p = payload();
  window.__BTM_LAST_POST = p;
  var f = document.createElement("form");
  f.action = FORM_POST; f.method = "POST"; f.target = "gfsink"; f.style.display = "none";
  Object.keys(p).forEach(function(k){
    var inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = p[k];
    f.appendChild(inp);
  });
  document.body.appendChild(f);
  var settled = false;
  var sink = document.getElementById("gfsink");
  var timer = setTimeout(function(){ if(!settled){ settled = true; failScreen(); } }, 12000);
  sink.addEventListener("load", function(){
    if(settled) return;
    settled = true; clearTimeout(timer); go(19);
  });
  try{ f.submit(); }
  catch(err){ clearTimeout(timer); settled = true; failScreen(); }
}

function failScreen(){
  screen.innerHTML =
    icon("alert",true)+
    '<h2>The send did not go through</h2>'+
    '<p class="sub">Nothing is lost. Copy this and send it to Khaled.</p>'+
    '<textarea id="dump" readonly style="min-height:220px">'+esc(asText())+'</textarea>'+
    '<button class="btn" id="copy">Copy my answers</button>'+
    '<button class="btn ghost" id="retry">Try sending again</button>';
  document.getElementById("copy").addEventListener("click", function(){
    var t = document.getElementById("dump");
    t.select(); t.setSelectionRange(0,99999);
    try{ document.execCommand("copy"); this.textContent = "Copied"; }catch(e){ this.textContent = "Select and copy"; }
  });
  document.getElementById("retry").addEventListener("click", function(){ submitted = false; go(18); });
}

/* ---------- the trophy, drawn to the tier ---------- */
var TROPHY = {
  bronze:{body:"#b07b45", dark:"#8a5d31", name:"bronze"},
  silver:{body:"#9aa6b2", dark:"#77838f", name:"silver"},
  gold:{body:"#d4a72c", dark:"#a87f14", name:"gold"},
  sweep:{body:"#d4a72c", dark:"#a87f14", name:"clean sweep"}
};
function trophySvg(t){
  var c = TROPHY[t];
  var star = t==="sweep"
    ? '<path d="M50 4l3.6 7.6 8.4 1.2-6 5.9 1.4 8.3L50 23.1l-7.4 3.9 1.4-8.3-6-5.9 8.4-1.2z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="1.4" stroke-linejoin="round"/>'
    : "";
  return '<svg class="trophy '+t+'" viewBox="0 0 100 104" role="img" aria-label="'+c.name+' trophy">'+
    '<defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".75"/>'+
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
      '<clipPath id="cupclip"><path d="M30 30h40v18a20 20 0 0 1-40 0z"/></clipPath></defs>'+
    star+
    '<path d="M30 30h40v18a20 20 0 0 1-40 0z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<g clip-path="url(#cupclip)"><rect class="glint" x="-40" y="28" width="26" height="44" fill="url(#shine)"/></g>'+
    '<path d="M30 34H20a10 10 0 0 0 10 12M70 34h10a10 10 0 0 1-10 12" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M50 68v12M36 92h28l-3-12H39z" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="M32 98h36" stroke="'+c.dark+'" stroke-width="3.4" stroke-linecap="round"/>'+
  '</svg>';
}

/* ---------- the five badges, earned off the key ---------- */
function got(n){ var c = CARDS[n-1]; return S.calls[n-1] === c.key; }
function badges(){
  var right = S.caught + S.cleared;
  return [
    {t:"Invented driver caught", on: got(7) && got(10), i:"glass"},
    {t:"Perfect timing",     on: got(2) && got(4) && got(9), i:"calendar"},
    {t:"Arithmetic hawk",    on: got(1) && got(8) && got(13), i:"scales"},
    {t:"Read the silence",   on: got(6) && got(11), i:"flag"},
    {t:"Clean sweep",        on: right===14, i:"badge"}
  ];
}

function earnedLine(){
  var right = S.caught + S.cleared;
  if(right===14) return "Every one of your fourteen calls matches the ledger.";
  if(right===0) return "None of your fourteen calls match the ledger.";
  return right + " of your fourteen calls match the ledger.";
}


function done(){
  var miss = missedCards();
  var coachInner;
  if(!miss.length){
    coachInner = '<div class="coach"><h3>Nothing to fix</h3><p class="tiny" style="margin:0">This read out lists the lines that got past you, and there are none.</p></div>';
  } else {
    coachInner = '<div class="coach"><h3>Where it got past you</h3>'+
      miss.map(function(c){
        return '<div class="miss"><b>Line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+
      (S.falseFlags > 0
        ? '<p class="tiny" style="margin:14px 0 0">'+(S.falseFlags===1?"One of those was a line":"Those were lines")+
          ' that owed nothing and read correctly, and flagging a line like that costs the controller time on work that was already right.</p>'
        : "")+
      '<p class="tiny" style="margin:14px 0 0">'+esc(patternLine().charAt(0).toUpperCase()+patternLine().slice(1))+'</p></div>';
  }
  var share = "I called " + (S.caught+S.cleared) + " of 14 lines the way the ledger has them in Second Pass: Beat the Machine.";
  var b = badges();
  screen.innerHTML =
    '<div class="final">'+
      '<div class="trophywrap">'+trophySvg(tier())+'</div>'+
      '<div class="rankbig">'+rank()+'</div>'+
      '<p class="tiny" style="margin:2px 0 0">'+esc(S.codename)+'</p>'+
      '<p class="earned">'+esc(earnedLine())+'</p>'+
      '<div class="stats">'+
        '<div><b>'+S.caught+'</b><span>caught</span></div>'+
        '<div><b>'+S.cleared+'</b><span>let stand correctly</span></div>'+
        '<div><b>'+S.falseFlags+'</b><span>false flags</span></div>'+
      '</div>'+
      '<p class="lapwrap"><span class="lap">Lap time '+lapText()+'</span></p>'+
      '<div class="badges">'+
        b.map(function(x){
          return '<span class="badge'+(x.on?" on":"")+'"><svg viewBox="0 0 24 24">'+I[x.i]+'</svg>'+x.t+'</span>';
        }).join("")+
      '</div>'+
      '<div class="sharecard"><p>'+esc(share)+'</p><button class="btn ghost" id="copyshare">Copy</button></div>'+
      '<button class="btn ghost" id="showmiss">'+(miss.length
          ? "See the "+miss.length+" that got past you"
          : "See the full read out")+'</button>'+
      '<div id="missbox" hidden>'+coachInner+'</div>'+
      '<p class="tiny" style="margin-top:18px">Ranks and the top three codenames get read out at the next meeting.</p>'+
    '</div>';
  document.getElementById("step").textContent = "Done";
  document.getElementById("score").classList.add("hidden");
  var mb = document.getElementById("missbox"), sm = document.getElementById("showmiss");
  sm.addEventListener("click", function(){
    mb.hidden = !mb.hidden;
    sm.textContent = mb.hidden
      ? (miss.length ? "See the "+miss.length+" that got past you" : "See the full read out")
      : "Hide";
  });
  document.getElementById("copyshare").addEventListener("click", function(){
    var self = this;
    function done2(){ self.textContent = "Copied"; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(share).then(done2, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = share; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done2(); }catch(e){ self.textContent = "Select the line above"; }
      ta.remove();
    }
  });
}

buildTrack();
render();
window.__BTM = S;
window.__BTM_CARDS = CARDS;
})();
</script>
