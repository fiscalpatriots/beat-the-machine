/* ---------- the call, in two steps ----------
   Tapping Let it stand or Flag it selects it and opens the basis row. Nothing is committed and
   nothing is revealed until Lock it in. Until then the other button is still live, the chips are
   still open, and Back reopens the line before this one with its own basis and words intact. */
function callCard(i, round){
  var c = cardsOf(round)[i];
  if(round === 2){ if(!S.r2Start) S.r2Start = Date.now(); }
  else if(!S.lapStart) S.lapStart = Date.now();
  S.itemStart = Date.now();
  S.itemHiddenBase = hiddenNow();
  saveRun();
  var prev = (i > 0) ? cardsOf(round)[i-1] : null;
  var backBtn = prev
    ? '<div class="backrow"><button class="btn-text quiet" id="backline">Back to '+
      (round === 2 ? "fresh line " : "line ")+prev.n+'</button></div>'
    : "";
  screen.innerHTML =
    whyLine("Read the memo against the ledger and the file, then make the call you would defend to a reviewer.")+
    '<div class="card">'+
      cardBody(c, round, i)+
      '<p class="ask">Does the memo\'s explanation hold?</p>'+
      '<div class="two calls">'+
        '<button class="btn call" id="stand" aria-pressed="false">Let it stand'+
          '<span class="kbd ink">1</span></button>'+
        '<button class="btn call" id="flag" aria-pressed="false">Flag it'+
          '<span class="kbd ink">2</span></button>'+
      '</div>'+
      '<div class="commit" id="commit" hidden></div>'+
    '</div>'+
    backBtn;
  wireLedger();

  var standBtn = document.getElementById("stand"), flagBtn = document.getElementById("flag");
  var commit = document.getElementById("commit");

  function paintButtons(){
    var sel = selOf(round)[i];
    [["stand", standBtn], ["flag", flagBtn]].forEach(function(pair){
      var on = sel === pair[0];
      pair[1].setAttribute("aria-pressed", on ? "true" : "false");
      pair[1].classList.toggle("on", on);
      pair[1].classList.toggle("dim", !!sel && !on);
    });
  }

  function paintCommit(){
    var sel = selOf(round)[i];
    if(!sel){ commit.hidden = true; commit.innerHTML = ""; return; }
    var opts = basisChips(sel);
    var picked = (basisOf(round)[i] || []).slice();
    var wordsBox = (sel === "flag")
      ? '<label class="basiswords" for="basiswords">In your words (optional)</label>'+
        '<input type="text" id="basiswords" class="basisinput" maxlength="140" '+
        'placeholder="One line, if you want to add one" value="'+esc(wordsOf(round)[i] || "")+'">'
      : "";
    commit.hidden = false;
    commit.innerHTML =
      '<div class="basis">'+
        '<p class="ask">You said '+(sel === "flag" ? "flag it" : "let it stand")+'. What is your basis?</p>'+
        '<p class="tiny basishint">Tap at least one. More than one is fine.</p>'+
        '<div class="chips" role="group" aria-label="Your basis">'+
          opts.map(function(o, k){
            var on = picked.indexOf(o) > -1;
            return '<button type="button" class="chip'+(on ? " on" : "")+'" data-k="'+k+'" '+
                   'aria-pressed="'+(on ? "true" : "false")+'">'+esc(o)+'</button>';
          }).join("")+
        '</div>'+
        wordsBox+
        '<button class="btn" id="lockin"'+(picked.length ? "" : " disabled")+'>Lock it in'+
          '<span class="kbd">Enter</span></button>'+
        '<p class="tiny locknote">Nothing is scored until you lock it in, and you can change '+
          'your call until then.</p>'+
      '</div>';
    var lockBtn = document.getElementById("lockin");
    Array.prototype.forEach.call(commit.querySelectorAll(".chip"), function(b){
      function toggle(){
        var o = opts[Number(b.getAttribute("data-k"))];
        var list = basisOf(round)[i] || [];
        var at = list.indexOf(o);
        if(at === -1) list = list.concat([o]);
        else { list = list.slice(); list.splice(at, 1); }
        /* the chips post in the order the row shows them, not the order they were tapped */
        list.sort(function(x, y){ return opts.indexOf(x) - opts.indexOf(y); });
        basisOf(round)[i] = list;
        b.classList.toggle("on", at === -1);
        b.setAttribute("aria-pressed", at === -1 ? "true" : "false");
        lockBtn.disabled = list.length === 0;
        saveRun();
      }
      b.addEventListener("click", toggle);
      /* the space bar and the return key, spelled out rather than left to the default,
         so the row works the same on a keyboard as it does under a thumb */
      b.addEventListener("keydown", function(e){
        if(e.key === " " || e.key === "Spacebar" || e.code === "Space" || e.key === "Enter"){
          e.preventDefault(); e.stopPropagation(); toggle();
        }
      });
    });
    var wordsEl = document.getElementById("basiswords");
    if(wordsEl){
      wordsEl.addEventListener("input", function(){
        wordsOf(round)[i] = wordsEl.value.replace(/[\r\n|]+/g, " ").trim();
      });
    }
    lockBtn.addEventListener("click", lock);
  }

  function select(val){
    if(selOf(round)[i] === val) return;
    if(firstOf(round)[i] === null || firstOf(round)[i] === undefined) firstOf(round)[i] = val;
    selOf(round)[i] = val;
    /* the two chip sets are not the same, so a chip that does not exist on the new set goes */
    var opts = basisChips(val);
    basisOf(round)[i] = (basisOf(round)[i] || []).filter(function(x){ return opts.indexOf(x) > -1; });
    saveRun();
    paintButtons();
    paintCommit();
  }

  function lock(){
    var val = selOf(round)[i];
    var chips = basisOf(round)[i] || [];
    if(!val || !chips.length) return;
    var wordsEl = document.getElementById("basiswords");
    wordsOf(round)[i] = wordsEl ? wordsEl.value.replace(/[\r\n|]+/g, " ").trim() : "";
    secsOf(round)[i] = S.itemStart ? Math.max(0, Math.round((Date.now() - S.itemStart)/1000)) : 0;
    asecsOf(round)[i] = S.itemStart
      ? Math.max(0, Math.round((Date.now() - S.itemStart - (hiddenNow() - S.itemHiddenBase))/1000))
      : 0;
    callsOf(round)[i] = val;
    if(i === lastIndex(round)){
      if(round === 2) S.r2End = Date.now(); else S.lapEnd = Date.now();
    }
    if(round === 2){
      rescore2();
      saveRun();
      if(ASSESS) return go(i === LINES2 - 1 ? 92 : S.step + 1);
      return reveal(i, 2);
    }
    var wasRank = rank();
    rescore();
    saveRun();
    LEVELED = (rank() !== wasRank);
    carFx(S.calls[i] === CARDS[i].key);
    reveal(i, 1);
  }

  function goBack(){
    if(!prev) return;
    /* the line before this one comes back live: its call is uncommitted, and its basis and
       its words are still there to be changed */
    callsOf(round)[i-1] = null;
    if(round === 2) rescore2(); else rescore();
    saveRun();
    go(S.step - 1);
  }

  standBtn.addEventListener("click", function(){ select("stand"); });
  flagBtn.addEventListener("click", function(){ select("flag"); });
  if(prev) document.getElementById("backline").addEventListener("click", goBack);

  setKeys(function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(sheetOpen()){
      if(e.key === "Escape"){ e.preventDefault(); var sh = document.getElementById("sheet"); if(sh) sh.remove(); }
      return;
    }
    var t = e.target, tag = t && t.tagName;
    var typing = tag === "INPUT" || tag === "TEXTAREA";
    if(e.key === "1" && !typing){ e.preventDefault(); select("stand"); }
    else if(e.key === "2" && !typing){ e.preventDefault(); select("flag"); }
    else if(e.key === "Enter"){
      if(t && t.classList && t.classList.contains("chip")) return;
      e.preventDefault(); lock();
    }
    else if(e.key === "Backspace" && !typing){ e.preventDefault(); goBack(); }
  });

  paintButtons();
  paintCommit();
}

/* ---------- the basis row ----------
   One tap row between the call and the reveal, so the response sheet carries the reason
   the player actually held rather than a label the answer key supplied afterwards. At
   least one chip. The line of their own words is offered on a flag and never required. */
var BASIS_FLAG = ["figure does not tie", "direction wrong", "no source on file",
                  "wrong period", "wrong account", "nothing written where owed"];
var BASIS_HOLD = "the figure and reason hold";
function basisChips(val){
  return (val==="stand") ? [BASIS_HOLD].concat(BASIS_FLAG) : BASIS_FLAG.slice();
}

/* ---------- the reason, scored separately from the call ----------
   Every card carries a basisKey: the chips that are correct on that card. A chip outside that
   set contradicts the key for that card, which is why "wrong account" on a clean line is wrong
   rather than merely unhelpful. A reason counts as right when the player tapped at least one
   chip in the key and no chip outside it. It is a compatibility check on the stated basis and
   not a rubric score, it is counted separately from the call, and it never moves the rank or
   the badges. The three-dimension reasoning rubric is scored by a person outside this page. */
function basisKeyOf(c){
  if(c.basisKey && c.basisKey.length) return c.basisKey;
  return (c.key === "stand") ? [BASIS_HOLD] : [];
}
function reasonRight(c, chips){
  var key = basisKeyOf(c);
  if(!key.length || !chips || !chips.length) return false;
  for(var i=0;i<chips.length;i++){
    if(key.indexOf(chips[i]) === -1) return false;
  }
  return true;
}
function reasonRightAt(idx, round){
  var c = (round===2) ? CARDS2[idx] : CARDS[idx];
  var call = (round===2) ? S.r2calls[idx] : S.calls[idx];
  if(!c || call === null || call === undefined) return false;
  return reasonRight(c, (round===2) ? S.r2basis[idx] : S.basis[idx]);
}
function reasonCount(round){
  var list = (round===2) ? CARDS2 : CARDS, n = 0;
  for(var i=0;i<list.length;i++){ if(reasonRightAt(i, round)) n++; }
  return n;
}
/* the lines the coach section names: the call agreed with the key and the reason did not */
function rightCallWrongReason(round){
  var list = (round===2) ? CARDS2 : CARDS, out = [];
  for(var i=0;i<list.length;i++){
    var call = (round===2) ? S.r2calls[i] : S.calls[i];
    if(call === list[i].key && !reasonRightAt(i, round)) out.push(list[i]);
  }
  return out;
}
function basisKeyText(c){
  var k = basisKeyOf(c);
  return k.length ? k.join("; ") : "none recorded";
}
function reasonNote(idx, round){
  var c = (round===2) ? CARDS2[idx] : CARDS[idx];
  return reasonRightAt(idx, round)
    ? '<p class="tiny" style="margin:8px 0 0"><b>Your reason agrees with the key.</b></p>'
    : '<p class="tiny" style="margin:8px 0 0"><b>Your reason does not agree with the key.</b> '+
      'On this line the basis is: '+esc(basisKeyText(c))+'.</p>';
}
function openNote(c){
  return c.stillOpen ? '<p class="tiny" style="margin:8px 0 0"><b>Still open.</b> '+esc(c.stillOpen)+'</p>' : "";
}

/* ---------- the reveal ----------
   It takes the card area for a beat. A call that agrees with the answer key turns over to a
   verdict face carrying the points it earned, counting up; a call that does not gets a calm
   face with what was actually true, the ask the reviewer should have made, and the line from
   the case that teaches it. Nothing here plays a sound. */
var LEVELED = false;
function countUp(el, to){
  if(!el) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce || !to){ el.textContent = pointsText(to); return; }
  var t0 = 0, dur = 520;
  function frame(ts){
    if(!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur);
    el.textContent = pointsText(Math.round(to * (1 - Math.pow(1 - k, 3))));
    if(k < 1) window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
}
/* the run of correct calls that stood before this line, so a broken streak can be named */
function streakBefore(i){
  var st = 0;
  for(var k = 0; k < i; k++){
    var call = S.calls[k];
    if(call === null || call === undefined){ st = 0; continue; }
    st = (call === CARDS[k].key) ? st + 1 : 0;
  }
  return st;
}
/* the running score and the rank, on both faces */
function runState(round){
  var seen = doneIn(callsOf(round));
  var right = (round === 2) ? (S.r2caught + S.r2cleared) : (S.caught + S.cleared);
  var pr = rankProgress();
  return '<div class="runstate">'+
    '<p class="counts"><span><b>'+right+'</b>of '+seen+' right</span>'+
      '<span><b>'+pointsText(S.points)+'</b>points</span></p>'+
    '<div class="rmbar"><i style="width:'+pr.pct+'%"></i></div>'+
    '<p class="tiny runnext">'+esc(pr.name)+'. '+(pr.next
      ? pointsText(pr.need)+' points to '+esc(pr.next)+'.'
      : 'Partner is the top rank.')+'</p>'+
  '</div>';
}

function reveal(i, round){
  var c = cardsOf(round)[i];
  var call = callsOf(round)[i];
  var right = call === c.key;
  var scored = (round === 1);
  var last = i === lastIndex(round);
  progress();

  var head = right
    ? (c.key === "flag" ? "Caught it" : "Cleared it")
    : (c.key === "flag" ? "It got past you" : "A false flag");
  var face;
  if(right){
    var p = (scored && LINE_PTS[i])
      ? LINE_PTS[i]
      : linePoints(c, call, basisOf(round)[i], 0);
    var rows = '<li><span>Right call</span><b>+'+PT_CALL+'</b></li>';
    rows += p.reason
      ? '<li><span>Basis agrees with the key</span><b>+'+PT_REASON+'</b></li>'
      : '<li class="none"><span>Basis does not agree with the key</span><b>0</b></li>';
    if(p.streak) rows += '<li><span>'+p.streakAt+' in a row</span><b>+'+PT_STREAK+'</b></li>';
    if(p.cover) rows += '<li><span>Cover story caught</span><b>+'+PT_COVER+'</b></li>';
    var pts = scored
      ? '<div class="ptsblock">'+
          '<p class="ptstotal"><span id="ptscount">0</span><i>points on this line</i></p>'+
          '<ul class="ptslist">'+rows+'</ul>'+
        '</div>'
      : '';
    face =
      '<div class="reveal good turn" id="revface">'+
        '<span class="revtype">'+esc(c.type)+'</span>'+
        '<h2 class="verdict">'+head+'</h2>'+
        '<p class="revtell">'+esc(c.tell)+'</p>'+
        pts+
        (LEVELED ? '<p class="levelup">New rank, '+esc(rank())+'.</p>' : '')+
      '</div>';
  } else {
    var truth = (c.key === "flag") ? c.truth : c.over;
    var ask = (c.key === "flag")
      ? c.ask
      : "Nothing to ask on this line. The figure and the reason both held, and flagging a line "+
        "like this costs the controller time on work that was already right.";
    var broke = scored ? streakBefore(i) : 0;
    var nil = scored
      ? ("No points on this line." + (broke >= 2 ? " Your run of " + broke + " in a row ends here." : ""))
      : "";
    face =
      '<div class="reveal bad turn" id="revface">'+
        '<span class="revtype">'+esc(c.type)+'</span>'+
        '<h2 class="verdict">'+head+'</h2>'+
        '<p class="revtruth">'+esc(truth)+'</p>'+
        '<div class="askbox"><span class="label">The ask</span><p>'+esc(ask)+'</p></div>'+
        (nil ? '<p class="revnil">'+esc(nil)+'</p>' : '')+
        '<p class="revcoach">'+esc(c.tell)+'</p>'+
      '</div>';
  }

  var nextLabel = last
    ? (round === 2 ? "See how you did" : "Start round two")
    : "Next line";
  screen.innerHTML =
    whyLine("This is what the answer key says about the call you just locked in.")+
    face+
    (reasonRightAt(i, round) ? "" : reasonNote(i, round))+
    openNote(c)+
    runState(round)+
    ledgerBig(c.acct, round === 2 ? 2 : undefined)+
    '<button class="btn" id="next">'+nextLabel+'<span class="kbd">Enter</span></button>';
  wireLedger();
  if(scored && right) countUp(document.getElementById("ptscount"), (LINE_PTS[i] || {}).total || 0);
  if(LEVELED){ flashRank(); LEVELED = false; }
  function onward(){
    if(last) return go(round === 2 ? STEP_DONE : (HAS_R2 ? STEP_BRIDGE : STEP_DONE));
    go(S.step + 1);
  }
  document.getElementById("next").addEventListener("click", onward);
  setKeys(function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(sheetOpen()){
      if(e.key === "Escape"){ e.preventDefault(); var sh = document.getElementById("sheet"); if(sh) sh.remove(); }
      return;
    }
    if(e.key === "Enter" || e.key === " " || e.code === "Space"){ e.preventDefault(); onward(); }
  });
  window.scrollTo(0, 0);
}

      'The call and the reason are counted separately. The figures, the directions and the '+
      'threshold readings were already right on every line, so each one turned on whether '+
      'the cause the memo names is carried by something on file.</p>'+

/* ---------- generated summaries. Nothing here is typed by the player. ---------- */
/* the round one free text question, entry.1115022539, asks nothing in this version. The ledger
   screen is orientation only, so the question carries this fixed note, the one it carried before
   the ledger-only picks were added and after they were removed on 13 September 2026. */
var ROUND1_NOTE = "Not collected. The ledger screen is orientation only in this version.";
/* the player's own basis, in the shape the response sheet reads:
   Basis: no source on file; wrong period | Words: the freight moved */
function basisText(chips, words){
  var out = "Basis: " + ((chips && chips.length) ? chips.join("; ") : "none recorded");
  if(words) out += " | Words: " + words;
  return out;
}

function flaggedAccounts(){
  var out = [];
  CARDS.forEach(function(c){ if(c.key==="flag" && out.indexOf(c.acct)===-1) out.push(c.acct); });
  return out;
}
function acctName(code){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===code) return code+" "+ROWS[i][1]; }
  return code;
}
function missedCards(){
  var out = [];
  CARDS.forEach(function(c,idx){ if(S.calls[idx] !== c.key) out.push(c); });
  return out;
}
function missedCards2(){
  var out = [];
  CARDS2.forEach(function(c,idx){ if(S.r2calls[idx] !== c.key) out.push(c); });
  return out;
}
/* ---------- the fresh case, scored on its own ----------
   The whole of round two rides in one string on question C, which asks the player
   nothing and carried only a placeholder before 13 September 2026. F is a flag and S
   is let it stand, in card order, so the sheet can be read without opening the game. */
function r2Right(){ return S.r2caught + S.r2cleared; }
function letters(list){
  return list.map(function(v){ return (v==="flag") ? "F" : "S"; }).join("");
}
function r2Seconds(){
  if(!S.r2Start) return 0;
  return Math.round(((S.r2End || Date.now()) - S.r2Start)/1000);
}
function r2Line(){
  if(!HAS_R2) return "Round2: no fresh case on this run.";
  var bas = [];
  for(var i=0;i<LINES2;i++){
    bas.push((i+1)+": "+basisText(S.r2basis[i], S.r2words[i])+
             " | Reason: "+(reasonRightAt(i,2) ? "agrees" : "does not agree")+
             " | Key basis: "+basisKeyText(CARDS2[i]));
  }
  return "Round2: right call "+r2Right()+"/"+LINES2+", right reason "+reasonCount(2)+"/"+LINES2+"; calls "+
         letters(S.r2calls.map(function(v){ return v || "stand"; }))+
         "; key "+letters(CARDS2.map(function(c){ return c.key; }))+
         "; seconds "+r2Seconds()+". Round2 basis, by line: "+bas.join(" || ")+".";
}
/* The organization taps ride at the front of question A, behind a fixed prefix, so the
   responses sheet can be counted by chapter without a new form question. */
function orgLine(){ return "Organizations: " + S.orgs.join("; ") + "."; }
function caseLine(){
  return "Case: " + CASE_RUN_ID + ", version " + CASE1.version + " (practice, " + LINES + " lines)" +
         (HAS_R2 ? " and " + CASE2.version + " (" + (ASSESS ? "assessment" : "practice") + ", " + LINES2 + " lines)" : ", no fresh case") +
         ", dated " + CASE1.date + ", loaded from " + CASE_SOURCE + ".";
}
function versionLine(){
  return "Product: " + PRODUCT_STAMP + ". Notice: " + NOTICE_VERSION +
         ". Mode: round one practice, round two " + (ASSESS ? "assessment" : "practice") +
         (S.testAttempt ? ". TEST ATTEMPT, exclude from reports." : ".");
}
function summaryA(){
  return orgLine() + " " + versionLine() + " " + caseLine();
}

function summaryB(){
  var miss = missedCards();
  var parts = [];
  /* the attempt identifier. Every retry of the same run posts this same string, so a row
     that appears twice is one attempt sent twice and must be counted once. */
  parts.push("Attempt id: " + S.attemptId + ", run " + S.runIndex + " in this tab. " +
             "Reason score: " + reasonCount(1) + " of " + LINES + " in round one and " + reasonCount(2) +
             " of " + LINES2 + " on the fresh case. A reason counts as right when every chip tapped is in " +
             "the card's basis key and at least one was tapped. It is scored apart from the " +
             "call and it does not move the rank.");
  parts.push(miss.length
    ? "Lines missed: " + miss.map(function(c){ return c.n+" "+c.acct+" ("+c.type+")"; }).join("; ") + "."
    : "No lines missed.");
  parts.push("Pattern: " + patternLine());
  parts.push("Result: right call " + (S.caught+S.cleared) + " of " + LINES + ", right reason " + reasonCount(1) +
             " of " + LINES + ", " + S.caught + " caught, " +
             S.cleared + " let stand correctly, " + S.falseFlags + " false flag" + (S.falseFlags===1?"":"s") +
             ", " + pointsText(S.points) + " points, rank " + rank() + ".");
  parts.push("Four questions on the form (expected quality, confidence before, confidence after, close experience) are not asked in this version. They carry a placeholder value the question accepts and are not participant answers.");
  parts.push("Longest run of correct calls: " + S.best + ".");
  return parts.join(" ");
}

function typeNoun(type, n){
  if(type==="clean line") return n===1 ? "clean line" : "clean lines";
  return type + (n===1 ? " problem" : " problems");
}
function patternLine(){
  var tally = {};
  CARDS.forEach(function(c,idx){
    if(!tally[c.type]) tally[c.type] = {tot:0, miss:0};
    tally[c.type].tot++;
    if(S.calls[idx] !== c.key) tally[c.type].miss++;
  });
  var clean = [], bad = [];
  Object.keys(tally).forEach(function(t){
    var v = tally[t];
    if(v.miss===0 && v.tot>=2) clean.push({t:t, tot:v.tot});
    if(v.miss>0) bad.push({t:t, tot:v.tot, miss:v.miss});
  });
  if(!bad.length) return "you agreed with the answer key on all " + numWord(LINES) + " lines.";
  bad.sort(function(a,b){ return b.miss - a.miss; });
  var worst = bad[0];
  var badBit;
  if(worst.miss === worst.tot && worst.tot > 1) badBit = (worst.tot===2 ? "both " : "all "+worst.tot+" ") + typeNoun(worst.t, worst.tot) + " got past you";
  else if(worst.miss === worst.tot) badBit = "the " + typeNoun(worst.t,1) + " got past you";
  else badBit = "you missed " + worst.miss + " of the " + worst.tot + " " + typeNoun(worst.t, worst.tot);
  if(clean.length){
    clean.sort(function(a,b){ return b.tot - a.tot; });
    return "you caught every " + typeNoun(clean[0].t, 1) + ", and " + badBit + ".";
  }
  if(bad.length > 1){
    var second = bad[1];
    return badBit + ", and the " + typeNoun(second.t,1) + " went the same way.";
  }
  return badBit + ".";
}

/* the rank is read off the points, and the points are set out above the header meter */
function rank(){ return rankAt(S.points || 0).name; }
function tier(){
  var right = S.caught + S.cleared;
  if(right>=LINES) return "sweep";
  if(right>=LINES-1) return "gold";
  if(right>=LINES-3) return "silver";
  return "bronze";
}
function allStandsRight(){
  return CARDS.every(function(c,idx){ return c.key!=="stand" || S.calls[idx]==="stand"; });
}

/* ---------- payload and submit ---------- */
/* PLACEHOLDER_MODE decides what the four unasked questions carry. "numeric" posts a value the
   question actually accepts, which is what Google Forms requires while all four are marked
   required. Once Khaled makes those four questions optional in the form editor, change this one
   word to "empty" and the four fields post nothing at all. Nothing else has to change.
   See README, "The four questions that are not asked". */
var PLACEHOLDER_MODE = "numeric";
var PLACEHOLDERS = PLACEHOLDER_MODE === "empty"
  ? { expect:"", confPre:"", experience:"", confPost:"" }
  : { expect:"3", confPre:"5", experience:"Once or twice", confPost:"5" };

function payload(){
  var p = {};
  p["entry."+E.codename] = S.codename;
  p["entry."+E.round1] = ROUND1_NOTE;
  /* Four questions on the form are not asked in this version: expected quality, confidence
     before, close experience and, below, final confidence. All four are marked required and
     three of them are linear scales, so the posted value has to be one the question accepts.
     These are placeholders, not answers, and the findings script must exclude them.
     PLACEHOLDER_MODE is the one switch. */
  p["entry."+E.expect] = PLACEHOLDERS.expect;
  p["entry."+E.confPre] = PLACEHOLDERS.confPre;
  p["entry."+E.experience] = PLACEHOLDERS.experience;
  for(var i=0;i<Math.min(LINES, E.call.length);i++){
    var c = CARDS[i];
    var call = S.calls[i] || "stand";
    p["entry."+E.call[i]] = c.post[call];
    p["entry."+E.why[i]] = basisText(S.basis[i], S.words[i]) +
                           " || Line "+c.n+", account "+c.acct+". Called: "+call+". Key: "+c.key+
                           ". Type: "+c.type+". "+(S.calls[i]===c.key ? "Correct." : "Missed.")+
                           " Reason: "+(reasonRightAt(i,1) ? "agrees." : "does not agree.")+
                           " Key basis: "+basisKeyText(c)+".";
  }
  p["entry."+E.confPost] = PLACEHOLDERS.confPost;
  p["entry."+E.qa] = summaryA();
  p["entry."+E.qb] = summaryB();
  /* question C asks the player nothing, so the fresh case rides here rather than
     costing the form a new question. The fourteen Why fields are left alone. */
  p["entry."+E.qc] = r2Line() + (HAS_R2
      ? " Fresh case: " + CASE2.company + ", case version " + CASE2.version + ", " + LINES2 + " lines, " +
        (ASSESS ? "run as an assessment with no feedback between lines. " : "run as practice. ") +
        "A company the player had not seen."
      : " This case carried no fresh set, so round two did not run.") +
      " Not a player answer to question C.";
  p["entry."+E.qd] = lapMinutes();
  var fbzx = String(Math.floor(Math.random()*9007199254740991));
  p["fvv"] = "1";
  p["pageHistory"] = "0,1,2";
  p["fbzx"] = fbzx;
  p["partialResponse"] = '[null,null,"'+fbzx+'"]';
  p["submissionTimestamp"] = "-1";
  return p;
}

function asText(){
  var out = ["Second Pass: Beat the Machine at Mason", "Codename: "+S.codename, orgLine(),
             versionLine(), caseLine(), "Attempt id: "+S.attemptId, ""];
  out.push("Four questions on the form were not asked in this version and carry a placeholder value, not an answer.");
  out.push("");
  for(var i=0;i<LINES;i++){
    out.push("Line "+(i+1)+" ("+CARDS[i].acct+"): "+S.calls[i]+", key "+CARDS[i].key+", "+
             CARDS[i].type+". "+basisText(S.basis[i], S.words[i])+
             " | Reason: "+(reasonRightAt(i,1) ? "agrees" : "does not agree")+
             " | Key basis: "+basisKeyText(CARDS[i]));
  }
  out.push("");
  for(var j=0;j<LINES2;j++){
    out.push("Fresh line "+(j+1)+" ("+CARDS2[j].acct+"): "+S.r2calls[j]+", key "+CARDS2[j].key+", "+
             CARDS2[j].type+". "+basisText(S.r2basis[j], S.r2words[j])+
             " | Reason: "+(reasonRightAt(j,2) ? "agrees" : "does not agree")+
             " | Key basis: "+basisKeyText(CARDS2[j]));
  }
  out.push("");
  out.push(summaryA());
  out.push(summaryB());
  out.push(r2Line());
  out.push("Lap time: "+lapText()+", posted as "+lapMinutes()+" minute(s)");
  return out.join("\n");
}

/* ---------- the attempt record ----------
   The fields the build handoff calls the minimum attempt record, in the names this codebase
   already uses. Everything shown to the player is in it, nothing is invented, and the four
   form questions nobody was asked are reported as not asked rather than as answers. */
function itemRecord(c, idx, round){
  var call = (round===2) ? S.r2calls[idx] : S.calls[idx];
  var chips = (round===2) ? S.r2basis[idx] : S.basis[idx];
  var words = (round===2) ? S.r2words[idx] : S.words[idx];
  var secs  = (round===2) ? S.r2secs[idx] : S.secs[idx];
  var asecs = ((round===2) ? (S.r2asecs || []) : (S.asecs || []))[idx];
  return {
    item: (round===2 ? "r2-" : "r1-") + c.n,
    round: round,
    caseId: CASE_RUN_ID,
    caseVersion: (round===2 && HAS_R2 ? CASE2.version : CASE1.version),
    mode: (round===2 && ASSESS) ? "assessment" : "practice",
    account: c.acct,
    accountName: c.name,
    errorType: c.type,
    /* a call is committed in two steps and can be changed before it is locked and by going
       back a line, so the first call the player selected and the one they committed are kept
       apart. They differ on a line the player thought again about. */
    originalDecision: (round===2 ? S.r2first : S.first)[idx] || call,
    finalDecision: call,
    decisionChanged: !!((round===2 ? S.r2first : S.first)[idx] &&
                        (round===2 ? S.r2first : S.first)[idx] !== call),
    actualReasonChips: chips || [],
    actualReasonWords: words || "",
    basisKey: basisKeyOf(c).slice(),
    reasonResult: (call === null || call === undefined) ? "no call recorded"
      : (reasonRight(c, chips) ? "agrees with key" : "does not agree"),
    reasonScoringNote: "A reason agrees when every chip tapped is in basisKey and at least one was tapped. Scored apart from the call and never used for the rank or the badges.",
    /* what the card put in front of the player, which is not the same thing as
       what the player read. The release review asked for both names apart, so
       the supplied list keeps its own name and the participant-selected list is
       declared and left null rather than implied. */
    evidenceSupplied: (c.file || []).slice(),
    evidenceSelected: null,
    evidenceNote: "evidenceSupplied is the card's whole On file list. evidenceSelected is what the " +
      "player said they relied on, and this version does not ask, so it is null rather than the " +
      "supplied list under another name.",
    /* kept for one version so a reader of an older export is not left guessing */
    evidenceReferences: (c.file || []).slice(),
    confidence: null,
    confidenceNote: "not asked in this version",
    assistanceRevealed: false,
    elapsedSecondsOnCard: secs || 0,
    activeSecondsOnCard: (asecs === undefined || asecs === null) ? (secs || 0) : asecs,
    elapsedSecondsNote: "elapsedSecondsOnCard is wall-clock seconds from the card appearing to the " +
      "call being locked. activeSecondsOnCard is the same span with the time this tab spent hidden " +
      "taken out of it, measured on visibilitychange. Neither knows whether the player was reading " +
      "the card while the tab was in front.",
    /* kept for one version under its old name, which claimed more than it measured */
    elapsedActiveSeconds: secs || 0,
    skippedOrMissing: (call === null) ? "no call recorded" : null,
    feedbackRevealedAt: (round===2 && ASSESS)
      ? (S.r2Revealed ? new Date(S.r2Revealed).toISOString() : null)
      : "immediately after the call",
    keyDecision: c.key,
    decisionResult: (call === c.key) ? "agrees with key" : "does not agree"
  };
}
function attemptRecord(sentPayload){
  var responses = [];
  CARDS.forEach(function(c,i){ responses.push(itemRecord(c,i,1)); });
  CARDS2.forEach(function(c,i){ responses.push(itemRecord(c,i,2)); });
  var active = 0, activeVisible = 0;
  responses.forEach(function(r){ active += r.elapsedSecondsOnCard; activeVisible += r.activeSecondsOnCard; });
  return {
    record: "Second Pass attempt record",
    recordFormat: "btm-attempt-1",
    renamedFields: {
      note: "Two fields were renamed in 1.6.1 because their old names claimed more than they held. " +
            "The old names are written beside the new ones for this version only and come out in the next.",
      evidenceReferences: "evidenceSupplied",
      firstAttempt: "firstRunInThisTab",
      elapsedActiveSeconds: "elapsedSecondsOnCard and activeSecondsOnCard, and the two matching " +
        "fields in the timing block"
    },
    attempt: {
      id: S.attemptId,
      pseudonym: S.codename,
      pseudonymNote: "A codename is a pseudonym and not anonymity.",
      organizations: S.orgs.slice(),
      role: null,
      roleNote: "not collected in this version",
      noticeVersion: NOTICE_VERSION,
      productVersion: PRODUCT_STAMP,
      caseId: CASE_RUN_ID,
      caseVersions: {roundOne: CASE1.version, roundTwo: HAS_R2 ? CASE2.version : null,
                     caseSource: CASE_SOURCE},
      form: FORM_POST,
      modes: {roundOne: "practice", roundTwo: ASSESS ? "assessment" : "practice"},
      firstRunInThisTab: S.runIndex === 1,
      firstRunNote: "True when this is the first run in this browser tab. The page cannot tell a " +
        "first-time person from a returning one, and it does not claim to.",
      /* kept for one version under its old name, which read as a first-time participant */
      firstAttempt: S.runIndex === 1,
      runIndex: S.runIndex,
      assistanceSource: "none. No model challenge runs in this build.",
      started: S.started ? new Date(S.started).toISOString() : null,
      completed: S.completedAt ? new Date(S.completedAt).toISOString() : null,
      submissionState: S.sendState,
      submissionAttempts: S.sendAttempts,
      testAttempt: !!S.testAttempt,
      testAttemptNote: S.testAttempt
        ? "Test mode was on. Nothing was posted and this attempt is excluded from reports."
        : "Test mode was off."
    },
    /* ---- the receipt ----
       A receipt is the endpoint in receipts/Code.gs saying it stored this record: the sha256
       of the record it stored and the time it wrote the row. It is written here as well as on
       screen, so the file the player keeps carries the same string the sheet carries and the
       two can be matched line for line. The form gives no such confirmation and never has. */
    receipt: {
      endpoint: receiptEndpoint() || null,
      receipt: S.receipt || null,
      receiptShort: S.receipt ? S.receipt.slice(0,12) : null,
      storedAt: S.receiptAt || null,
      state: S.receiptState || "not offered",
      note: String(S.receiptState || "").indexOf("posted") === 0
        ? ("This is the copy on its way to the endpoint. A receipt is the sha256 of the record " +
           "that was stored, and no record can hold its own hash, so the receipt for this one is " +
           "in the copy saved from the page after the answer arrives." +
           (S.receipt ? " The receipt beside it came back from an earlier send of this same " +
             "attempt, and a repeat returns that first receipt rather than writing a second row." : ""))
        : (S.receipt
          ? "The endpoint stored this record and answered with this receipt, which is the sha256 " +
            "of the record as it was stored. A second send under the same attempt id returns this " +
            "same receipt and writes no second row."
          : (receiptEndpoint()
            ? "A receipt endpoint is set and it did not confirm this attempt. The state field says why."
            : "No receipt endpoint is set in this build, so nothing confirms receipt to this page."))
    },
    responses: responses,
    scoring: {
      caseId: CASE_RUN_ID,
      keyVersions: {roundOne: CASE1.version, roundTwo: HAS_R2 ? CASE2.version : null},
      roundOne: {right: S.caught + S.cleared, of: LINES, rightReason: reasonCount(1), reasonOf: LINES,
                 caught: S.caught, letStandCorrectly: S.cleared, falseFlags: S.falseFlags,
                 longestRun: S.best, points: S.points, rank: rank()},
      points: {total: S.points, rightCall: PT_CALL, rightReason: PT_REASON,
               streakStepFrom: STREAK_FROM, streakStep: PT_STREAK, coverStory: PT_COVER,
               ladder: RANKS.map(function(r){ return {rank: r.name, at: r.at}; }),
               maxAttainable: RANK_MAX, blanketCallCeiling: RANK_BLANKET,
               ladderBasis: "Each rank starts at a share of the points this case can give: " +
                            "Staff 34, Senior 57, Manager 76 and Partner 95 percent of " +
                            RANK_MAX + ". The Senior line is held above " + RANK_BLANKET +
                            ", the most a blanket call can score on this case.",
               basis: "Points and rank are read off the " + LINES + " trained lines" +
                      (HAS_R2 ? ". The fresh case is scored on its own." : ". This case carried no fresh set.")},
      roundTwo: {right: r2Right(), of: LINES2, rightReason: reasonCount(2), reasonOf: LINES2,
                 caught: S.r2caught, letStandCorrectly: S.r2cleared, falseFlags: S.r2false},
      rankBasis: "points earned on the " + LINES + " trained lines. The reason score adds points " +
                 "and never moves the badges.",
      badgesEarned: badges().map(function(b){ return b.t; }),
      changedCallsRight: changedMind(),
      humanRubricScores: null,
      scorerId: null,
      outOfKeyFinding: null,
      adjudication: null,
      exclusionReason: S.testAttempt ? "test attempt" : null,
      finalResolution: null,
      rubricNote: "The three-dimension reasoning rubric is scored by a person outside this page."
    },
    timing: {
      roundOneLapSeconds: Math.round(lapMs()/1000),
      roundOneLapMinutesPosted: lapMinutes(),
      roundTwoSeconds: r2Seconds(),
      elapsedSecondsOnCards: active,
      activeSecondsOnCards: activeVisible,
      elapsedSecondsNote: "Both are summed over the nineteen cards. elapsedSecondsOnCards is " +
        "wall-clock. activeSecondsOnCards takes out the time this tab spent hidden, measured on " +
        "visibilitychange. Neither knows whether the player was reading while the tab was in front.",
      hiddenSecondsInRun: Math.round(hiddenNow()/1000),
      /* kept for one version under its old name */
      elapsedActiveSeconds: active
    },
    notAsked: {
      questions: ["expected quality", "confidence before", "confidence after", "close experience"],
      note: "Not asked on screen. The form marks all four required, so a placeholder the " +
            "question accepts is posted. Drop these four columns rather than averaging them.",
      placeholderMode: PLACEHOLDER_MODE
    },
    payload: sentPayload || payload(),
    payloadNote: (S.testAttempt && !onHarness())
      ? "Test mode. This is the payload the page would have sent, and it was not sent."
      : (S.sendState === "sent, not confirmed"
        ? ("This payload was posted to the form. The form does not confirm receipt to this page. " +
           (S.receipt
             ? "The record above was stored by the receipt endpoint under receipt " + S.receipt.slice(0,12) + "."
             : "Nothing else confirms it either."))
        : "This payload has not been posted.")
  };
}
function recordText(){ return JSON.stringify(attemptRecord(window.__BTM_LAST_POST), null, 2); }

/* ---------- the send ----------
   Voluntary, and off entirely in test mode. A retry reuses the same attempt id, so two rows
   under one id are one attempt sent twice and get counted once. The form post proves only that
   the request left the page: the hidden frame's load event fires either way, which is why the
   wording for a form-only send says sent and not stored.

   With RECEIPT_ENDPOINT set, the record goes there first. That endpoint answers with a receipt
   or it does not, and the form post runs afterwards in both cases, so a player whose receipt
   fails is in exactly the position they were in before this existed and never worse. */
var sending = false;
function sendResults(onState){
  if(sending) return;
  var p = payload();
  window.__BTM_LAST_POST = p;
  S.sendAttempts++;
  /* test mode posts nothing anywhere, unless the local harness is pointing both posts at a
     server on this machine, which is the only way the receipt path can be proven end to end */
  if(S.testAttempt && !onHarness()){
    S.sendState = "not sent, test mode";
    S.receiptState = "not offered, test mode";
    saveRun();
    return onState();
  }
  sending = true;
  S.sendState = "sending";
  saveRun();
  onState();

  var rcpt = receiptEndpoint();
  if(!rcpt){
    S.receiptState = "not offered";
    return postToForm(formEndpoint(), p, onState);
  }
  postReceipt(rcpt, function(res){
    if(res && res.ok && res.receipt){
      S.receipt = String(res.receipt);
      S.receiptAt = String(res.storedAt || new Date().toISOString());
      S.receiptState = res.duplicate ? "confirmed, this attempt was already stored" : "confirmed";
    } else {
      S.receipt = ""; S.receiptAt = "";
      S.receiptState = "no receipt: " + ((res && res.error) || "the endpoint did not answer");
    }
    saveRun();
    postToForm(formEndpoint(), p, onState);
  });
}

/* The record, posted as JSON, with no header set on purpose. A request with no custom headers
   and the default content type is a simple one, and a simple one is what an Apps Script web app
   answers across origins; adding a JSON content type would ask for a preflight it never answers. */
function postReceipt(url, done){
  var settled = false;
  function finish(res){ if(settled) return; settled = true; done(res); }
  if(typeof window.fetch !== "function"){
    return finish({ok:false, error:"this browser cannot post the record"});
  }
  var body;
  /* the copy that goes over the wire says what it is, because the receipt is the hash of this
     very record and no record can carry its own hash */
  S.receiptState = "posted, waiting for the endpoint to answer";
  try{ body = JSON.stringify(attemptRecord(window.__BTM_LAST_POST)); }
  catch(e){ return finish({ok:false, error:"the record could not be written out"}); }
  var timer = setTimeout(function(){
    finish({ok:false, error:"the endpoint did not answer within twelve seconds"});
  }, 12000);
  window.fetch(url, {method:"POST", body:body, redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(text){
      clearTimeout(timer);
      var res = null;
      try{ res = JSON.parse(text); }catch(e){ res = null; }
      if(res && res.ok && res.receipt) finish(res);
      else finish({ok:false, error:(res && res.error) ? String(res.error) : "the endpoint did not confirm"});
    })
    .catch(function(){
      clearTimeout(timer);
      finish({ok:false, error:"the endpoint could not be reached"});
    });
}

/* The form post, unchanged in what it does and now taking its address from one place. */
function postToForm(action, p, onState){
  var f = document.createElement("form");
  f.action = action; f.method = "POST"; f.target = "gfsink"; f.style.display = "none";
  Object.keys(p).forEach(function(k){
    var inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = p[k];
    f.appendChild(inp);
  });
  document.body.appendChild(f);
  var settled = false;
  var sink = document.getElementById("gfsink");
  function finish(state){
    if(settled) return;
    settled = true; sending = false;
    S.sendState = state; saveRun(); onState();
  }
  var timer = setTimeout(function(){ finish("send did not go through"); }, 12000);
  sink.addEventListener("load", function(){
    clearTimeout(timer);
    finish("sent, not confirmed");
  });
  try{ f.submit(); }
  catch(err){ clearTimeout(timer); finish("send did not go through"); }
}

/* ---------- the trophy, drawn to the tier ---------- */
/* green and gold, with the cup carrying the tier */
var TROPHY = {
  bronze:{body:"#a7c6b6", dark:"#005239", name:"green"},
  silver:{body:"#4f9377", dark:"#005239", name:"deep green"},
  gold:{body:"#ffc733", dark:"#005239", name:"gold"},
  sweep:{body:"#ffc733", dark:"#005239", name:"gold, clean sweep"}
};
function trophySvg(t){

  var star = t==="sweep"
    ? '<path d="M50 4l3.6 7.6 8.4 1.2-6 5.9 1.4 8.3L50 23.1l-7.4 3.9 1.4-8.3-6-5.9 8.4-1.2z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="1.4" stroke-linejoin="round"/>'
    : "";
  return '<svg class="trophy '+t+'" viewBox="0 0 100 104" role="img" aria-label="'+c.name+' trophy">'+
    '<defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".75"/>'+
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
      '<clipPath id="cupclip"><path d="M30 30h40v18a20 20 0 0 1-40 0z"/></clipPath></defs>'+
    star+
    '<path d="M30 30h40v18a20 20 0 0 1-40 0z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<g clip-path="url(#cupclip)"><rect class="glint" x="-40" y="28" width="26" height="44" fill="url(#shine)"/></g>'+
    '<path d="M30 34H20a10 10 0 0 0 10 12M70 34h10a10 10 0 0 1-10 12" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M50 68v12M36 92h28l-3-12H39z" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="M32 98h36" stroke="'+c.dark+'" stroke-width="3.4" stroke-linecap="round"/>'+
  '</svg>';
}

/* ---------- the badges, earned off the key. Only what was earned shows, best three first ---------- */
/* A badge used to name its lines by number, which only worked while every run was the
   fourteen-line Halyard case. It reads the error type instead, so the same badge means the
   same thing on a case of any length: every line of that type agreed with the key, and the
   case has at least one such line. On Halyard the set a perfect run earns is unchanged. */
function allOfType(){
  var want = Array.prototype.slice.call(arguments), seen = 0, i;
  for(i=0;i<CARDS.length;i++){
    if(want.indexOf(CARDS[i].type) < 0) continue;
    seen++;
    if(S.calls[i] !== CARDS[i].key) return false;
  }
  return seen > 0;
}
/* a call the player selected one way, changed, and locked the other way, where the locked
   one agreed with the key. Both rounds count, because both rounds let a call be changed. */
function changedMind(){
  var out = 0, i;
  for(i=0;i<CARDS.length;i++){
    if(S.first[i] && S.calls[i] && S.first[i] !== S.calls[i] && S.calls[i] === CARDS[i].key) out++;
  }
  for(i=0;i<CARDS2.length;i++){
    if(S.r2first[i] && S.r2calls[i] && S.r2first[i] !== S.r2calls[i] && S.r2calls[i] === CARDS2[i].key) out++;
  }
  return out;
}
function noFalseFlags(){ return S.falseFlags === 0 && S.r2false === 0; }
function badges(){
  var right = S.caught + S.cleared;
  var steady = noFalseFlags();
  return [
    {t:"Clean sweep",        on: right===LINES, i:"coins"},
    /* the only badge the fresh case can earn, and it sits second because reading a
       company cold is the hardest thing on the card */
    {t:"Cold read",          on: HAS_R2 && r2Right()===LINES2, i:"ledger"},
    {t:"Hot lap",            on: S.best>=5, i:"fuel"},
    {t:"Steady hand",        on: steady, i:"badge"},
    {t:"Second thoughts",    on: changedMind()>0, i:"wrench"},
    /* the round one version of the steady hand, and it stands down when that one is earned
       rather than printing the same fact twice */
    {t:"Nothing over-flagged", on: allStandsRight() && !steady, i:"box"},
    {t:"Arithmetic hawk",    on: allOfType("arithmetic"), i:"scales"},
    {t:"Unsupported driver caught", on: allOfType("unsupported driver"), i:"glass"},
    {t:"Read the silence",   on: allOfType("no explanation"), i:"flag"},
    {t:"Traced the movement", on: allOfType("unsupported attribution"), i:"brief"},
    {t:"Timing and drift",   on: allOfType("timing", "wrong direction"), i:"calendar"}
  ].filter(function(x){ return x.on; }).slice(0,3);
}

function earnedLine(){
  /* not "matches the ledger": several of these calls turn on the evidence on file rather
     than on arithmetic, so what a call agrees with is the answer key. The reason is counted
     beside it and never inside it. */
  return "Right call " + (S.caught + S.cleared) + " of " + LINES + ". Right reason " + reasonCount(1) + " of " + LINES + ".";
}


/* ---------- the two actions at the end ----------
   The run is finished either way. One button hands the player their own record, the other
   posts to the form, and neither is required to reach this screen. */
function actionsBlock(){
  return '<div class="actions">'+
    '<h3>Your record</h3>'+
    '<p>Everything this run collected, as a file you keep. It needs nobody\'s permission and it '+
      'does not send anything.</p>'+
    '<button class="btn secondary" id="saverec">Save my record</button>'+
    '<div id="recwrap" hidden><textarea class="recordbox" id="recbox" readonly spellcheck="false"></textarea>'+
      '<button class="btn-text" id="copyrec">Copy the record</button></div>'+
    '<h3 class="sendhead">Send your results</h3>'+
    '<p>Voluntary. It posts your calls to the Google Form responses sheet described in the '+
      'notice at the start.'+
      (receiptEndpoint() ? ' The same record goes to the receipts sheet, which answers with a '+
        'receipt you can keep.' : '')+'</p>'+
    '<button class="btn" id="sendres">Send my results</button>'+
    '<p class="sendstate" id="sendstate"></p>'+
  '</div>';
}
function wireActions(){
  var wrap = document.getElementById("recwrap"), box = document.getElementById("recbox");
  document.getElementById("saverec").addEventListener("click", function(){
    var text = recordText();
    box.value = text;
    wrap.hidden = false;
    var name = "second-pass-" + S.attemptId + ".json";
    var saved = false;
    try{
      var blob = new Blob([text], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      saved = true;
    }catch(e){ saved = false; }
    this.textContent = saved ? ("Saved as " + name) : "Your record is below, copy it";
  });
  document.getElementById("copyrec").addEventListener("click", function(){
    copyText(this, box.value, "Copied");
  });
  var state = document.getElementById("sendstate");
  var btn = document.getElementById("sendres");
  /* The time the endpoint says it wrote the row, in the player's own clock. If the string it
     sent back is not a time this browser can read, it is printed as it arrived. */
  function storedTime(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    try{ return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"}); }
    catch(e){ return d.toTimeString().slice(0,8); }
  }
  function paint(){
    var s = S.sendState;
    if(s === "sending"){ btn.disabled = true; btn.textContent = "Sending"; state.textContent = "Sending."; return; }
    btn.disabled = false;
    if(S.receipt && (s === "sent, not confirmed" || s === "send did not go through")){
      btn.textContent = "Send again";
      state.textContent = "Receipt " + S.receipt.slice(0,12) + ". Stored at " +
        storedTime(S.receiptAt) + ". " +
        "The receipt is in your record above, and a second send under attempt id " +
        S.attemptId + " returns this same receipt rather than a second row.";
    } else if(s === "sent, not confirmed"){
      btn.textContent = "Send again";
      state.textContent = "Sent. The receiver does not confirm receipt to this page. " +
        "A second send reuses attempt id " + S.attemptId + ", so a retry cannot double count." +
        (String(S.receiptState || "").indexOf("no receipt") === 0
          ? " The receipt endpoint did not confirm it, so this send stands unconfirmed." : "");
    } else if(s === "send did not go through"){
      btn.textContent = "Try sending again";
      state.textContent = "The send did not go through. Nothing is lost: save your record above " +
        "and send it to Khaled, or try again. A retry reuses attempt id " + S.attemptId + ".";
    } else if(s === "not sent, test mode"){
      btn.textContent = "Send my results";
      state.textContent = "Test mode is on, so nothing was sent. The payload the page would have " +
        "posted is in your record above under \"payload\".";
    } else {
      btn.textContent = "Send my results";
      state.textContent = S.testAttempt
        ? "Test mode is on. This button writes the would-be payload into your record and posts nothing."
        : "";
    }
  }
  btn.addEventListener("click", function(){ sendResults(paint); });
  paint();
}

function done(){
  if(!S.completedAt){ S.completedAt = Date.now(); saveRun(); }
  var miss = missedCards();
  var miss2 = missedCards2();
  var freshBlock = miss2.length
    ? '<div class="coach" style="margin-top:14px"><h3>On the memo you had not seen</h3>'+
      miss2.map(function(c){
        return '<div class="miss"><b>Fresh line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+'</div>'
    : '<div class="coach" style="margin-top:14px"><h3>On the memo you had not seen</h3>'+
      '<p class="tiny" style="margin:0">Every fresh call agrees with the answer key, on a company you had not seen, which is the read that matters.</p></div>';
  var badReason = rightCallWrongReason(1).map(function(c){ return {c:c, r:1}; })
        .concat(rightCallWrongReason(2).map(function(c){ return {c:c, r:2}; }));
  var reasonBlock = badReason.length
    ? '<div class="coach" style="margin-top:14px"><h3>Right call, wrong reason</h3>'+
      '<p class="tiny" style="margin:0 0 10px">The call agreed with the key on these lines and the basis you tapped did not. '+
      'The reason is counted separately and it does not move the rank.</p>'+
      badReason.map(function(x){
        return '<div class="miss"><b>'+(x.r===2?"Fresh line ":"Line ")+x.c.n+', '+esc(x.c.name)+', account '+x.c.acct+'</b>'+
               '<em>'+esc(x.c.type)+'</em>'+
               '<span>You tapped: '+esc(((x.r===2?S.r2basis:S.basis)[x.c.n-1]||[]).join("; ")||"nothing recorded")+
               '. The basis on this line is: '+esc(basisKeyText(x.c))+'.</span></div>';
      }).join("")+'</div>'
    : '<div class="coach" style="margin-top:14px"><h3>Right call, wrong reason</h3>'+
      '<p class="tiny" style="margin:0">There are none. Every call that agreed with the key carried a basis that agreed with it too.</p></div>';
  var coachInner;
  if(!miss.length){
    coachInner = '<div class="coach"><h3>Nothing to fix</h3><p class="tiny" style="margin:0">This read out lists the lines that got past you, and there are none.</p></div>'+freshBlock+reasonBlock;
  } else {
    coachInner = '<div class="coach"><h3>Where it got past you</h3>'+
      miss.map(function(c){
        return '<div class="miss"><b>Line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+
      (S.falseFlags > 0
        ? '<p class="tiny" style="margin:14px 0 0">'+(S.falseFlags===1?"One of those was a line":"Those were lines")+
          ' that owed nothing and read correctly, and flagging a line like that costs the controller time on work that was already right.</p>'
        : "")+
      '<p class="tiny" style="margin:14px 0 0">'+esc(patternLine().charAt(0).toUpperCase()+patternLine().slice(1))+'</p></div>'+freshBlock+reasonBlock;
  }
  var share = "Second Pass: Beat the Machine at Mason. Rank " + rank() + ", " +
    pointsText(S.points) + " points. Right call " + (S.caught+S.cleared) + " of " + LINES + " and right reason " +
    reasonCount(1) + " of " + LINES + (HAS_R2 ? ", with " + r2Right() + " of " + LINES2 + " on a company I had not seen" : "") + ". Best streak " +
    S.best + ".";
  var b = badges();
  var medals = b.length
    ? '<div class="badges">'+b.map(function(x,i){
        return '<span class="medal" style="animation-delay:'+(i*150)+'ms">'+
          '<span class="disc"><svg viewBox="0 0 24 24">'+I[x.i]+'</svg></span>'+
          '<em>'+x.t+'</em></span>';
      }).join("")+'</div>'
    : '<p class="nobadge">Next run, start with the arithmetic.</p>';
  var pr = rankProgress();
  screen.innerHTML =
    whyLine("Your run, scored two ways: the call you made on each line, and the basis you held it on.")+
    '<div class="final">'+
      '<div class="trophywrap">'+trophySvg(tier())+'</div>'+
      '<p class="tiny" style="margin:0 0 6px">'+esc(S.codename)+'</p>'+
      '<p class="earned">'+esc(earnedLine())+'</p>'+
      '<p class="pointsbig"><span class="headline">'+pointsText(S.points)+'</span><i>points</i></p>'+
      '<div class="rankbig">'+rank()+'</div>'+
      '<p class="ranknote">'+(pr.next
        ? esc(pointsText(pr.need)+" points short of "+pr.next+". ")
        : "Partner is the top rank. ")+
        'Trainee through Partner are ranks in this drill. They say nothing about professional seniority.</p>'+
      '<p class="lapwrap"><span>Best streak '+S.best+'</span>'+
        '<span>Lap time '+lapText()+'</span></p>'+
      '<p class="counts"><span><b>'+S.caught+'</b>caught</span>'+
        '<span><b>'+S.cleared+'</b>let stand correctly</span>'+
        '<span'+(S.falseFlags?' class="fail"':'')+'><b>'+S.falseFlags+'</b>false flags</span></p>'+
      (HAS_R2 ? '<p class="fresh">Fresh case: right call '+r2Right()+' of '+LINES2+'. Right reason '+reasonCount(2)+' of '+LINES2+'.</p>' : '')+
      (HAS_R2 ? '<p class="tiny" style="margin:4px 0 0">A second company, read once, scored on its own. '+
        'The points, the rank and the badges are read off the '+numWord(LINES)+' trained lines.</p>' : '')+
      medals+
      '<div class="sharecard"><span class="label">Your card</span>'+
        '<p>'+esc(share)+'</p><button class="btn-text" id="copyshare">Copy</button></div>'+
      '<button class="btn secondary" id="showmiss">'+((miss.length+miss2.length)
          ? "See the "+(miss.length+miss2.length)+" that got past you"
          : "See the full read out")+'</button>'+
      '<div id="missbox" hidden>'+coachInner+'</div>'+
      actionsBlock()+
      '<button class="btn secondary" id="playagain">Play again</button>'+
      '<button class="howlink" id="howlink">How this works in a real close</button>'+
    '</div>';
  wireActions();
  document.getElementById("howlink").addEventListener("click", openHow);
  document.getElementById("step").textContent = "Done";
  document.getElementById("score").classList.add("hidden");
  /* a second run keeps the codename and the chips and posts its own row to the form */
  document.getElementById("playagain").addEventListener("click", function(){
    freshRun();
    S.runIndex = (S.runIndex || 1) + 1;
    go(1);
  });
  var mb = document.getElementById("missbox"), sm = document.getElementById("showmiss");
  sm.addEventListener("click", function(){
    mb.hidden = !mb.hidden;
    sm.textContent = mb.hidden
      ? ((miss.length+miss2.length) ? "See the "+(miss.length+miss2.length)+" that got past you" : "See the full read out")
      : "Hide";
  });
  document.getElementById("copyshare").addEventListener("click", function(){
    var self = this;
    function done2(){ self.textContent = "Copied"; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(share).then(done2, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = share; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done2(); }catch(e){ self.textContent = "Select the line above"; }
      ta.remove();
    }
  });
}

/* three taps on the footer line turn test mode on and off, for a facilitator standing at the
   front of a room with no address bar to edit. It is a toggle, and the band says which way. */
function wireTestTap(){
  var foot = document.getElementById("masonfoot");
  if(!foot) return;
  var taps = 0, last = 0;
  foot.addEventListener("click", function(){
    var now = Date.now();
    taps = (now - last < 700) ? taps + 1 : 1;
    last = now;
    if(taps >= 3){
      taps = 0;
      TEST_MODE = !TEST_MODE;
      S.testAttempt = TEST_MODE;
      if(!TEST_MODE && S.sendState === "not sent, test mode") S.sendState = "not sent";
      saveRun();
      paintTestBand();
      render();
    }
  });
}

/* The address wins over the saved run, because ?case=own is how the author page's Preview
   button arrives and it has to land on the case the author just wrote. */
probeCases(function(){
  var want = pickFromQuery();
  if(!want || !CASE_AVAILABLE[want]){
    var saved = null;
    try{ saved = JSON.parse(window.sessionStorage.getItem(SKEY) || "null"); }catch(e){ saved = null; }
    want = (saved && saved.casePick && CASE_AVAILABLE[saved.casePick]) ? saved.casePick : "halyard";
  }
  loadCases(want, boot);
});
function boot(){
  if(!restoreRun()) freshRun();
  S.casePick = CASE_PICK;
  /* every counter is derived, so the run is scored from its calls before the first paint */
  rescore(); rescore2();
  paintTestBand();
  wireTestTap();
  buildTrack();
  render();
  /* the brand face lands after the first paint and the codename gets wider, so place it again */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!barQuiet()) paintTrack(); });
  window.addEventListener("resize", function(){ if(!barQuiet()) paintTrack(); });
  window.__BTM = S;
  window.__BTM_CARDS = CARDS;
  window.__BTM_CARDS2 = CARDS2;
  window.__BTM_RECORD = attemptRecord;
  window.__BTM_REASON = {one:reasonCount, right:reasonRightAt, key:basisKeyOf};
  /* the receipt path, readable from outside so a check can see which endpoint is in force
     and what the last send came back with */
  window.__BTM_RECEIPT = function(){
    return {endpoint:receiptEndpoint(), form:formEndpoint(), harness:onHarness(),
            receipt:S.receipt, storedAt:S.receiptAt, state:S.receiptState,
            sendState:S.sendState, attempt:S.attemptId};
  };
  /* the verification hooks: the step jump and the points engine, so a run can be walked and
     a layout checked at every screen without clicking through it by hand */
  window.__BTM_GO = go;
  window.__BTM_STEPS = function(){ return {lines:LINES, lines2:LINES2, l1last:STEP_L1_LAST,
    bridge:STEP_BRIDGE, l2:STEP_L2, l2last:STEP_L2_LAST, done:STEP_DONE, hasR2:HAS_R2}; };
  window.__BTM_POINTS = {line:linePoints, rescore:rescore, ranks:RANKS, progress:rankProgress,
                         max:RANK_MAX, blanket:RANK_BLANKET, maxAttainable:maxAttainable,
                         blanketCeiling:blanketCeiling, build:buildRanks};
  publishCases();
}
/* the verification hook, rebuilt whenever the case changes so it never reports the case
   before last */
function publishCases(){
  window.__BTM_CASES = {source:CASE_SOURCE, id:CASE_RUN_ID, pick:CASE_PICK,
                        lines:LINES, lines2:LINES2, available:CASE_AVAILABLE,
                        one:CASE1.version, two:HAS_R2 ? CASE2.version : null,
                        date:CASE1.date, assessment:ASSESS, product:PRODUCT_STAMP,
                        test:TEST_MODE, attempt:S.attemptId};
  window.__BTM_CARDS = CARDS;
  window.__BTM_CARDS2 = CARDS2;
}
})();
</script>
