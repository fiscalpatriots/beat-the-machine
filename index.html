<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005239">
<title>Second Pass: Beat the Machine at Mason</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* George Mason Green, George Mason Gold, Logo Black and the accent palette,
     from brand.gmu.edu/brand-guide/brand-colors */
  --mason:#005239;
  --mason-deep:#003527;
  --mason-gold:#ffc733;
  --gold-line:#e0ac00;
  --ink:#333333;
  --ink-soft:#5a5d61;
  --paper:#f6f3ec;
  --card:#ffffff;
  --line:#dfd8c9;
  --accept:#005239;
  --accept-bg:#e3f2e8;
  --reject:#cc4824;
  --reject-bg:#fbe9e4;
  --machine:#004f71;
  --machine-bg:#e3eef4;
  --bar-old:#cfc6b2;
  --neg:#a83a1c;
  --gut:18px;
  --shadow:0 2px 0 rgba(0,82,57,.09), 0 8px 24px rgba(0,82,57,.09);
}
@media (max-width:399px){:root{--gut:12px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:17px/1.45 Figtree,"Open Sans","Franklin Gothic Book","Franklin Gothic",
       -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:0 var(--gut) 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:30px;line-height:1.12;margin:0 0 10px;letter-spacing:-.5px;color:var(--mason)}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;letter-spacing:-.3px;color:var(--mason)}
h3{font-size:19px;line-height:1.22;margin:0 0 6px;letter-spacing:-.2px;color:var(--mason)}

/* The university and college names set in type. No logo file and no Patriot mark. */
#mason{position:relative;background:var(--mason);color:#fff;margin:0 calc(var(--gut) * -1);
  padding:12px var(--gut) 22px;border-bottom:3px solid var(--mason-gold)}
/* the codename rides the band, right above the player's car */
#codetag{position:absolute;bottom:4px;left:0;transform:translateX(-50%);white-space:nowrap;
  font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--mason-gold);
  transition:left .32s cubic-bezier(.3,.8,.35,1)}
@media (prefers-reduced-motion:reduce){#codetag{transition:none}}
#mason b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;line-height:1.2}
#mason span{display:block;font-size:12.5px;letter-spacing:.3px;color:#dff0e4;margin-top:2px}
#masonfoot{margin:20px calc(var(--gut) * -1) 0;padding:14px var(--gut) 4px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.4;color:var(--ink-soft);text-align:center}
p{margin:0 0 14px}
.sub{color:var(--ink-soft);font-size:16px}
.tiny{font-size:13px;color:var(--ink-soft)}

#bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 8px}
#track{line-height:0}
#trk{display:block;width:100%;height:auto;overflow:visible}
#fill{transition:width .32s cubic-bezier(.3,.8,.35,1),fill .24s ease,fill-opacity .24s ease}
#carpos{transition:transform .32s cubic-bezier(.3,.8,.35,1)}
#carfx.burst{animation:burst .2s ease-out}
#carfx.pit{animation:pit .2s ease-in-out}
@keyframes burst{0%{transform:translateX(0)}45%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes pit{0%{transform:translateY(0)}50%{transform:translateY(6.5px)}100%{transform:translateY(0)}}
#burst{opacity:0}
#burst.on{animation:speedlines .2s ease-out}
@keyframes speedlines{0%{opacity:0;transform:translateX(3px)}35%{opacity:.85}100%{opacity:0;transform:translateX(-7px)}}
#trail,#flame{transform-box:fill-box;transform-origin:100% 50%;opacity:0;
  transition:opacity .24s ease,transform .24s ease}
#trail.on,#flame.on{opacity:1}
#trail.big{transform:scaleX(1.7)}
#flame.big{transform:scale(1.4,1.15)}
#chq{opacity:.5;transition:opacity .2s ease}
#chq.lit{opacity:1}
@media (prefers-reduced-motion:reduce){
  #fill,#carpos,#flame,#trail,#chq{transition:none}
  #carfx.burst,#carfx.pit,#burst.on{animation:none}
  #trail.big,#flame.big{transform:none}
  .toast{animation:none}
}
#label{display:flex;justify-content:space-between;align-items:center;min-height:25px;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.scorepill{font-weight:700;color:var(--ink);background:#ece6d8;border-radius:99px;padding:3px 10px}

#screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
.icon{width:68px;height:68px;display:block;margin:0 0 14px}
.icon svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.big{width:96px;height:96px}

button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:14px;padding:16px;font-size:18px;font-weight:700;margin-top:12px;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:15px 16px;font-size:17px;margin-top:10px;box-shadow:var(--shadow);
}
.choice:active{transform:translateY(1px)}
.choice.on{border-color:var(--ink);background:#fff}
.choice .tick{width:22px;height:22px;border-radius:99px;border:2px solid var(--line);flex:0 0 auto}
.choice.on .tick{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{
  border:2px solid var(--line);background:var(--card);border-radius:99px;
  padding:10px 14px;font-size:15px;font-weight:600;
}
.chip.on{border-color:var(--mason);background:var(--mason);color:#fff}
.chip.sm{padding:8px 12px;font-size:14px}

input[type=text],textarea{
  width:100%;font:inherit;padding:15px;border:2px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);
}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.acct{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.3px;background:var(--machine-bg);color:var(--machine);border-radius:99px;padding:5px 12px;margin-bottom:10px}
.move{font-size:16px;line-height:1.35;margin:0 0 12px}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.says{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--machine);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.says svg{width:20px;height:20px;fill:none;stroke:var(--machine);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.quote{font-size:17px;line-height:1.4;margin:0}

.file{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 0}
.file h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
.file ul{margin:0;padding:0 0 0 16px}
.file li{font-size:14px;line-height:1.4;margin:0 0 5px}
.file li:last-child{margin-bottom:0}

.ask{font-weight:700;font-size:15px;margin:16px 0 0;color:var(--ink-soft)}
.two{display:flex;gap:10px;margin-top:10px}
.two .btn{margin-top:0;flex:1;padding:17px 6px;font-size:17px}
.btn.call{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.call:active{background:var(--paper)}

.verdict{border-radius:18px;padding:16px 18px;margin-bottom:12px;border:2px solid}
.verdict.good{background:var(--accept-bg);border-color:var(--accept)}
.verdict.bad{background:var(--reject-bg);border-color:var(--reject)}
.verdict h2{margin:0 0 4px;font-size:20px;color:var(--ink)}
.type{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.bonus{display:inline-block;background:var(--mason-gold);color:#333333;border:2px solid var(--gold-line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;margin-top:10px}
.why{margin:0 0 4px}
.toast{display:inline-block;background:var(--mason-gold);color:#333333;border:2px solid var(--gold-line);
  border-radius:99px;padding:5px 14px;font-weight:800;font-size:14px;margin:10px 0 0;
  animation:pop .22s ease-out both}
@keyframes pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}

.split{margin:16px 0 0}
.splitbar{height:12px;border-radius:99px;background:#e6e0d2;overflow:hidden;display:flex}
.splitbar i{display:block;height:100%}
.splitbar i.c{background:var(--ink)}
.splitbar i.k{background:var(--accept)}
.splitlab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:6px}
.key{display:inline-block;width:9px;height:9px;border-radius:99px;vertical-align:middle;margin-right:5px}
.key.c{background:var(--ink)}
.key.k{background:var(--accept)}

.link{background:none;border:none;padding:8px 0;text-decoration:underline;font-size:15px;color:var(--ink-soft)}
.hidden{display:none!important}

#sheet{position:fixed;inset:0;background:rgba(0,53,39,.58);z-index:20;display:flex;align-items:flex-end}
#sheetbody{background:var(--paper);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px 24px;max-width:520px;margin:0 auto}
/* the statement: round one reads it, and the Ledger button reopens it during play */
/* ---------- the statement. One grid, stacked on a phone, one line per row on a desk ---------- */
.stmtwrap{--pad:16px}
.stmt{--pad:16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0;
  padding:var(--pad);box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
.stmthead{background:var(--mason);margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;
  padding:16px var(--pad) 14px;border-bottom:2px solid var(--mason-gold)}
.stmthead b{display:block;font-size:20px;line-height:1.25;color:#fff;letter-spacing:-.2px}
.stmthead span{display:block;font-size:13px;line-height:1.45;color:var(--mason-gold);margin-top:3px}
.scols,.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:20px;row-gap:6px}
/* four numbers only sit on one line once there is room for them; below that May and June
   take the first line and Change and Percent the second, on the same gutters */
@media (min-width:480px){.scols,.srow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scols{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
  padding:12px 0 8px;border-bottom:1px solid var(--line)}
.scols span{text-align:right;padding:0;font-variant-numeric:tabular-nums}
.scols .sp{display:none}
.srow{position:relative;padding:12px 10px;margin:0 -10px;align-items:baseline;
  border-top:1px solid rgba(0,82,57,.10)}
.srow.z{background:rgba(0,82,57,.03)}
.srow .acctline{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.srow .no{flex:0 0 46px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.45;color:var(--ink-soft)}
.srow .nm{font-size:15px;line-height:1.45;color:var(--ink)}
.srow .fg{text-align:right;font-size:15px;line-height:1.45;padding:0;color:var(--ink);
  font-variant-numeric:tabular-nums}
.srow .fg.ch{font-weight:600}
.srow .fg.neg{color:var(--neg)}
.srow .pc{color:var(--ink-soft)}
.srow .pc b{font-weight:400}
/* the movement bar gets its own column on a desk, so it never sits behind a figure */
.wbar{display:none;align-self:center;height:6px;border-radius:99px;background:rgba(0,82,57,.08)}
.wbar i{display:block;height:100%;border-radius:99px;background:rgba(0,82,57,.55)}
.wbar i.neg{background:rgba(168,58,28,.50)}
.srow .mbar{grid-column:1/-1;height:4px;border-radius:99px;background:rgba(0,82,57,.07);
  margin-top:8px;overflow:hidden}
.srow .mbar i{display:block;height:100%;border-radius:99px;background:rgba(0,82,57,.45)}
.srow .mbar i.neg{background:rgba(168,58,28,.45)}
.sgrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mason);
  padding:16px 0 2px;margin-top:6px;border-top:1px solid rgba(0,82,57,.22)}
.srow.sub,.srow.net{padding-top:14px;padding-bottom:14px}
.srow.sub{border-top:1px solid var(--ink)}
.srow.sub .nm,.srow.sub .fg{font-weight:700}
.srow.net{border-top:2px solid var(--ink)}
.srow.net .nm,.srow.net .fg{font-weight:800}
.srow.sub,.srow.net{background:#fff}
.srow.here{background:rgba(255,199,51,.06);box-shadow:inset 4px 0 0 var(--mason-gold)}
.srow.here .nm{font-weight:700}
.cap{margin:14px 0 0;padding:12px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft);
  border-top:1px solid var(--line)}

/* the legend, and the orientation page it sits on */
.flagcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--mason);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:16px;margin:0 0 14px}
.flaghead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:none;padding:0;text-align:left;min-height:32px}
.flaghead h3{margin:0;font-size:17px}
.flaghead .chev{font-size:13px;color:var(--ink-soft);transition:transform .2s ease}
.flaghead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,82,57,.06);
  border:1px solid rgba(0,82,57,.20);border-radius:99px;padding:6px 11px;
  font-size:13px;line-height:1.45;font-weight:600;color:var(--ink)}
.fchip svg{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--mason);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.flagmore{margin-top:12px}
.flagmore p{margin:0;font-size:15px;line-height:1.45}
.flagmore p+p{margin-top:8px}
.hero{margin:0 0 14px}
.hero h2{margin:0 0 6px}
.hero p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.orient{display:block}
.orientside{display:none}
.stickygo{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px var(--gut);
  background:linear-gradient(to top,var(--paper) 74%,rgba(246,243,236,0))}
.stickygo .btn{margin:0 auto;max-width:484px}
@media (max-width:899px){#app.hasbar{padding-bottom:98px}}
@media (min-width:900px){
  #app.wide{max-width:1076px}
  .hero h2{font-size:28px}
  .orient{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;
    max-width:1040px;margin:0 auto}
  .orientside{display:block;position:sticky;top:96px}
  .orientmain .flagcard{display:none}
  .stickygo{display:none}
  .flaghead{pointer-events:none}
  .flaghead .chev{display:none}
  .stmt-wide{--pad:24px}
}
/* one line per account, with room for every figure and a column of its own for the bar */
@media (min-width:1200px){
  #app.wide{max-width:1320px}
  .orient{max-width:1280px}
  .stmt-wide .scols,.stmt-wide .srow{
    grid-template-columns:30px minmax(0,1fr) 116px 116px 112px 72px 72px;
    column-gap:20px;row-gap:0}
  .stmt-wide .srow.sub .fg,.stmt-wide .srow.net .fg{font-weight:600}
  .stmt-wide .scols .sp{display:block}
  .stmt-wide .srow{align-items:center;padding:10px;min-height:28px}
  .stmt-wide .srow.sub,.stmt-wide .srow.net{padding-top:14px;padding-bottom:14px}
  .stmt-wide .srow .acctline{display:contents}
  .stmt-wide .srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
  .stmt-wide .srow .fg{font-size:16px;padding:0}
  .stmt-wide .srow .mbar{display:none}
  .stmt-wide .wbar{display:block}
}

.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cardhead.plain{margin-bottom:10px;align-items:center}
.revlabel{font-size:13px;font-weight:700;color:var(--ink-soft)}
.ledgerbig{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;
  border:2px solid var(--ink-soft);background:var(--card);color:var(--ink);border-radius:99px;
  padding:13px 16px;font-size:16px;font-weight:700;margin:0 0 12px}
.ledgerbig svg{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ledgerbig:active{background:var(--paper);transform:translateY(1px)}
.ledgerhint{margin:0 0 14px;font-size:13px;line-height:1.4;color:var(--ink-soft);text-align:center}
.strip{background:var(--machine-bg);border-left:3px solid var(--machine);border-radius:0 10px 10px 0;
  padding:10px 12px;margin:0 0 14px;font-variant-numeric:tabular-nums}
.striptop{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.striptop b{color:var(--machine);font-size:13px}
.striptop span{font-size:14px;font-weight:600}
.stripnums{display:flex;gap:10px;align-items:flex-start}
.stripnums>span{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.stripnums>span>i{display:block;font-style:normal;font-size:15px;font-weight:700;color:var(--ink);
  text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch{display:block;font-size:15px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch.neg{color:var(--neg)}
.stripnums .ch i{display:block;font-style:normal;font-size:13px;font-weight:400;color:var(--ink-soft);margin:0}

.final{text-align:center}
.trophywrap{display:flex;justify-content:center;margin:4px 0 6px}
.trophy{width:132px;height:auto;animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
.trophy .glint{animation:sweep 1.1s ease-out .5s both}
@keyframes rise{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(130px)}}
@media (prefers-reduced-motion:reduce){.trophy,.trophy .glint{animation:none}.trophy .glint{opacity:0}}
.rankbig{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.05;color:var(--mason)}
.stats{display:flex;gap:8px;margin:0 0 10px}
.lapwrap{margin:0 0 18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lap{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:6px 14px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats div{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px}
.stats b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px;line-height:1.2}
.earned{margin:12px 0 16px;font-size:16px;color:var(--ink-soft)}
.badges{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:0 0 18px}
.medal{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;
  opacity:0;transform:translateY(6px);animation:medalin .4s ease forwards}
.medal .disc{display:flex;align-items:center;justify-content:center;width:62px;height:62px;
  border-radius:50%;background:var(--paper);border:2px solid var(--mason-gold);
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.medal .disc svg{width:26px;height:26px;fill:none;stroke:var(--mason);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.medal em{font-style:normal;font-size:14px;line-height:1.3;text-align:center;color:var(--ink)}
@keyframes medalin{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.medal{animation:none;opacity:1;transform:none}}
.nobadge{margin:0 0 18px;font-size:14px;line-height:1.45;color:var(--ink-soft);text-align:center}
.sharecard{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:left}
.sharecard p{margin:0 0 10px;font-size:16px;font-weight:600}
.sharecard .btn{margin-top:0;padding:11px;font-size:16px}
.coach{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:18px 0 0;text-align:left;box-shadow:var(--shadow)}
.coach h3{margin:0 0 10px}
.miss{border-top:1px solid var(--line);padding:10px 0 0;margin:10px 0 0}
.miss:first-of-type{border-top:none;padding-top:0;margin-top:0}
.miss b{display:block;font-size:15px}
.miss em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--machine);margin:2px 0 4px}
.miss span{display:block;font-size:14px;color:var(--ink-soft);line-height:1.4}

/* the practitioner note, reachable from the intro and from the end screen */
.howlink{display:block;width:100%;background:none;border:none;padding:12px 0 0;
  text-decoration:underline;font-size:15px;line-height:1.4;color:var(--ink-soft);text-align:center}
.linkrow{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 0 0}
.linkrow .howlink{width:auto;display:inline-block;padding:0}
.howwrap{text-align:left}
.howwrap h2{margin:0 0 14px}
.howwrap p{font-size:16px;line-height:1.45}
.howdiag{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 18px}
.howlead{font-weight:700;color:var(--ink);margin:18px 0 10px}
.howgrp{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--mason);
  border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.howgrp.judge{border-left-color:var(--gold-line)}
.howgrp h3{margin:0 0 6px;font-size:17px}
.howgrp p{margin:0;font-size:15px;line-height:1.45}
.howscope{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:16px 0 0}
.howscope h3{margin:0 0 6px;font-size:17px}
.howscope p{margin:0;font-size:15px;line-height:1.45}
.howuse{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--mason-gold);
  border-radius:14px;padding:14px 16px;margin:16px 0 0;box-shadow:var(--shadow)}
.howuse h3{margin:0 0 6px;font-size:17px}
.howuse p{margin:0 0 10px;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.howuse textarea{min-height:210px;font-size:14px;line-height:1.5;background:var(--paper)}
.howuse .btn{margin-top:10px;padding:12px;font-size:16px}
a.btn{text-decoration:none;text-align:center}
</style>

function lapsDone(){ return S.calls.filter(function(v){ return v!==null; }).length; }
function paintTrack(){
  var done = lapsDone();
  var x = CAR_X0 + (done/14)*(CAR_X1-CAR_X0);
  var pos = document.getElementById("carpos"), f = document.getElementById("fill"),
      fl = document.getElementById("flame"), tr = document.getElementById("trail"),
      cq = document.getElementById("chq");
  var hot = S.streak>=5;
  if(pos) pos.style.transform = "translate("+x.toFixed(1)+"px,0px)";
  if(f){
    f.setAttribute("width", Math.max(0.1, x-4).toFixed(1));
    /* at five in a row the ground the car has covered lights gold */
    f.style.fill = hot ? "var(--mason-gold)" : "var(--mason)";
    f.style.fillOpacity = hot ? ".9" : ".32";
  }
  if(tr){ tr.classList.toggle("on", S.streak>=2); tr.classList.toggle("big", hot); }
  if(fl){ fl.classList.toggle("on", S.streak>=3); fl.classList.toggle("big", hot); }
  if(cq) cq.classList.toggle("lit", done>=14);
  placeCodename(x);
}

  if(!tag || !trk || !band) return;
  if(!S.codename){ tag.hidden = true; return; }
  tag.hidden = false;
  if(tag.textContent !== S.codename) tag.textContent = S.codename;
  var tr = trk.getBoundingClientRect(), br = band.getBoundingClientRect();
  if(!tr.width) return;
  var px = (tr.left - br.left) + (x/300)*tr.width;
  var half = tag.getBoundingClientRect().width/2;
  px = Math.max(half+6, Math.min(br.width-half-6, px));
  tag.style.left = px.toFixed(1)+"px";
}

/* a right call is a short burst, a wrong one drops into the pit and rejoins */
function carFx(right){
  var fx = document.getElementById("carfx"), bu = document.getElementById("burst");
  if(!fx) return;
  fx.classList.remove("burst","pit");
  if(bu) bu.classList.remove("on");
  fx.getBoundingClientRect();
  fx.classList.add(right ? "burst" : "pit");
  if(right && bu) bu.classList.add("on");
  setTimeout(function(){
    fx.classList.remove("burst","pit");
    if(bu) bu.classList.remove("on");
  }, 240);
}
function lapMs(){
  if(!S.lapStart) return 0;
  return (S.lapEnd || Date.now()) - S.lapStart;
}
function lapText(){
  var t = Math.round(lapMs()/1000), m = Math.floor(t/60), sec = t%60;
  return m + ":" + (sec<10 ? "0" : "") + sec;
}
function lapMinutes(){ return String(Math.max(1, Math.round(lapMs()/60000))); }

function progress(){
  paintTrack();
  var lab = document.getElementById("step");
  var sc = document.getElementById("score");
  if(S.step>=3 && S.step<=16){
    var seen = S.calls.filter(function(v){ return v!==null; }).length;
    lab.textContent = "Line "+(S.step-2)+" of 14";
    if(seen){ sc.classList.remove("hidden"); sc.textContent = "Right "+(S.caught+S.cleared)+" of "+seen; }
    else sc.classList.add("hidden");
  } else if(S.step===0){ lab.textContent=""; sc.classList.add("hidden"); }
  else { lab.textContent = "Second Pass"; sc.classList.add("hidden"); }
}

/* ---------- the ledger, on call from every card ---------- */
function rowFor(acct){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===acct) return ROWS[i]; }
  return null;
}
function moveCell(d){ return d<0 ? "("+money(d)+")" : (d>0 ? "+"+money(d) : "$0"); }

/* the account under review, printed on the card as its statement line */
function strip(acct){
  var r = rowFor(acct); if(!r) return "";
  return '<div class="strip"><div class="striptop"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>'+
    '<div class="stripnums"><span>May<i>'+money(r[2])+'</i></span>'+
    '<span>June<i>'+money(r[3])+'</i></span>'+
    '<span>Change'+changeCell(r[2], r[3])+'</span></div></div>';
}

/* ---------- the statement, one component for the orientation screen and the sheet ---------- */
var GROUPS = [
  {title:"Revenue", accts:["4000","4100","4200"], total:"Total revenue"},
  {title:"Cost of sales", accts:["5000","5100"], total:"Total cost of sales"},
  {title:"Operating expenses", accts:["6000","6100","6200","6300","6400","6500","7000","7400"], total:"Total operating expenses"},
  {title:"Financing", accts:["7100"], total:"Total financing"}
];
function sumOf(accts, col){
  var t = 0;
  accts.forEach(function(a){ var r = rowFor(a); if(r) t += r[col]; });
  return t;
}
function changeCell(prior, current){
  var d = current - prior;
  var pc = prior ? (d/prior*100).toFixed(1)+"%" : "0.0%";
  return '<span class="ch '+(d<0?"neg":"pos")+'">'+moveCell(d)+'<i>'+pc+'</i></span>';
}
/* One row per account. On a phone it stacks, on a desk it reads as one line, and the
   movement bar takes a column of its own there and a line under the figures here. */
function figCells(prior, current, barPct){
  var d = current - prior;
  var pc = (prior ? (d/prior*100) : 0);
  var neg = d<0 ? " neg" : "";
  var bar = (barPct===null) ? "" :
    '<span class="wbar"><i class="'+(neg?"neg":"")+'" style="width:'+barPct+'%"></i></span>';
  return '<span class="fg">'+money(prior)+'</span>'+
         '<span class="fg">'+money(current)+'</span>'+
         '<span class="fg ch'+neg+'">'+moveCell(d)+'</span>'+
         '<span class="fg pc'+neg+'"><b>'+pc.toFixed(1)+'%</b></span>'+bar;
}
function movementBar(prior, current, barPct){
  var neg = current<prior ? " neg" : "";
  return '<span class="mbar"><i class="'+neg.trim()+'" style="width:'+barPct+'%"></i></span>';
}
function acctRow(r, acct, maxPct, z){
  var pct = r[2] ? Math.abs((r[3]-r[2])/r[2]*100) : 0;
  var w = Math.max(10, Math.round(pct/maxPct*100));
  var here = (r[0]===acct);
  return '<div class="srow'+(z%2?" z":"")+(here?" here":"")+'"'+(here?' id="hererow"':'')+'>'+
      '<span class="acctline"><span class="no">'+r[0]+'</span>'+
        '<span class="nm">'+esc(r[1])+'</span></span>'+
      figCells(r[2], r[3], w)+
      movementBar(r[2], r[3], w)+
    '</div>';
}
function totalRow(label, pr, cu, cls){
  return '<div class="srow '+cls+'">'+
      '<span class="acctline"><span class="no"></span><span class="nm">'+label+'</span></span>'+
      figCells(pr, cu, null)+
    '</div>';
}
function statement(acct, wide){
  var maxPct = 0;
  ROWS.forEach(function(r){ if(r[2]) maxPct = Math.max(maxPct, Math.abs((r[3]-r[2])/r[2]*100)); });
  var body = "", z = 0;
  GROUPS.forEach(function(g){
    body += '<div class="sgrp">'+g.title+'</div>';
    g.accts.forEach(function(a){
      var r = rowFor(a); if(!r) return;
      z++;
      body += acctRow(r, acct, maxPct, z);
    });
    body += totalRow(g.total, sumOf(g.accts,2), sumOf(g.accts,3), "sub");
  });
  var netP = sumOf(GROUPS[0].accts,2), netC = sumOf(GROUPS[0].accts,3);
  GROUPS.slice(1).forEach(function(g){ netP -= sumOf(g.accts,2); netC -= sumOf(g.accts,3); });
  body += totalRow("Net of the accounts shown", netP, netC, "net");
  return '<div class="stmt'+(wide?" stmt-wide":"")+'">'+
    '<div class="stmthead"><b>Halyard Provisioning Group, Inc.</b>'+
      '<span>June close, prepared from the general ledger</span></div>'+
    '<div class="scols"><span class="sp"></span><span class="sp"></span>'+
      '<span>May</span><span>June</span><span>Change</span><span>Percent</span>'+
      '<span class="sp"></span></div>'+
    body+
    '<p class="cap">The fourteen accounts the memo was written against.</p></div>';
}

function openSheet(acct){

    var d = document.createElement("div");
  d.id="sheet";
  d.innerHTML = '<div id="sheetbody">'+statement(acct, false)+'<button class="btn" id="closesheet">Close</button></div>';
  document.body.appendChild(d);

  /* a tap that opens the sheet also sends a click a moment later, and that one would land
     on the backdrop and shut it again, so the first 400ms are ignored */
  var opened = Date.now();
  d.addEventListener("click", function(ev){

/* ---------- the picture of the movement. Every figure lives in the strip above it. ---------- */
function chart(c){
  var max = Math.max(c.prior, c.current);
  var wa = Math.round(250 * c.prior / max);
  var wb = Math.round(250 * c.current / max);
  var d = c.current - c.prior;
  return '<svg class="chart" viewBox="0 0 300 74" role="img" aria-label="'+esc(c.name+', May '+money(c.prior)+', June '+money(c.current))+'">'+
    '<text x="0" y="21" font-size="13" fill="var(--ink-soft)">May</text>'+
    '<rect x="44" y="7" width="'+wa+'" height="18" rx="3" fill="var(--bar-old)"/>'+
    '<text x="0" y="55" font-size="13" fill="var(--ink)">June</text>'+
    '<rect x="44" y="41" width="'+wb+'" height="18" rx="3" fill="'+(d<0?"var(--neg)":"var(--ink)")+'"/>'+
  '</svg>';
}

/* ---------- screens ---------- */
function render(){
  var app = document.getElementById("app");
  app.classList.toggle("wide", S.step===2);
  app.classList.toggle("hasbar", S.step===2);
  progress();
  var s = S.step;
  if(s===0) return intro();
  if(s===1) return identity();
  if(s===2) return roundOne();
  if(s>=3 && s<=16) return card(s-3);
  if(s===90) return howScreen();
  if(s===17) return submitScreen();
  if(s>=18) return done();
}

var HOWPROMPT = [

/* one copy handler, used by the prompt box */
function copyText(btn, text, okLabel){
  function ok(){ btn.textContent = okLabel; }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent = "Select the text above"; }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else { fallback(); }
}

function card(i){
  var c = CARDS[i];
  if(!S.lapStart) S.lapStart = Date.now();
  var memoBlock = c.memo
    ? '<div class="says"><svg viewBox="0 0 24 24">'+I.robot+'</svg> What the memo says</div><p class="quote">'+esc(c.memo)+'</p>'
    : '<div class="says"><svg viewBox="0 0 24 24">'+I.robot+'</svg> What the memo says</div><p class="quote">Nothing. This account is not mentioned anywhere in the commentary.</p>';
  var fileBlock = c.file.length
    ? '<div class="file"><h4>On file</h4><ul>'+c.file.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join("")+'</ul></div>'
    : "";
  screen.innerHTML =
    '<div class="card">'+
      '<div class="cardhead">'+icon(c.icon)+'</div>'+
      strip(c.acct)+
      ledgerBig(c.acct)+
      (i===0 ? '<p class="ledgerhint">Tap any time to open the full ledger.</p>' : "")+
      chart(c)+
      memoBlock+
      fileBlock+
      '<p class="ask">Does the memo\'s explanation hold?</p>'+
      '<div class="two">'+
        '<button class="btn call" id="stand">Let it stand</button>'+
        '<button class="btn call" id="flag">Flag it</button>'+
      '</div>'+
    '</div>';
  wireLedger();
  document.getElementById("flag").addEventListener("click", function(){ answer(i,"flag"); });
  document.getElementById("stand").addEventListener("click", function(){ answer(i,"stand"); });
}


function answer(i, val){
  var c = CARDS[i];
  S.calls[i] = val;
  if(i === 13) S.lapEnd = Date.now();
  var right = (val === c.key);
  if(right){
    if(c.key==="flag") S.caught++; else S.cleared++;
    S.streak++;
    if(S.streak > S.best) S.best = S.streak;
  } else {
    if(val === "flag") S.falseFlags++;
    S.streak = 0;
  }
  carFx(right);
  reveal(i, right);
}

function splitBar(){
  var seen = S.calls.filter(function(v){ return v!==null; }).length;
  var right = S.caught + S.cleared;
  var cw = seen ? Math.round(right/seen*100) : 0;
  return '<div class="split"><div class="splitbar"><i class="c" style="width:'+cw+'%"></i></div>'+
    '<div class="splitlab"><span>'+right+' of '+seen+' right so far</span></div></div>';
}


function reveal(i, right){
  var c = CARDS[i];
  var head = right ? (c.key==="flag" ? "Caught it" : "Cleared it")
                   : (c.key==="flag" ? "That one got past you" : "You flagged a clean line");
  progress();
  var celebration = "";
  if(right && c.key==="flag" && c.type==="invented driver") celebration = '<span class="bonus">Invented driver caught</span>';
  var streakLine = "";
  if(right && S.streak>=5) streakLine = '<p><span class="toast">On fire</span></p>';
  else if(right && S.streak>=3) streakLine = '<p><span class="toast">Streak '+S.streak+'</span></p>';
  var costLine = (!right && c.key==="stand")
    ? '<p class="tiny" style="margin:8px 0 0">A false flag scores the same as a line that gets past you.</p>'
    : "";
  screen.innerHTML =
    '<div class="cardhead plain"><span class="revlabel">Line '+c.n+' of 14</span></div>'+
    strip(c.acct)+
    ledgerBig(c.acct)+
    '<div class="verdict '+(right?"good":"bad")+'" style="margin-top:12px">'+
      '<h2>'+head+'</h2>'+
      '<span class="type">'+esc(c.type)+'</span>'+
      celebration+
    '</div>'+
    '<p class="why">'+esc((!right && c.key==="stand" && c.over) ? c.over : c.why)+'</p>'+
    costLine+
    streakLine+
    splitBar()+
    '<button class="btn" id="next">'+(i===13?"See how you did":"Next line")+'</button>';
  wireLedger();
  document.getElementById("next").addEventListener("click", function(){ go(S.step+1); });
  window.scrollTo(0,0);
}





/* ---------- generated summaries. Nothing here is typed by the player. ---------- */
var ROUND1_NOTE = "Not collected. The ledger screen is orientation only in this version.";

function flaggedAccounts(){
  var out = [];
  CARDS.forEach(function(c){ if(c.key==="flag" && out.indexOf(c.acct)===-1) out.push(c.acct); });
  return out;
}
function acctName(code){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===code) return code+" "+ROWS[i][1]; }
  return code;
}
function missedCards(){
  var out = [];
  CARDS.forEach(function(c,idx){ if(S.calls[idx] !== c.key) out.push(c); });
  return out;
}
/* The organization taps ride at the front of question A, behind a fixed prefix, so the
   responses sheet can be counted by chapter without a new form question. */
function orgLine(){ return "Organizations: " + S.orgs.join("; ") + "."; }
function summaryA(){
  return orgLine() + " " + ROUND1_NOTE;
}

function summaryB(){
  var miss = missedCards();
  var parts = [];
  parts.push(miss.length
    ? "Lines missed: " + miss.map(function(c){ return c.n+" "+c.acct+" ("+c.type+")"; }).join("; ") + "."
    : "No lines missed.");
  parts.push("Pattern: " + patternLine());
  parts.push("Result: " + (S.caught+S.cleared) + " of 14 calls correct, " + S.caught + " caught, " +
             S.cleared + " let stand correctly, " + S.falseFlags + " false flag" + (S.falseFlags===1?"":"s") +
             ", rank " + rank() + ".");
  parts.push("The four scale questions (expected quality, confidence before, confidence after, close experience) were not asked in this version and carry placeholder values.");
  parts.push("Longest run of correct calls: " + S.best + ".");
  return parts.join(" ");
}

function typeNoun(type, n){
  if(type==="clean line") return n===1 ? "clean line" : "clean lines";
  return type + (n===1 ? " problem" : " problems");
}
function patternLine(){
  var tally = {};
  CARDS.forEach(function(c,idx){
    if(!tally[c.type]) tally[c.type] = {tot:0, miss:0};
    tally[c.type].tot++;
    if(S.calls[idx] !== c.key) tally[c.type].miss++;
  });
  var clean = [], bad = [];
  Object.keys(tally).forEach(function(t){
    var v = tally[t];
    if(v.miss===0 && v.tot>=2) clean.push({t:t, tot:v.tot});
    if(v.miss>0) bad.push({t:t, tot:v.tot, miss:v.miss});
  });
  if(!bad.length) return "you called all fourteen lines the way the ledger has them.";
  bad.sort(function(a,b){ return b.miss - a.miss; });
  var worst = bad[0];
  var badBit;
  if(worst.miss === worst.tot && worst.tot > 1) badBit = (worst.tot===2 ? "both " : "all "+worst.tot+" ") + typeNoun(worst.t, worst.tot) + " got past you";
  else if(worst.miss === worst.tot) badBit = "the " + typeNoun(worst.t,1) + " got past you";
  else badBit = "you missed " + worst.miss + " of the " + worst.tot + " " + typeNoun(worst.t, worst.tot);
  if(clean.length){
    clean.sort(function(a,b){ return b.tot - a.tot; });
    return "you caught every " + typeNoun(clean[0].t, 1) + ", and " + badBit + ".";
  }
  if(bad.length > 1){
    var second = bad[1];
    return badBit + ", and the " + typeNoun(second.t,1) + " went the same way.";
  }
  return badBit + ".";
}

/* Flagging all fourteen now scores eight, which lands at Trainee. */
function rank(){
  var right = S.caught + S.cleared;
  if(right>=14) return "Partner";
  if(right>=13) return "Manager";
  if(right>=11) return "Senior";
  if(right>=9) return "Staff";
  return "Trainee";
}
function tier(){
  var right = S.caught + S.cleared;
  if(right>=14) return "sweep";
  if(right>=13) return "gold";
  if(right>=11) return "silver";
  return "bronze";
}
function allStandsRight(){
  return CARDS.every(function(c,idx){ return c.key!=="stand" || S.calls[idx]==="stand"; });
}

/* ---------- payload and submit ---------- */
function payload(){
  var p = {};
  p["entry."+E.codename] = S.codename;
  p["entry."+E.round1] = ROUND1_NOTE;
  /* the form makes these three required and this version does not ask them, so they carry
     a fixed placeholder and the note in question B says so. They are not player answers. */
  p["entry."+E.expect] = "3";
  p["entry."+E.confPre] = "5";
  p["entry."+E.experience] = "Once or twice";
  for(var i=0;i<14;i++){
    var c = CARDS[i];
    var call = S.calls[i] || "stand";
    p["entry."+E.call[i]] = c.post[call];
    p["entry."+E.why[i]] = "Line "+c.n+", account "+c.acct+". Called: "+call+". Key: "+c.key+
                           ". Type: "+c.type+". "+(S.calls[i]===c.key ? "Correct." : "Missed.");
  }
  p["entry."+E.confPost] = "5";
  p["entry."+E.qa] = summaryA();
  p["entry."+E.qb] = summaryB();
  p["entry."+E.qc] = "Not asked in this version.";
  p["entry."+E.qd] = lapMinutes();
  var fbzx = String(Math.floor(Math.random()*9007199254740991));
  p["fvv"] = "1";
  p["pageHistory"] = "0,1,2";
  p["fbzx"] = fbzx;
  p["partialResponse"] = '[null,null,"'+fbzx+'"]';
  p["submissionTimestamp"] = "-1";
  return p;
}

function asText(){
  var out = ["Second Pass: Beat the Machine at Mason", "Codename: "+S.codename, orgLine(), ""];
  out.push("Round one: "+ROUND1_NOTE);
  out.push("The four scale questions were not asked in this version and carry placeholders.");
  out.push("");
  for(var i=0;i<14;i++){
    out.push("Line "+(i+1)+" ("+CARDS[i].acct+"): "+S.calls[i]+", key "+CARDS[i].key+", "+CARDS[i].type);
  }
  out.push("");
  out.push(summaryA());
  out.push(summaryB());
  out.push("Lap time: "+lapText()+", posted as "+lapMinutes()+" minute(s)");
  return out.join("\n");
}

var submitted = false;
function submitScreen(){
  screen.innerHTML = icon("robot",true)+'<h2>Sending your calls</h2>';
  if(submitted) return;
  submitted = true;
  var p = payload();
  window.__BTM_LAST_POST = p;
  var f = document.createElement("form");
  f.action = FORM_POST; f.method = "POST"; f.target = "gfsink"; f.style.display = "none";
  Object.keys(p).forEach(function(k){
    var inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = p[k];
    f.appendChild(inp);
  });
  document.body.appendChild(f);
  var settled = false;
  var sink = document.getElementById("gfsink");
  var timer = setTimeout(function(){ if(!settled){ settled = true; failScreen(); } }, 12000);
  sink.addEventListener("load", function(){
    if(settled) return;
    settled = true; clearTimeout(timer); go(18);
  });
  try{ f.submit(); }
  catch(err){ clearTimeout(timer); settled = true; failScreen(); }
}

function failScreen(){
  screen.innerHTML =
    icon("alert",true)+
    '<h2>The send did not go through</h2>'+
    '<p class="sub">Nothing is lost. Copy this and send it to Khaled.</p>'+
    '<textarea id="dump" readonly style="min-height:220px">'+esc(asText())+'</textarea>'+
    '<button class="btn" id="copy">Copy my answers</button>'+
    '<button class="btn ghost" id="retry">Try sending again</button>';
  document.getElementById("copy").addEventListener("click", function(){
    var t = document.getElementById("dump");
    t.select(); t.setSelectionRange(0,99999);
    try{ document.execCommand("copy"); this.textContent = "Copied"; }catch(e){ this.textContent = "Select and copy"; }
  });
  document.getElementById("retry").addEventListener("click", function(){ submitted = false; go(17); });
}

/* ---------- the trophy, drawn to the tier ---------- */
/* green and gold, with the cup carrying the tier */
var TROPHY = {
  bronze:{body:"#a7c6b6", dark:"#005239", name:"green"},
  silver:{body:"#4f9377", dark:"#005239", name:"deep green"},
  gold:{body:"#ffc733", dark:"#005239", name:"gold"},
  sweep:{body:"#ffc733", dark:"#005239", name:"gold, clean sweep"}
};
function trophySvg(t){
  var c = TROPHY[t];
  var star = t==="sweep"
    ? '<path d="M50 4l3.6 7.6 8.4 1.2-6 5.9 1.4 8.3L50 23.1l-7.4 3.9 1.4-8.3-6-5.9 8.4-1.2z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="1.4" stroke-linejoin="round"/>'
    : "";
  return '<svg class="trophy '+t+'" viewBox="0 0 100 104" role="img" aria-label="'+c.name+' trophy">'+
    '<defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".75"/>'+
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
      '<clipPath id="cupclip"><path d="M30 30h40v18a20 20 0 0 1-40 0z"/></clipPath></defs>'+
    star+
    '<path d="M30 30h40v18a20 20 0 0 1-40 0z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<g clip-path="url(#cupclip)"><rect class="glint" x="-40" y="28" width="26" height="44" fill="url(#shine)"/></g>'+
    '<path d="M30 34H20a10 10 0 0 0 10 12M70 34h10a10 10 0 0 1-10 12" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M50 68v12M36 92h28l-3-12H39z" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="M32 98h36" stroke="'+c.dark+'" stroke-width="3.4" stroke-linecap="round"/>'+
  '</svg>';
}

/* ---------- the badges, earned off the key. Only what was earned shows, best three first ---------- */
function got(n){ var c = CARDS[n-1]; return S.calls[n-1] === c.key; }
function badges(){
  var right = S.caught + S.cleared;
  return [
    {t:"Clean sweep",        on: right===14, i:"coins"},
    {t:"Hot lap",            on: S.best>=5, i:"fuel"},
    {t:"Nothing over-flagged", on: allStandsRight(), i:"badge"},
    {t:"Arithmetic hawk",    on: got(1) && got(8), i:"scales"},
    {t:"Invented driver caught", on: got(7), i:"glass"},
    {t:"Read the silence",   on: got(11), i:"flag"},
    {t:"Right account",      on: got(12) && got(14), i:"brief"},
    {t:"Timing and drift",   on: got(2) && got(3), i:"calendar"}
  ].filter(function(x){ return x.on; }).slice(0,3);
}

function earnedLine(){
  var right = S.caught + S.cleared;
  if(right===14) return "Every one of your fourteen calls matches the ledger.";
  if(right===0) return "None of your fourteen calls match the ledger.";
  return right + " of your fourteen calls match the ledger.";
}


function done(){
  var miss = missedCards();
  var coachInner;
  if(!miss.length){
    coachInner = '<div class="coach"><h3>Nothing to fix</h3><p class="tiny" style="margin:0">This read out lists the lines that got past you, and there are none.</p></div>';
  } else {
    coachInner = '<div class="coach"><h3>Where it got past you</h3>'+
      miss.map(function(c){
        return '<div class="miss"><b>Line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+
      (S.falseFlags > 0
        ? '<p class="tiny" style="margin:14px 0 0">'+(S.falseFlags===1?"One of those was a line":"Those were lines")+
          ' that owed nothing and read correctly, and flagging a line like that costs the controller time on work that was already right.</p>'
        : "")+
      '<p class="tiny" style="margin:14px 0 0">'+esc(patternLine().charAt(0).toUpperCase()+patternLine().slice(1))+'</p></div>';
  }
  var share = "I called " + (S.caught+S.cleared) + " of 14 lines the way the ledger has them in Second Pass: Beat the Machine at Mason.";
  var b = badges();
  var medals = b.length
    ? '<div class="badges">'+b.map(function(x,i){
        return '<span class="medal" style="animation-delay:'+(i*150)+'ms">'+
          '<span class="disc"><svg viewBox="0 0 24 24">'+I[x.i]+'</svg></span>'+
          '<em>'+x.t+'</em></span>';
      }).join("")+'</div>'
    : '<p class="nobadge">Next run, start with the arithmetic.</p>';
  screen.innerHTML =
    '<div class="final">'+
      '<div class="trophywrap">'+trophySvg(tier())+'</div>'+
      '<div class="rankbig">'+rank()+'</div>'+
      '<p class="tiny" style="margin:2px 0 0">'+esc(S.codename)+'</p>'+
      '<p class="earned">'+esc(earnedLine())+'</p>'+
      '<div class="stats">'+
        '<div><b>'+S.caught+'</b><span>caught</span></div>'+
        '<div><b>'+S.cleared+'</b><span>let stand correctly</span></div>'+
        '<div><b>'+S.falseFlags+'</b><span>false flags</span></div>'+
      '</div>'+
      '<p class="lapwrap"><span class="lap">Lap time '+lapText()+'</span>'+
        '<span class="lap">Best streak '+S.best+'</span></p>'+
      medals+
      '<div class="sharecard"><p>'+esc(share)+'</p><button class="btn ghost" id="copyshare">Copy</button></div>'+
      '<button class="btn ghost" id="playagain">Play again</button>'+
      '<button class="btn ghost" id="showmiss">'+(miss.length
          ? "See the "+miss.length+" that got past you"
          : "See the full read out")+'</button>'+
      '<div id="missbox" hidden>'+coachInner+'</div>'+
      '<button class="howlink" id="howlink">How this works in a real close</button>'+
    '</div>';
  document.getElementById("howlink").addEventListener("click", openHow);
  document.getElementById("step").textContent = "Done";
  document.getElementById("score").classList.add("hidden");
  /* a second run keeps the codename and the chips and posts its own row to the form */
  document.getElementById("playagain").addEventListener("click", function(){
    S.calls = [];
    for(var k=0;k<14;k++){ S.calls.push(null); }
    S.caught = 0; S.cleared = 0; S.falseFlags = 0; S.streak = 0; S.best = 0;
    S.confPost = null; S.qd = null;
    S.started = Date.now(); S.lapStart = 0; S.lapEnd = 0;
    submitted = false;
    go(1);
  });
  var mb = document.getElementById("missbox"), sm = document.getElementById("showmiss");
  sm.addEventListener("click", function(){
    mb.hidden = !mb.hidden;
    sm.textContent = mb.hidden
      ? (miss.length ? "See the "+miss.length+" that got past you" : "See the full read out")
      : "Hide";
  });
  document.getElementById("copyshare").addEventListener("click", function(){
    var self = this;
    function done2(){ self.textContent = "Copied"; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(share).then(done2, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = share; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done2(); }catch(e){ self.textContent = "Select the line above"; }
      ta.remove();
    }
  });
}

buildTrack();
render();
/* the brand face lands after the first paint and the codename gets wider, so place it again */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ paintTrack(); });
window.addEventListener("resize", function(){ paintTrack(); });
window.__BTM = S;
window.__BTM_CARDS = CARDS;
})();
</script>
