<style>
/* Page layout only. Everything shared lives in assets/second-pass.css.
   The three aliases below keep the hand-written SVG (the track, the car, the
   trophy) reading the same token names it always read. */
:root{
  --mason-gold:var(--gold);
  --gold-line:#c79a00;
  --mason-deep:#003527;
  --line:var(--rule);
  --machine:var(--ink-soft);
  --neg:var(--red);
  --bar-old:#c9c3b4;
}

#app{max-width:560px;margin:0 auto;padding:0 var(--gut) var(--s9);
  display:flex;flex-direction:column}
#app>*{min-width:0;max-width:100%}
#screen{flex:1;min-height:58vh;display:flex;flex-direction:column;justify-content:center;
  padding:var(--s2) 0 var(--s4)}
#screen>*{min-width:0}

/* the codename rides the masthead, right above the player's car */
#codetag{position:absolute;bottom:3px;left:0;transform:translateX(-50%);white-space:nowrap;
  font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--gold);
  transition:left .32s cubic-bezier(.3,.8,.35,1)}
@media (prefers-reduced-motion:reduce){#codetag{transition:none}}

/* ---------- test mode ---------- */
#testband{margin:0 calc(var(--gut) * -1);max-width:none;width:calc(100% + var(--gut) * 2);
  padding:var(--s2) var(--gut);
  background:var(--ink);color:#fff;border-bottom:1px solid var(--ink);
  font-size:var(--t-small);font-weight:700;letter-spacing:.03em;line-height:1.4;
  text-align:center;overflow-wrap:anywhere}
#testband span{display:block;font-weight:400;letter-spacing:0;color:#d7d5d0}

/* ---------- the race track ---------- */
#bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:var(--s3) 0 var(--s2)}
#track{line-height:0}
#trk{display:block;width:100%;height:auto;overflow:visible}
#fill{transition:width .32s cubic-bezier(.3,.8,.35,1),fill .24s ease,fill-opacity .24s ease}
#carpos{transition:transform .32s cubic-bezier(.3,.8,.35,1)}
#carfx.burst{animation:burst .2s ease-out}
#carfx.pit{animation:pit .2s ease-in-out}
@keyframes burst{0%{transform:translateX(0)}45%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes pit{0%{transform:translateY(0)}50%{transform:translateY(6.5px)}100%{transform:translateY(0)}}
#burst{opacity:0}
#burst.on{animation:speedlines .2s ease-out}
@keyframes speedlines{0%{opacity:0;transform:translateX(3px)}35%{opacity:.85}100%{opacity:0;transform:translateX(-7px)}}
#trail,#flame{transform-box:fill-box;transform-origin:100% 50%;opacity:0;
  transition:opacity .24s ease,transform .24s ease}
#trail.on,#flame.on{opacity:1}
#trail.big{transform:scaleX(1.7)}
#flame.big{transform:scale(1.4,1.15)}
#chq{opacity:.5;transition:opacity .2s ease}
#chq.lit{opacity:1}
@media (prefers-reduced-motion:reduce){
  #fill,#carpos,#flame,#trail,#chq,.flaghead .chev{transition:none}
  #carfx.burst,#carfx.pit,#burst.on{animation:none}
  #trail.big,#flame.big{transform:none}
}
#label{display:flex;justify-content:space-between;align-items:baseline;min-height:24px;
  margin-top:var(--s2);font-size:var(--t-small);color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
#score{font-weight:600;color:var(--ink)}

/* ---------- the figure strip above every card ---------- */
.strip{margin:0 0 var(--s4);padding:0 0 var(--s3);border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums}
.striptop{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
.striptop b{font-size:var(--t-label);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}
.striptop span{font-size:var(--t-body);font-weight:600}
.stripnums{display:flex;gap:var(--s4);align-items:flex-start}
.stripnums>span{flex:1;min-width:0;font-size:var(--t-label);text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft)}
.stripnums>span>i,.stripnums .ch{display:block;font-style:normal;font-size:var(--t-lead);
  font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch.neg{color:var(--red)}
.stripnums .ch i{display:block;font-style:normal;font-size:var(--t-small);font-weight:400;
  color:var(--ink-soft);margin:0}
/* At 320 the card is 250px wide and three money columns at the lead size need 278,
   so the row leaked 12px past the card. The figures step down to the body size and
   the gap closes instead. */
@media (max-width:359px){
  .stripnums{gap:var(--s2)}
  .stripnums>span>i,.stripnums .ch{font-size:var(--t-body)}
}

/* ---------- the card body ---------- */
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.cardhead.plain{margin-bottom:var(--s3)}
.revlabel{font-size:var(--t-label);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft)}
.ledgerhint{margin:0 0 var(--s4);font-size:var(--t-small);line-height:1.5;color:var(--ink-soft)}
.chart{width:100%;height:auto;display:block;margin:0 0 var(--s4)}
.says{margin:0 0 var(--s2);font-size:var(--t-label);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft)}
.quote{font-size:var(--t-lead);line-height:1.5;margin:0}
.file{margin:var(--s5) 0 0;padding:var(--s4) 0 0;border-top:1px solid var(--rule)}
.file h4{margin:0 0 var(--s2);font-size:var(--t-label);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft)}
.file ul{margin:0;padding:0 0 0 var(--s5)}
.file li{font-size:var(--t-small);line-height:1.55;margin:0 0 var(--s3)}
.file li:last-child{margin-bottom:0}
/* the document a fact came out of, quoted in one line, or the plain statement
   that no such document was supplied */
.file .cite{display:block;margin-top:2px;font-size:var(--t-small);line-height:1.5;
  color:var(--ink-soft);border-left:2px solid var(--rule);padding-left:var(--s3)}
.file .cite b{font-weight:600;font-style:normal}
.ask{font-weight:600;font-size:var(--t-body);margin:var(--s5) 0 0}
.two{display:flex;gap:var(--s3);margin-top:var(--s3)}
.two .btn{flex:1;padding:var(--s3) var(--s2)}

/* ---------- the reveal ---------- */
.outcome{margin:var(--s5) 0 var(--s4);padding:var(--s4) 0;
  border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.outcome h2{margin:0 0 var(--s2)}
.outcome.bad h2{color:var(--red)}
.outcome.good h2{color:var(--mason)}
.why{margin:0 0 var(--s3);font-size:var(--t-body);line-height:1.6}
.mark{margin:var(--s3) 0 0;font-size:var(--t-small);font-weight:600;color:var(--ink)}
.split{margin:var(--s5) 0 0}
.splitbar{height:4px;background:var(--rule);overflow:hidden;display:flex}
.splitbar i{display:block;height:100%;background:var(--ink)}
.splitlab{display:flex;justify-content:space-between;font-size:var(--t-small);
  color:var(--ink-soft);margin-top:var(--s2);font-variant-numeric:tabular-nums}

/* ---------- the ledger button and the sheet ---------- */
.ledgerbig{width:100%;margin:0 0 var(--s3);gap:var(--s2)}
.ledgerbig svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(26,26,26,.48);z-index:20;display:flex;align-items:flex-end}
#sheetbody{background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:var(--radius) var(--radius) 0 0;padding:var(--s4) var(--s3) var(--s6);
  max-width:560px;margin:0 auto}

/* ---------- the statement ---------- */
.stmtwrap{--pad:var(--s5)}
.stmt{--pad:var(--s5);background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);margin:0;padding:var(--pad);box-shadow:var(--shadow);overflow:hidden}
.stmthead{margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;
  padding:var(--s5) var(--pad) var(--s3);border-bottom:1.5px solid var(--ink)}
.stmthead b{display:block;font-size:var(--t-h2);line-height:1.25;color:var(--ink);letter-spacing:-.01em}
.stmthead span{display:block;font-size:var(--t-small);line-height:1.5;color:var(--ink-soft);margin-top:2px}
.scols,.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:var(--s5);row-gap:var(--s1)}
@media (min-width:480px){.scols,.srow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scols{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
  padding:var(--s3) 0 var(--s2);border-bottom:1.5px solid var(--ink)}
.scols span{text-align:right;padding:0;font-variant-numeric:tabular-nums}
.scols .sp{display:none}
.srow{position:relative;padding:var(--s3) var(--s2);margin:0 calc(var(--s2) * -1);
  align-items:baseline;border-top:1px solid var(--rule)}
.srow.z{background:var(--zebra)}
.srow .acctline{grid-column:1/-1;display:flex;gap:var(--s3);align-items:baseline;margin-bottom:var(--s2)}
.srow .no{flex:0 0 46px;font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink-soft)}
.srow .nm{font-size:var(--t-body);line-height:1.5;color:var(--ink)}
.srow .fg{text-align:right;font-size:var(--t-body);line-height:1.5;padding:0;color:var(--ink);
  font-variant-numeric:tabular-nums}
.srow .fg.ch{font-weight:600}
.srow .fg.neg{color:var(--red)}
.srow .pc{color:var(--ink-soft)}
.srow .pc b{font-weight:400}
.wbar{display:none;align-self:center;height:4px;background:rgba(26,26,26,.08)}
.wbar i{display:block;height:100%;background:var(--mason)}
.wbar i.neg{background:var(--red)}
.srow .mbar{grid-column:1/-1;height:3px;background:rgba(26,26,26,.07);margin-top:var(--s2);overflow:hidden}
.srow .mbar i{display:block;height:100%;background:var(--mason)}
.srow .mbar i.neg{background:var(--red)}
.sgrp{font-size:var(--t-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink);padding:var(--s5) 0 var(--s1);margin-top:var(--s2);
  border-top:1px solid var(--rule-strong)}
.srow.sub,.srow.net{padding-top:var(--s4);padding-bottom:var(--s4);background:var(--card)}
.srow.sub{border-top:1px solid var(--ink)}
.srow.sub .nm,.srow.sub .fg{font-weight:600}
.srow.net{border-top:1.5px solid var(--ink)}
.srow.net .nm,.srow.net .fg{font-weight:700}
.srow.here{background:var(--zebra)}
.srow.here .nm{font-weight:700}
.cap{margin:var(--s4) 0 0;padding:var(--s3) 0 0;font-size:var(--t-small);font-style:italic;
  line-height:1.5;color:var(--ink-soft);border-top:1px solid var(--rule)}

/* ---------- the legend and the orientation page ---------- */
.flagcard{padding:var(--s4) 0;margin:0 0 var(--s5);border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.flaghead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:var(--s3);
  background:none;border:none;padding:0;text-align:left;min-height:44px}
.flaghead h3{margin:0}
.flaghead .chev{font-size:13px;color:var(--ink-soft);transition:transform .2s ease}
.flaghead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fchips{margin:var(--s3) 0 0;padding:0;list-style:none;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s1) var(--s5)}
.fchip{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--t-small);
  line-height:1.6;color:var(--ink)}
.fchip::before{content:"";flex:0 0 auto;width:4px;height:4px;background:var(--ink-soft);
  transform:translateY(-3px)}
.flagmore{margin-top:var(--s4)}
.flagmore p{margin:0;font-size:var(--t-small);line-height:1.6;color:var(--ink-soft)}
.flagmore p+p{margin-top:var(--s2)}
.hero{margin:0 0 var(--s5)}
.hero h2{margin:0 0 var(--s2)}
.hero p{margin:0;font-size:var(--t-body);line-height:1.55;color:var(--ink-soft)}
.orient{display:block}
.orientside{display:none}
.stickygo{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:var(--s3) var(--gut);
  background:var(--paper);border-top:1px solid var(--rule)}
.stickygo .btn{margin:0 auto;max-width:484px;display:flex;width:100%}
@media (max-width:899px){#app.hasbar{padding-bottom:98px}}
@media (min-width:900px){
  #app.wide{max-width:1076px}
  .hero h2{font-size:var(--t-h1)}
  .orient{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s6);align-items:start;
    max-width:1040px;margin:0 auto}
  .orientside{display:block;position:sticky;top:96px}
  .orientmain .flagcard{display:none}
  .stickygo{display:none}
  .flaghead{pointer-events:none}
  .flaghead .chev{display:none}
  .stmt-wide{--pad:var(--s6)}
}
@media (min-width:1200px){
  #app.wide{max-width:1320px}
  .orient{max-width:1280px}
  .stmt-wide .scols,.stmt-wide .srow{
    grid-template-columns:30px minmax(0,1fr) 116px 116px 112px 72px 72px;
    column-gap:var(--s5);row-gap:0}
  .stmt-wide .srow.sub .fg,.stmt-wide .srow.net .fg{font-weight:600}
  .stmt-wide .scols .sp{display:block}
  .stmt-wide .srow{align-items:center;padding:var(--s2);min-height:28px}
  .stmt-wide .srow.sub,.stmt-wide .srow.net{padding-top:var(--s4);padding-bottom:var(--s4)}
  .stmt-wide .srow .acctline{display:contents}
  /* an account name wraps rather than ending in an ellipsis. At 1280 the name column runs
     about 193 pixels and five of the fourteen names are longer than that, so truncating
     them hid the very thing the row is named for. */
  .stmt-wide .srow .nm{overflow-wrap:anywhere}
  .stmt-wide .srow .fg{font-size:var(--t-body);padding:0}
  .stmt-wide .srow .mbar{display:none}
  .stmt-wide .wbar{display:block}
}

/* ---------- the basis row ---------- */
.basis{margin-top:var(--s2)}
.basishint{margin:0 0 var(--s3)}
.basis .chips{margin:0 0 var(--s4)}
.basis .chip{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.basiswords{display:block;font-size:var(--t-small);font-weight:600;color:var(--ink-soft);
  margin:0 0 var(--s2)}
.basis .btn{display:flex;width:100%;margin-top:var(--s4)}

/* ---------- the data notice ---------- */
.notice{margin:0 0 var(--s5);padding:var(--s5) 0;
  border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.notice h3{margin:0 0 var(--s3)}
.notice ul{margin:0;padding:0 0 0 var(--s5)}
.notice li{font-size:var(--t-body);line-height:1.6;margin:0 0 var(--s3)}
.notice li:last-child{margin-bottom:0}
.noticever{margin:var(--s4) 0 0;font-size:var(--t-small);line-height:1.5;color:var(--ink-soft)}

/* ---------- round two results ---------- */
.res{margin:0;padding:var(--s5) 0;border-top:1px solid var(--rule)}
.res:first-of-type{border-top:1.5px solid var(--ink)}
.resline{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:baseline;margin:0 0 var(--s2)}
.resline b{font-size:var(--t-body);line-height:1.4}
.res p{margin:var(--s2) 0 0;font-size:var(--t-body);line-height:1.6}
.res .yours{margin:var(--s3) 0 0;font-size:var(--t-small);line-height:1.55;
  color:var(--ink-soft);overflow-wrap:anywhere}

/* ---------- the end screen ---------- */
.final{text-align:left;overflow-wrap:anywhere}
.trophywrap{display:flex;margin:0 0 var(--s4)}
.trophy{width:108px;height:auto;animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
.trophy .glint{animation:sweep 1.1s ease-out .5s both}
@keyframes rise{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(130px)}}
@media (prefers-reduced-motion:reduce){.trophy,.trophy .glint{animation:none}.trophy .glint{opacity:0}}
/* the gold underline moved to the points numeral, which is the headline figure on this
   screen. The rank is the word under it and carries no color of its own. */
.rankbig{font-size:var(--t-h2);font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
.ranknote{margin:var(--s3) 0 0;font-size:var(--t-small);line-height:1.5;color:var(--ink-soft)}
.earned{margin:var(--s4) 0 var(--s2);font-size:var(--t-lead);line-height:1.5}
.fresh{margin:0 0 var(--s1);font-size:var(--t-body);font-weight:600;font-variant-numeric:tabular-nums}
.lapwrap{margin:var(--s4) 0 var(--s5);font-size:var(--t-body);color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.lapwrap span:not(:last-child)::after{content:"";display:inline-block;width:1px;height:.85em;
  margin:0 var(--s3);background:var(--rule-strong);vertical-align:-.05em}
.badges{display:flex;flex-wrap:wrap;gap:var(--s6);margin:var(--s5) 0 var(--s6)}
.medal{display:flex;flex-direction:column;align-items:center;gap:var(--s2);width:96px;max-width:100%;
  opacity:0;transform:translateY(6px);animation:medalin .4s ease forwards}
.medal .disc{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
  border-radius:50%;background:transparent;border:1px solid var(--ink)}
.medal .disc svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.medal em{font-style:normal;font-size:var(--t-small);line-height:1.35;text-align:center;color:var(--ink)}
@keyframes medalin{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.medal{animation:none;opacity:1;transform:none}}
.nobadge{margin:0 0 var(--s5);font-size:var(--t-small);line-height:1.55;color:var(--ink-soft)}
.sharecard{margin:var(--s5) 0 0;padding:var(--s5) 0;border-top:1px solid var(--rule)}
.sharecard p{margin:0 0 var(--s3);font-size:var(--t-body);line-height:1.55;overflow-wrap:anywhere}
.endlinks{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);margin:var(--s4) 0 0}

.coach{margin:var(--s6) 0 0;padding:var(--s5) 0 0;border-top:1px solid var(--rule);text-align:left}
.coach h3{margin:0 0 var(--s4)}
.miss{border-top:1px solid var(--rule);padding:var(--s4) 0 0;margin:var(--s4) 0 0}
.miss:first-of-type{border-top:none;padding-top:0;margin-top:0}
.miss b{display:block;font-size:var(--t-body)}
.miss em{display:block;font-style:normal;font-size:var(--t-label);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:var(--s1) 0}
.miss span{display:block;font-size:var(--t-small);color:var(--ink-soft);line-height:1.55}

/* ---------- the practitioner note ---------- */
.howlink{display:inline-block;background:none;border:none;padding:var(--s2) 0;
  text-decoration:underline;text-underline-offset:.2em;font-size:var(--t-body);
  line-height:1.5;color:var(--ink-soft);text-align:left}
.howlink:hover{color:var(--ink)}
.linkrow{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:var(--s3) 0 0}

racts, unchanged in June, plus $229,000 of June service on the twelve new contracts, equals $1,041,000.","The maintenance contracts bill monthly in arrears, so the June invoice covers June service, and nothing on these contracts is billed ahead of the service period."],"key":"stand","type":"clean line","why":"The service dates and the earned revenue bridge place the full $229,000 in June: twelve contracts began service on 1 June, and $812,000 of continuing contracts plus $229,000 of June service ties to the $1,041,000 on the ledger. Billing monthly in arrears is background rather than the reason, because the date an invoice carries does not decide when the service revenue is earned, so nothing sitting in June belongs to a later period.","over":"The trap on this account is a plan billed a year ahead, and the service dates on file show the opposite.","tell":"Billing dates alone would not settle this line. The service dates and the earned revenue bridge are what let it stand.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":5,"icon":"brief","acct":"6500","name":"Professional fees","prior":55000,"current":47500,"memo":"Professional fees fell $7,500 because May carried a one-time $7,500 invoice from outside counsel for the depot lease renewal review, and the movement fails the dollar leg of the threshold.","file":["May professional fees include a $7,500 invoice from outside counsel for the depot lease renewal review. The work was performed in May and expensed in May.","June carries no equivalent item.","A line owes commentary only when it clears both $25,000 and 10 percent."],"key":"stand","type":"clean line","why":"The invoice on file covers May services, was expensed in May, and has no June counterpart, so $55,000 less $7,500 is $47,500 and the whole movement is accounted for. It fails the dollar leg as well, so no commentary was owed here at all and the memo explained it anyway and got it right.","over":"Thirteen percent looks like it clears, and the dollar leg is the one that decides this line.","tell":"Both legs have to clear before a line owes anything, and $7,500 never reaches $25,000.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":6,"icon":"box","acct":"7400","name":"Inventory shrink adjustment","prior":6400,"current":8900,"memo":"","file":["A line owes commentary only when it clears both $25,000 and 10 percent.","The threshold sets what the monthly management report has to explain. It does not make anything exempt from attention."],"key":"stand","type":"clean line","why":"Thirty nine percent looks alarming until you test the dollar leg, and $2,500 does not reach $25,000, so this reporting policy asks for nothing on the line. The policy decides what the management report must explain; it does not put a known error or a suspicious item beyond attention.","over":"The percentage pulled you in, and a big percentage of a small balance is still a small number.","tell":"A big percentage of a small balance is still a small number.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":7,"icon":"glass","acct":"4000","name":"Product revenue, distribution","prior":5240000,"current":5612000,"memo":"Product revenue of $5,612,000 grew on the Tri-State depot ramp, which management expects to continue through the third quarter.","file":["The memo cites no volume, no customer count and no split by depot.","Halyard runs four regional depots and the ledger is not broken out by depot.","No depot revenue bridge and no documented forecast were supplied."],"key":"flag","type":"unsupported driver","why":"A named depot and a forecast quarter read like detail, and nothing supplied ties either of them to the $372,000. Neither is established from the evidence on file, which is not the same as saying either is false. A depot revenue bridge or a documented forecast would settle it.","truth":"Nothing supplied ties the Tri-State depot or the third quarter forecast to the $372,000, so neither is established from the evidence on file.","ask":"Ask the controller for a depot revenue bridge or the documented forecast.","over":"","tell":"Ask what document would prove the sentence. When nothing on file does, the sentence is not established, whatever else may turn out to be true.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["no source on file"]},{"n":8,"icon":"alert","acct":"6400","name":"Bad debt expense","prior":15000,"current":62000,"memo":"Bad debt expense increased $42,000 following the reserve taken against the Coastal Grocers receivable.","file":["No other sentence in the memo touches this account.","No reserve rollforward for June was supplied, and no document establishes the amount of the Coastal Grocers reserve."],"key":"flag","type":"arithmetic","why":"The account moved $47,000 and the memo says $42,000, so the figure does not tie to the ledger. Nothing supplied establishes $42,000 as the Coastal Grocers piece either, so the $5,000 difference cannot be assigned to anything. The ask is a reserve rollforward for June, not a guess at the remainder.","truth":"The account moved $47,000 and the memo says $42,000, so the figure does not tie to the ledger and the $5,000 difference belongs to nothing on file.","ask":"Ask the controller for a June reserve rollforward.","tell":"The memo handed you a number, so check it against the ledger before you read the reason attached to it.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["figure does not tie","no source on file"]},{"n":9,"icon":"fuel","acct":"6100","name":"Fleet fuel","prior":96400,"current":91200,"memo":"Fleet fuel fell $5,200, and the movement fails both legs of the threshold, so the line owes no commentary at all.","file":["Every June fuel invoice from the fleet servicer was received and recorded before the books closed.","The fleet servicer confirmed that all June fuel consumption is billed on those invoices, so June consumption and June invoices are the same population.","A line owes commentary only when it clears both $25,000 and 10 percent."],"key":"stand","type":"clean line","why":"It fails both legs, so the policy asks for nothing, and the case facts state that all June consumption was billed and recorded, which is what closes the accrual question. Invoices received on their own would not have done it.","over":"You went looking for a cost that arrived late, and the case facts close that door. Every invoice received is not the same claim as every cost incurred was billed, and here the file states both.","tell":"Read the file before you decide a cost is missing, and check whether it covers completeness or only receipt.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":10,"icon":"chip","acct":"6300","name":"Software subscriptions","prior":28500,"current":30100,"memo":"Software subscriptions rose $1,600, which clears neither leg of the threshold, so this line carries no driver.","file":["A line owes commentary only when it clears both $25,000 and 10 percent."],"key":"stand","type":"clean line","why":"It fails both legs, so no explanation is required under this commentary policy, and the memo says so rather than inventing a reason, which is the right answer on a line this size.","over":"A short sentence is not a weak one, and no explanation was required on this movement.","tell":"A line under the threshold owes nothing, and saying so is a correct answer.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":11,"icon":"people","acct":"6000","name":"Warehouse wages","prior":630000,"current":702500,"memo":"","file":["A line owes commentary only when it clears both $25,000 and 10 percent.","Halyard employs roughly 240 people across four depots. The count is approximate and the ledger gives no headcount by month.","No payroll bridge, rate change or hours summary was supplied."],"key":"flag","type":"no explanation","why":"$72,500 is 11.5 percent and clears both legs with room to spare, and the memo is silent on this line, so the movement reaches the reviewer with no sentence attached to it at all. The approximate headcount does not establish a cause, so the ask is a payroll bridge showing rates, hours and staffing.","truth":"$72,500 is 11.5 percent and clears both legs with room to spare, and the memo says nothing about this line at all.","ask":"Ask the controller for a payroll bridge showing rates, hours and staffing.","tell":"Read the ledger for what the memo left out, not only for what it got wrong.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["nothing written where owed","no source on file"]},{"n":12,"icon":"flag","acct":"4000","name":"Product revenue, distribution","prior":5240000,"current":5612000,"memo":"Distribution revenue of $5,612,000 grew 7.1 percent over May on continued customer demand across all four depots.","file":["Freight billed to customers, account 4200, fell $65,000 over the same month.","Inbound freight, account 5100, rose $73,800, so freight is still being incurred.","From June 1, Halyard moved its two largest customers to delivered pricing: freight is included in the product price and no longer billed on account 4200 (pricing memo of May 20 on file).","No billing bridge for account 4200 by customer was supplied, so the gross movement behind the $65,000 net fall is not known.","No sentence in the memo connects the two revenue lines to each other."],"key":"flag","type":"unsupported attribution","why":"From 1 June the freight for the two largest customers sits inside the product price rather than on account 4200, and the memo never mentions the change, so calling the growth continued customer demand is not established. How much of the $372,000 is that reclassification is not established either: $65,000 is only the net fall on 4200, and $80,000 could have moved into bundled pricing while other freight billings rose $15,000. The ask is a billing bridge for 4200 by customer.","truth":"From 1 June the freight for the two largest customers sits inside the product price rather than on account 4200, and the memo never mentions the change.","ask":"Ask the controller for a billing bridge on account 4200 by customer.","tell":"When one revenue line falls while a related one rises, ask whether anything moved between them, and ask for the bridge rather than reading the net fall as the amount that moved.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["no source on file"]},{"n":13,"icon":"scales","acct":"5000","name":"Cost of product sold","prior":3930000,"current":4278000,"memo":"Cost of product sold rose $348,000 against a $372,000 rise in product revenue. Product gross profit rose from $1,310,000 to $1,334,000, while product gross margin fell from 25.0 percent in May to 23.8 percent in June. The category report points to a shift toward lower margin produce and dairy lines as the likely cause, and a category sales and cost bridge has been requested to confirm it.","file":["Product gross margin is account 4000 less account 5000, divided by account 4000.","Account 4000 ran $5,240,000 in May and $5,612,000 in June. Account 5000 ran $3,930,000 and $4,278,000.","June sales by category: produce and dairy rose from 31 to 36 percent of product revenue, and those two categories carry the lowest margins (category report on file).","The category report carries revenue shares only. No category cost is in it, and no category sales and cost bridge has been supplied."],"key":"stand","type":"clean line","why":"Recompute it and the figures tie: margin falls from 25.0 percent to 23.8, a fall of 1.2 percentage points, while gross profit dollars still rise $24,000, and the memo reports both rather than blending them. The mix sentence is offered as a likely cause with a bridge requested, which is as far as the category report on file can carry it, so there is nothing here to reject. Standing here means the calculation holds and nothing more: the mix cause is a hypothesis until the category sales and cost bridge is on file.","over":"A margin that falls while gross profit dollars rise is not a contradiction, and this memo states both. The mix claim is written as a hypothesis with the bridge requested, not asserted as fact. Letting it stand does not verify that claim either, and the bridge request stays open.","tell":"Recompute the ratio, and keep gross profit dollars separate from the margin percentage, before you decide the memo buried something.","post":{"flag":"Accept","stand":"Reject"},"stillOpen":"Standing on this line is provisional. The calculation holds; the mix cause is a hypothesis until the category sales and cost bridge is on file, and that request stays open in the review log.","basisKey":["the figure and reason hold"]},{"n":14,"icon":"bank","acct":"7100","name":"Interest expense","prior":61200,"current":92400,"memo":"Interest expense rose $31,200 on the depot equipment additions that also sit in depreciation.","file":["Depreciation, account 7000, was $128,000 in May and $128,000 in June.","No fixed asset additions were recorded in May or June.","The revolver balance rose from $3.1 million to $5.6 million on June 3.","Other draw and repayment dates, daily balances, rates and fees were not supplied, and the memo does not mention the revolver."],"key":"flag","type":"unsupported driver","why":"Nothing was added to fixed assets and depreciation did not move, so the equipment story is not established by anything supplied. The revolver rose $2.5 million on 3 June and the memo never mentions it, which makes the draw the candidate to investigate rather than the proved cause: the other draw and repayment dates, the daily balances, the rate and the fees would be needed to quantify how much of the $31,200 it explains.","truth":"Nothing was added to fixed assets and depreciation did not move, so the equipment story is not established, while the revolver rose $2.5 million on 3 June and the memo never mentions it.","ask":"Ask the controller for the revolver draw and repayment dates, the daily balances, the rate and the fees.","tell":"The memo pointed at another account, so go and look at that account before you accept the sentence.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["no source on file"]}],"basisKeyNote":"basisKey is the set of basis chips that are correct for the card. A chip outside that set contradicts the key for this card. The reason is scored right when the player chose at least one chip in the key and no chip outside it. A card whose key is 'stand' carries only \"the figure and reason hold\", because a chip naming a defect contradicts a line that has none. The reason score is a compatibility check on the stated basis, not a rubric score; the three-dimension reasoning rubric is scored by a person outside the page.","basisChips":{"stand":["the figure and reason hold","figure does not tie","direction wrong","no source on file","wrong period","wrong account","nothing written where owed"],"flag":["figure does not tie","direction wrong","no source on file","wrong period","wrong account","nothing written where owed"]},"changeLog":[{"version":"halyard-v4","date":"2026-09-13","changed":"Card 4, service revenue: the reveal no longer says billing in arrears puts each fee in the month it was earned. It now says the service dates and the earned revenue bridge place the full $229,000 in June, and billing timing is stated as background.","why":"The 13 September independent release review: \"Billing does not determine when service revenue is earned.\" The stand call is unchanged."},{"version":"halyard-v4","date":"2026-09-13","changed":"Card 14, interest expense: the on-file fact that read \"No draw dates, daily balances, rates or fee schedule were supplied\" now reads \"Other draw and repayment dates, daily balances, rates and fees were not supplied\", and the reveal matches.","why":"The same review: the file supplied the 3 June draw date and then said no draw dates were supplied. The on-file facts now agree with each other and with the June period. The flag call and the revolver as the candidate to quantify are unchanged."},{"version":"halyard-v4","date":"2026-09-13","changed":"Card 13, cost of product sold: the reveal, the over-flag note and a new stillOpen line say that standing is provisional. The calculation holds; the mix cause is a hypothesis until the category sales and cost bridge is on file.","why":"The same review: \"Stand must not mean the causal explanation is verified or the follow-up is closed.\" The stand call is unchanged."},{"version":"halyard-v4","date":"2026-09-13","changed":"Every card carries basisKey, and the file carries basisKeyNote and basisChips.","why":"The same review scored 14 of 14 while selecting \"wrong account\" on every line. The call and the reason are now scored separately."}]};
var CASE2_FALLBACK = {"version":"brightwater-v5","date":"2026-09-13","mode":"assessment","company":"Brightwater Dental Partners, PLLC","period":"June close, prepared from the practice general ledger","caption":"The five accounts the second memo was written against.","threshold":"A line owes commentary only when it clears both $25,000 and 10 percent.","policyScope":"The threshold sets what the monthly management report has to explain. It does not make a known error, or anything else that looks wrong, exempt from attention.","evidenceNote":"Every entry under On file is a verified case assumption. Each one either quotes a line from a dated document in the file or says plainly that no such document was supplied. A fact that is not listed was not supplied, which is not the same as saying the practice has no such document. Read the date on a document before you let it carry a sentence.","assessmentNote":"Every figure in this memo ties to the ledger, every direction word is right and every threshold reading is right, so arithmetic, direction and the threshold are settled before you start. Every one of the five lines carries a sentence naming a cause, and the only question on each is whether something on file carries that cause.","ledger":[["4010","Patient service revenue, net",742000,803500,1],["4220","Orthodontic plan revenue",96000,138400,1],["5210","Dental supplies and lab fees",138500,191200,1],["6110","Hygienist wages",214000,268900,1],["6610","Marketing and patient outreach",18400,24100,1]],"groups":[{"title":"Revenue","accts":["4010","4220"],"total":"Total revenue"},{"title":"Clinical cost of care","accts":["5210"],"total":"Total clinical cost of care"},{"title":"Operating expenses","accts":["6110","6610"],"total":"Total operating expenses"}],"cards":[{"n":1,"icon":"box","acct":"5210","name":"Dental supplies and lab fees","prior":138500,"current":191200,"memo":"Dental supplies and lab fees rose $52,700, or 38.1 percent, on the implant cases the new surgical suite to ond hygiene chair opened at the Ashburn office on 1 June, and the staffing plan for it is on file.","doc":"Hygiene staffing plan, Ashburn","date":"12 May 2026","quote":"Second hygiene chair in service 1 June 2026, staffed by two hygienists hired for it."},{"fact":"The June payroll register is on file. Two hygienists hired for the second chair were paid $54,900 in June between them.","doc":"Payroll register, June 2026","date":"30 June 2026","quote":"Hygienist gross pay June 2026 $268,900, of which A. Rivas $27,600 and D. Okafor $27,300, both hired 1 June for the second chair."},{"fact":"No other hygienist rate, hour or headcount changed between May and June, so the two new hygienists are the whole of the movement.","doc":"Payroll register, May 2026, with the June rate change report","date":"30 June 2026","quote":"Hygienist gross pay May 2026 $214,000, six hygienists. Rate changes effective in June 2026: none."},{"fact":"A line owes commentary only when it clears both $25,000 and 10 percent.","doc":"Brightwater monthly reporting policy, section 4","date":"1 January 2026","quote":"Commentary is owed on a line only where the movement clears both $25,000 and 10 percent of the prior balance."}],"key":"stand","type":"clean line","why":"The figures tie, the direction is right, and the payroll register on file puts the whole $54,900 on the two hygienists hired for the second chair with no other hygienist pay moving, so the cause is carried by a document rather than asserted. The line clears both legs of the threshold and the commentary it owes is the commentary it received.","over":"The largest movement on the statement is not automatically the weakest sentence, and the payroll register carries this one from end to end.","tell":"Ask which document would prove the sentence, and here the payroll register does.","post":{"flag":"Accept","stand":"Reject"},"basisKey":["the figure and reason hold"]},{"n":3,"icon":"scales","acct":"4220","name":"Orthodontic plan revenue","prior":96000,"current":138400,"memo":"Orthodontic plan revenue rose $42,400, or 44.2 percent, as the thirty-one new orthodontic plans that started in June began billing.","file":[{"fact":"The orthodontic plan schedule on file is dated 31 May and lists the plans running before June. It lists no plan that started in June.","doc":"Orthodontic plan schedule","date":"31 May 2026","quote":"Active plans at 31 May 2026: 96. Monthly plan billing at 31 May 2026: $96,000. Plans starting after 31 May 2026: not covered by this schedule."},{"fact":"No June plan schedule, no plan count for June and no deferred revenue rollforward for June was supplied.","missing":"Requested from the practice on 6 July 2026. Nothing received, so nothing is on file."},{"fact":"Nothing on file states how many plans started in June or what those plans bill.","missing":"The 31 May schedule is the only plan document in the file, and it stops before the movement."},{"fact":"A line owes commentary only when it clears both $25,000 and 10 percent.","doc":"Brightwater monthly reporting policy, section 4","date":"1 January 2026","quote":"Commentary is owed on a line only where the movement clears both $25,000 and 10 percent of the prior balance."}],"key":"flag","type":"unsupported driver","why":"$42,400 is 44.2 percent of May and the figures tie, so the arithmetic is not what fails here. The only plan schedule on file is dated 31 May and covers the plans running before June, so it cannot carry thirty-one plans that started in June, and nothing else supplied states a June plan count. A document on file is not the same as a document covering the period the sentence is about. A June plan schedule, or a deferred revenue rollforward for June, would settle it.","truth":"The only plan schedule on file is dated 31 May and covers the plans running before June, so it cannot carry thirty-one plans that started in June.","ask":"Ask the practice for a June plan schedule or a June deferred revenue rollforward.","tell":"Check the date var CASE1 = CASE1_FALLBACK, CASE2 = CASE2_FALLBACK;
var CASE_SOURCE = "inline fallback";
var ROWS, ROWS2, THRESHOLD, POLICY_SCOPE, EVIDENCE_NOTE, CARDS, CARDS2, GROUPS, GROUPS2, BOOK1, BOOK2;
/* round two runs in assessment mode when its case file says so: no reveal between lines,
   no score, no streak and no track, and everything comes back at once at the end */
var ASSESS = false;
/* a case with no fresh set at all runs round one and then the end screen */
var HAS_R2 = true;

/* ---------- which case the drill is running ----------
   Three choices on the intro screen. Halyard is the default and the case every published
   result was scored against. Kestrel is offered only when cases/kestrel-v1.json is actually
   on the server, so a build without it shows two options rather than a broken one. "My own
   case" is whatever author.html last wrote into this browser.

   Brightwater stays the fresh case for both authored cases. An own case gets a fresh set
   only if its author wrote one, and skips round two when they did not. */
var OWN_KEY = "btm.owncase.v1";
var FRESH_FILE = "cases/brightwater-v5.json";
var CASE_CHOICES = [
  {id:"halyard", label:"Halyard Provisioning", file:"cases/halyard-v4.json", fresh:FRESH_FILE},
  {id:"kestrel", label:"Kestrel IT Services",  file:"cases/kestrel-v1.json", fresh:FRESH_FILE},
  {id:"own",     label:"My own case",          file:null,                   fresh:null}
];
var CASE_AVAILABLE = {halyard:true, kestrel:false, own:false};
var CASE_PICK = "halyard";
/* the id that rides into the payload and the record beside the version */
var CASE_RUN_ID = "halyard";

function choiceOf(id){
  for(var i=0;i<CASE_CHOICES.length;i++){ if(CASE_CHOICES[i].id === id) return CASE_CHOICES[i]; }
  return CASE_CHOICES[0];
}
/* ?case=own, ?case=kestrel or ?case=halyard in the address picks the case before the
   intro screen is drawn, which is how the author page's Preview button arrives */
function pickFromQuery(){
  var m = null;
  try{ m = /(?:^|[?&])case=([a-z0-9_-]+)/i.exec(window.location.search); }catch(e){ m = null; }
  return m ? m[1].toLowerCase() : null;
}
function ownCase(){
  var raw = null;
  try{ raw = window.localStorage.getItem(OWN_KEY); }catch(e){ return null; }
  if(!raw) return null;
  var was;
  try{ was = JSON.parse(raw); }catch(e){ return null; }
  if(!was || !was["case"] || !was["case"].cards || !was["case"].cards.length) return null;
  return was;
}

/* Eight of the fourteen Halyard lines carry a problem and six are clean. Neither number
   is printed anywhere, because a player who knew the split could work the odds instead
   of the ledger. The five Brightwater lines are three problems and two clean. */
/* The two column headings over every set of figures. A case names its own months in
   `columns`; the Halyard and Brightwater files predate that field and are May against June,
   which is the fallback rather than a value invented for them. */
var MONTHS_DEFAULT = ["May", "June"];
function monthsOf(c){
  return (c && c.columns && c.columns.length === 2) ? c.columns : MONTHS_DEFAULT;
}

function bindCases(){
  ROWS = CASE1.ledger;
  THRESHOLD = CASE1.threshold;
  POLICY_SCOPE = CASE1.policyScope;
  EVIDENCE_NOTE = CASE1.evidenceNote;
  CARDS = CASE1.cards;
  GROUPS = CASE1.groups;
  BOOK1 = {rows:ROWS, groups:GROUPS, name:CASE1.company, sub:CASE1.period, cap:CASE1.caption,
           months:monthsOf(CASE1)};
  HAS_R2 = !!(CASE2 && CASE2.cards && CASE2.cards.length);
  if(HAS_R2){
    ROWS2 = CASE2.ledger;
    CARDS2 = CASE2.cards;
    GROUPS2 = CASE2.groups;
    BOOK2 = {rows:ROWS2, groups:GROUPS2, name:CASE2.company, sub:CASE2.period, cap:CASE2.caption,
             months:monthsOf(CASE2)};
    ASSESS = CASE2.mode === "assessment";
  } else {
    ROWS2 = []; CARDS2 = []; GROUPS2 = []; BOOK2 = BOOK1; ASSESS = false;
  }
  buildRanks(CARDS);
  setSteps();
}

/* the number of lines, and every screen number that follows from it. Fourteen and five give
   back the numbers this page has always used; an authored case of any length gets its own. */
var LINES = 14, LINES2 = 5;
var STEP_L1_LAST = 16, STEP_BRIDGE = 17, STEP_L2 = 18, STEP_L2_LAST = 22, STEP_DONE = 24;
function setSteps(){
  LINES = CARDS.length;
  LINES2 = HAS_R2 ? CARDS2.length : 0;
  STEP_L1_LAST = 2 + LINES;
  STEP_BRIDGE  = 3 + LINES;
  STEP_L2      = 4 + LINES;
  STEP_L2_LAST = 3 + LINES + LINES2;
  STEP_DONE    = 5 + LINES + LINES2;
  SEGS = LINES;
}

function fetchJSON(u){
  return fetch(u, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(u + " " + r.status);
    return r.json();
  });
}

/* Which of the three choices this build can actually offer. Halyard is always there because
   the inline fallback carries it; Kestrel only when the file answers; an own case only when
   author.html has written one into this browser. */
function probeCases(then){
  CASE_AVAILABLE.halyard = true;
  CASE_AVAILABLE.own = !!ownCase();
  if(typeof fetch !== "function"){ CASE_AVAILABLE.kestrel = false; return then(); }
  fetchJSON("cases/kestrel-v1.json")
    .then(function(j){ CASE_AVAILABLE.kestrel = !!(j && j.cards && j.cards.length); then(); })
    .catch(function(){ CASE_AVAILABLE.kestrel = false; then(); });
}

/* the fetch, with the generated copy behind it. Nothing renders until one of the two wins. */
function loadCases(pick, then){
  CASE_PICK = pick || "halyard";
  function fallback(why){
    CASE1 = CASE1_FALLBACK; CASE2 = CASE2_FALLBACK;
    CASE_PICK = "halyard";
    CASE_RUN_ID = "halyard";
    CASE_SOURCE = "inline fallback" + (why ? " (" + why + ")" : "");
    bindCases(); then();
  }
  if(CASE_PICK === "own"){
    var own = ownCase();
    if(!own) return fallback("no own case in this browser");
    CASE1 = own["case"];
    CASE2 = own.fresh || null;
    CASE_RUN_ID = own.id || ("own:" + (own.name || "unnamed") + ":" + (own.caseVersion || "0"));
    CASE_SOURCE = "this browser, written by author.html";
    bindCases();
    return then();
  }
  var ch = choiceOf(CASE_PICK);
  CASE_RUN_ID = ch.id;
  if(typeof fetch !== "function") return fallback("no fetch");
  Promise.all([fetchJSON(ch.file), fetchJSON(ch.fresh)]).then(function(pair){
    if(!pair[0] || !pair[0].cards || !pair[0].cards.length) throw new Error(ch.file + " carries no lines");
    if(!pair[1] || !pair[1].cards || !pair[1].cards.length) throw new Error(ch.fresh + " carries no lines");
    CASE1 = pair[0]; CASE2 = pair[1];
    CASE_SOURCE = "cases/ files";
    bindCases(); then();
  }).catch(function(){ fallback("could not read " + ch.file); });
}


/* ---------- state ---------- */
/* organizations, tapped on the way in so the pooled results can be counted by chapter.
   "Outside Mason" is the practitioner route: somebody with no campus tie answers truthfully
   rather than claiming an affiliation they do not have. */
var ORGS = ["Beta Alpha Psi", "ACFE", "ASM", "NABA", "AAA", "GMU Student", "Professor", "Outside Mason"];

/* one attempt identifier per run, reused by every retry so a retry cannot double count */
function newAttemptId(){
  var t = Date.now().toString(36);
  var r = Math.floor(Math.random()*1679616).toString(36);
  while(r.length < 4) r = "0" + r;
  return "att-" + t + "-" + r;
}

var S = {
  step:0, codename:"", orgs:[],
  /* sel is the call that is selected and not yet committed, first is the very first call the
     player selected on that line, and calls is the committed one. A line is locked when calls
     carries a value, and only a locked line is scored or revealed. */
  calls:[], sel:[], first:[], basis:[], words:[], secs:[], asecs:[], confPost:null, qd:null,
  caught:0, cleared:0, falseFlags:0, streak:0, best:0, points:0, started:0,
  lapStart:0, lapEnd:0, itemStart:0,
  /* the card clock runs on wall time, and a second clock takes the tab's hidden time back out
     of it, so a run that sat in a background tab is not reported as review work */
  hiddenTotal:0, hiddenAt:0, itemHiddenBase:0,
  /* round two keeps its own counters, because the fresh case is scored on its own and
     the rank and the badges are still read off the fourteen trained lines */
  r2calls:[], r2sel:[], r2first:[], r2basis:[], r2words:[], r2secs:[], r2asecs:[],
  r2caught:0, r2cleared:0, r2false:0, r2Start:0, r2End:0, r2Revealed:0,
  attemptId:newAttemptId(), runIndex:1, testAttempt:TEST_MODE,
  sendState:"not sent", sendAttempts:0, completedAt:0,
  /* what the receipt endpoint answered, empty until one is set and one answers */
  receipt:"", receiptAt:"", receiptState:"not offered",
  /* the case this run is being played on, so a reload comes back on the same one */
  casePick:"halyard"
};
function blankRound(n, into){
  into.calls = []; into.sel = []; into.first = []; into.basis = []; into.words = [];
  into.secs = []; into.asecs = [];
  for(var k=0;k<n;k++){
    into.calls.push(null); into.sel.push(null); into.first.push(null);
    into.basis.push(null); into.words.push(""); into.secs.push(0); into.asecs.push(0);
  }
}
/* Everything a run holds, cleared and resized to the case now loaded. It is the one reset:
   Play again calls it, and so does a change of case on the intro screen. The codename and the
   chapter chips are deliberately left alone, because a second run is the same player. */
function freshRun(){
  var one = {}, two = {};
  blankRound(LINES, one); blankRound(LINES2, two);
  S.calls = one.calls; S.sel = one.sel; S.first = one.first;
  S.basis = one.basis; S.words = one.words; S.secs = one.secs; S.asecs = one.asecs;
  S.r2calls = two.calls; S.r2sel = two.sel; S.r2first = two.first;
  S.r2basis = two.basis; S.r2words = two.words; S.r2secs = two.secs; S.r2asecs = two.asecs;
  LINE_PTS = []; LEVELED = false;
  S.caught = 0; S.cleared = 0; S.falseFlags = 0; S.streak = 0; S.best = 0; S.points = 0;
  S.r2caught = 0; S.r2cleared = 0; S.r2false = 0; S.r2Start = 0; S.r2End = 0; S.r2Revealed = 0;
  S.confPost = null; S.qd = null;
  S.started = Date.now(); S.lapStart = 0; S.lapEnd = 0; S.itemStart = 0; S.completedAt = 0;
  S.hiddenTotal = 0; S.hiddenAt = 0; S.itemHiddenBase = 0;
  /* a second run is a second attempt, so it gets its own id rather than reusing the first one,
     which is what keeps a retry of one run distinct from a fresh run */
  S.attemptId = newAttemptId();
  S.sendState = "not sent"; S.sendAttempts = 0;
  S.receipt = ""; S.receiptAt = ""; S.receiptState = "not offered";
  S.casePick = CASE_PICK;
  S.step = 0;
  sending = false;
  saveRun();
}
(function(){
  var one = {}, two = {};
  blankRound(14, one); blankRound(5, two);
  S.calls = one.calls; S.sel = one.sel; S.first = one.first;
  S.basis = one.basis; S.words = one.words; S.secs = one.secs; S.asecs = one.asecs;
  S.r2calls = two.calls; S.r2sel = two.sel; S.r2first = two.first;
  S.r2basis = two.basis; S.r2words = two.words; S.r2secs = two.secs; S.r2asecs = two.asecs;
})();
/* hidden time, counted once for the whole run and taken off each card at the lock */
function hiddenNow(){ return S.hiddenTotal + (S.hiddenAt ? (Date.now() - S.hiddenAt) : 0); }
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ if(!S.hiddenAt) S.hiddenAt = Date.now(); }
  else if(S.hiddenAt){ S.hiddenTotal += Date.now() - S.hiddenAt; S.hiddenAt = 0; }
});

var screen = document.getElementById("screen");

/* ---------- the run survives a refresh ----------
   Everything above lives in sessionStorage under one key, written after every state change,
   so a reload drops the player back on the screen they were on with their calls intact.
   It is per tab and it goes when the tab goes, which is the right lifetime for a drill. */
var SKEY = "btm.run.v1";
var restoring = false;
function saveRun(){
  if(restoring) return;
  try{ window.sessionStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){}
}
function clearRun(){ try{ window.sessionStorage.removeItem(SKEY); }catch(e){} }
function restoreRun(){
  var raw = null;
  try{ raw = window.sessionStorage.getItem(SKEY); }catch(e){ return false; }
  if(!raw) return false;
  var was;
  try{ was = JSON.parse(raw); }catch(e){ return false; }
  if(!was || typeof was !== "object" || !was.attemptId) return false;
  /* a saved run belongs to the case it was played on. A run saved on one case is not
     restored onto another, because its calls index a different set of lines. */
  if((was.casePick || "halyard") !== CASE_PICK) return false;
  if(!Array.isArray(was.calls) || was.calls.length !== LINES) return false;
  if(!Array.isArray(was.r2calls) || was.r2calls.length !== LINES2) return false;
  restoring = true;
  Object.keys(was).forEach(function(k){ S[k] = was[k]; });
  restoring = false;
  /* a run saved by an older build carries no selection and no first-call arrays */
  if(!Array.isArray(S.sel) || S.sel.length !== LINES) S.sel = S.calls.slice();
  if(!Array.isArray(S.first) || S.first.length !== LINES) S.first = S.calls.slice();
  if(!Array.isArray(S.r2sel) || S.r2sel.length !== LINES2) S.r2sel = S.r2calls.slice();
  if(!Array.isArray(S.r2first) || S.r2first.length !== LINES2) S.r2first = S.r2calls.slice();
  /* a send that was in flight when the tab reloaded is not a send that landed */
  if(S.sendState === "sending") S.sendState = "not sent";
  S.testAttempt = S.testAttempt || TEST_MODE;
  return true;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function go(n){ S.step = n; saveRun(); render(); window.scrollTo(0,0); }
function money(v){ return "$" + Math.round(Math.abs(v)).toLocaleString("en-US"); }
function pctOf(c){ return (Math.abs(c.current-c.prior)/c.prior*100).toFixed(1); }
function dirWord(c){ return c.current>=c.prior ? "up" : "down"; }

/* ---------- the track. Fourteen segments, one car, a chequered flag at the end. ---------- */
var CAR_X0 = 9, CAR_X1 = 283;
/* fourteen segments, one per trained line. Round two runs in assessment mode, where a car
   that moved or changed color would tell the player how they were doing, so the whole bar
   comes off the screen from the bridge to the results and the finish sits at line fourteen. */
var SEGS = 14;
function buildTrack(){
  var ticks = "", k, x;
  for(k=1;k<SEGS;k++){
    x = CAR_X0 + (k/SEGS)*(CAR_X1-CAR_X0);
    ticks += '<rect x="'+(x-0.4).toFixed(1)+'" y="9" width="0.8" height="7" fill="#fff" opacity=".7"/>';
  }
  var chq = "", r, c;
  for(r=0;r<4;r++){ for(c=0;c<2;c++){
    if((r+c)%2===0) chq += '<rect x="'+(287.4+c*3.4)+'" y="'+(8+r*3.5)+'" width="3.4" height="3.5" fill="var(--mason)"/>';
  } }
  document.getElementById("track").innerHTML =
    '<svg id="trk" viewBox="0 0 300 34" role="img" '+
      'aria-label="Fourteen lines, one segment each, with a lock mark over every line you have committed">'+
      '<g id="locks"></g>'+
      '<g id="trackbody" transform="translate(0,8)">'+

      ticks+
      '<g id="chq"><rect x="286.6" y="8" width="0.8" height="14.4" fill="var(--mason)"/>'+chq+'</g>'+
      '<g id="carpos" style="transform:translate('+CAR_X0+'px,0px)">'+
        '<g id="burst"><rect x="-21" y="11.3" width="7" height="1.2" rx=".6" fill="var(--ink-soft)"/>'+
          '<rect x="-17.5" y="14.1" width="5" height="1.2" rx=".6" fill="var(--ink-soft)"/></g>'+
        '<g id="trail"><rect x="-25" y="11.5" width="11" height="1.5" rx=".75" fill="var(--mason)" fill-opacity=".5"/>'+
          '<rect x="-21" y="14.3" width="8" height="1.5" rx=".75" fill="var(--mason)" fill-opacity=".38"/></g>'+
        '<g id="flame"><path d="M-7.5 12.9 q-6.5 -3.4 -11.5 0 q5 3.4 11.5 0z" fill="var(--gold-line)"/>'+
          '<path d="M-7.5 12.9 q-3.8 -1.9 -6.8 0 q3 1.9 6.8 0z" fill="var(--mason-gold)"/></g>'+
        '<g id="carfx">'+
          '<rect x="-7" y="11" width="14" height="4.1" rx="1.6" fill="var(--mason)"/>'+
          '<path d="M-2.8 11 L-1.4 8.3 L2.4 8.3 L3.9 11 Z" fill="var(--mason-gold)"/>'+
          '<rect x="-6" y="12.3" width="12" height="1.1" rx=".55" fill="var(--mason-gold)"/>'+
          '<circle cx="-4" cy="15.4" r="1.9" fill="var(--mason-deep)"/>'+
          '<circle cx="4" cy="15.4" r="1.9" fill="var(--mason-deep)"/>'+
        '</g>'+
      '</g>'+
      '</g>'+
    '</svg>';
}
/* a committed line wears a small lock over its segment, so the track shows at a glance
   which calls are settled and which one is still the player's to change */
function lockGlyph(cx){
  return '<g transform="translate('+cx.toFixed(1)+',0)">'+
    '<path d="M-1.55 3.5V2.35a1.55 1.55 0 0 1 3.1 0V3.5" fill="none" stroke="var(--mason)" '+

/* ---------- points and rank ----------
   A hundred for a call that agrees with the answer key, fifty for a basis that agrees with it,
   twenty five for every step of a streak from the third onward, and seventy five for catching a
   cause the memo asserted with nothing behind it. Points and rank are read off the trained lines
   only: the fresh case runs as an assessment and is scored on its own, and a points total moving
   between those lines would tell the player how they were doing. */
var PT_CALL = 100, PT_REASON = 50, PT_STREAK = 25, PT_COVER = 75, STREAK_FROM = 3;
/* the two error types where the memo names a cause and nothing on file carries it */
function isCoverStory(c){
  return c.type === "unsupported driver" || c.type === "unsupported attribution";
}
/* The ladder is a share of what the case in front of the player is worth, not a fixed count of
   points, because fourteen Halyard lines and twelve Kestrel lines cannot be worth the same run.
   A twelve line case topped out at Manager while the ladder read absolute points.

   maxAttainable is the run where every call, every basis, every streak step and every cover
   story lands. blanketCeiling is the most a player can score by calling every line the same way
   without reading one of them, taking the better of flag every line and stand every line and
   giving that player the basis points too. Partner sits at 95 percent of the first and the
   Senior line is held above the second, so a perfect run reaches the top of any case and a
   blanket call stops at Staff on any case. */
function maxAttainable(cards){
  var pts = 0, st = 0, i, c;
  cards = cards || [];
  for(i=0;i<cards.length;i++){
    c = cards[i];
    pts += PT_CALL + PT_REASON;
    st++; if(st >= STREAK_FROM) pts += PT_STREAK;
    if(c.key === "flag" && isCoverStory(c)) pts += PT_COVER;
  }
  return pts;
}
function blanketPoints(cards, call){
  var pts = 0, st = 0, i, c;
  cards = cards || [];
  for(i=0;i<cards.length;i++){
    c = cards[i];
    if(c.key !== call){ st = 0; continue; }
    pts += PT_CALL + PT_REASON;
    st++; if(st >= STREAK_FROM) pts += PT_STREAK;
    if(call === "flag" && isCoverStory(c)) pts += PT_COVER;
  }
  return pts;
}
function blanketCeiling(cards){
  return Math.max(blanketPoints(cards, "flag"), blanketPoints(cards, "stand"));
}
var RANK_NAMES = ["Trainee", "Staff", "Senior", "Manager", "Partner"];
var RANK_SHARE = [0, 0.34, 0.57, 0.76, 0.95];
var RANK_MAX = 0, RANK_BLANKET = 0;
var RANKS = [];
function buildRanks(cards){
  var top = maxAttainable(cards), floor = blanketCeiling(cards), at = [], i;
  for(i=0;i<RANK_SHARE.length;i++) at.push(Math.round(top * RANK_SHARE[i]));
  if(at[2] <= floor) at[2] = floor + 1;
  for(i=3;i>=1;i--) if(at[i] >= at[i+1]) at[i] = at[i+1] - 1;
  for(i=1;i<at.length;i++) if(at[i] <= at[i-1]) at[i] = at[i-1] + 1;
  if(at[at.length-1] > top) at[at.length-1] = top;
  RANK_MAX = top; RANK_BLANKET = floor;
  RANKS = [];
  for(i=0;i<RANK_NAMES.length;i++) RANKS.push({name:RANK_NAMES[i], at:at[i]});
  /* the verification hook holds the array itself, so hand it the new one */
  if(window.__BTM_POINTS){
    window.__BTM_POINTS.ranks = RANKS;
    window.__BTM_POINTS.max = RANK_MAX;
    window.__BTM_POINTS.blanket = RANK_BLANKET;
  }
  return RANKS;
}
buildRanks([]);
function linePoints(c, call, chips, streakBefore){
  var p = {call:0, reason:0, streak:0, cover:0, streakAt:0, total:0};
  if(call !== c.key) return p;
  p.call = PT_CALL;
  if(reasonRight(c, chips)) p.reason = PT_REASON;
  p.streakAt = streakBefore + 1;
  if(p.streakAt >= STREAK_FROM) p.streak = PT_STREAK;
  if(c.key === "flag" && isCoverStory(c)) p.cover = PT_COVER;
  p.total = p.call + p.reason + p.streak + p.cover;
  return p;
}
/* every counter is recomputed from the calls on record rather than added to as they arrive,
   because a player who goes back and changes one call changes everything that follows it */
var LINE_PTS = [];
function rescore(){
  var caught=0, cleared=0, ff=0, st=0, best=0, pts=0;
  LINE_PTS = [];
  for(var i=0;i<CARDS.length;i++){
    var call = S.calls[i];
    if(call === null || call === undefined){ LINE_PTS.push(null); continue; }
    var c = CARDS[i];
    var p = linePoints(c, call, S.basis[i], st);
    LINE_PTS.push(p);
    pts += p.total;
    if(call === c.key){
      if(c.key === "flag") caught++; else cleared++;
      st++; if(st > best) best = st;
    } else {
      if(call === "flag") ff++;
      st = 0;
    }
  }
  S.caught = caught; S.cleared = cleared; S.falseFlags = ff;
  S.streak = st; S.best = best; S.points = pts;
}
function rescore2(){
  var ca=0, cl=0, ff=0;
  for(var i=0;i<CARDS2.length;i++){
    var call = S.r2calls[i];
    if(call === null || call === undefined) continue;
    var c = CARDS2[i];
    if(call === c.key){ if(c.key === "flag") ca++; else cl++; }
    else if(call === "flag") ff++;
  }
  S.r2caught = ca; S.r2cleared = cl; S.r2false = ff;
}
function rankAt(points){
  var r = RANKS[0];
  for(var i=0;i<RANKS.length;i++){ if(points >= RANKS[i].at) r = RANKS[i]; }
  return r;
}
function rankProgress(){
  var pts = S.points || 0, cur = rankAt(pts), idx = 0, i;
  for(i=0;i<RANKS.length;i++){ if(RANKS[i] === cur) idx = i; }
  var nxt = RANKS[idx+1] || null;
  if(!nxt) return {name:cur.name, pct:100, next:null, need:0, at:0};
  var span = nxt.at - cur.at;
  return {name:cur.name, next:nxt.name, at:nxt.at, need:Math.max(0, nxt.at - pts),
          pct:Math.max(0, Math.min(100, Math.round((pts - cur.at) / span * 100)))};
}
function pointsText(n){ return Number(n||0).toLocaleString("en-US"); }

/* the header meter: the rank the points have reached, and how far into the next one they are */
function paintRank(){
  var box = document.getElementById("rankmeter");

  box.hidden = !show;

function flashRank(){

function progress(){
  var trk = document.getElementById("track");

  if(trk) trk.hidden = quiet;
  if(!quiet) paintTrack();
  paintRank();
  var lab = document.getElementById("step");

  if(S.step>=3 && S.step<=STEP_L1_LAST){

    else sc.classList.add("hidden");
  } else if(HAS_R2 && S.step>=STEP_L2 && S.step<=STEP_L2_LAST){
    /* assessment: progress and nothing else. No running score, because a pill that moved
       after every call would tell the player whether the last one landed. */
    var seen2 = doneIn(S.r2calls);
    lab.textContent = ASSESS ? ((S.step-STEP_BRIDGE)+" of "+LINES2) : ("Fresh line "+(S.step-STEP_BRIDGE)+" of "+LINES2);
    if(!ASSESS && seen2){ sc.classList.remove("hidden"); sc.textContent = "Right "+(S.r2caught+S.r2cleared)+" of "+seen2; }
    else sc.classList.add("hidden");
  } else if(S.step===0){ lab.textContent=""; sc.classList.add("hidden"); }
  else { lab.textContent = "Second Pass"; sc.classList.add("hidden"); }
}

/* ---------- the ledger, on call from every card ---------- */
/* every ledger function takes the book it is reading, so the five account dental
   statement of round two runs through the same component as the fourteen account one */
function bookOf(n){ return n===2 ? BOOK2 : BOOK1; }
function rowFor(acct, bk){
  var rows = (bk || BOOK1).rows;
  for(var i=0;i<rows.length;i++){ if(rows[i][0]===acct) return rows[i]; }
  return null;
}
function moveCell(d){ return d<0 ? "("+money(d)+")" : (d>0 ? "+"+money(d) : "$0"); }

/* the account under review, printed on the card as its statement line */
function strip(acct, bk){

    '<div class="stripnums"><span>'+esc(mo[0])+'<i>'+money(r[2])+'</i></span>'+

/* ---------- the statement, one component for the orientation screen and the sheet ---------- */

function sumOf(accts, col, bk){
  var t = 0;
  accts.forEach(function(a){ var r = rowFor(a, bk); if(r) t += r[col]; });
  return t;
}
function changeCell(prior, current){
  var d = current - prior;
  var pc = prior ? (d/prior*100).toFixed(1)+"%" : "0.0%";
  return '<span class="ch '+(d<0?"neg":"pos")+'">'+moveCell(d)+'<i>'+pc+'</i></span>';
}
/* One row per account. On a phone it stacks, on a desk it reads as one line, and the
   movement bar takes a column of its own there and a line under the figures here. */
function figCells(prior, current, barPct){
  var d = current - prior;
  var pc = (prior ? (d/prior*100) : 0);
  var neg = d<0 ? " neg" : "";
  var bar = (barPct===null) ? "" :
    '<span class="wbar"><i class="'+(neg?"neg":"")+'" style="width:'+barPct+'%"></i></span>';
  return '<span class="fg">'+money(prior)+'</span>'+
         '<span class="fg">'+money(current)+'</span>'+
         '<span class="fg ch'+neg+'">'+moveCell(d)+'</span>'+
         '<span class="fg pc'+neg+'"><b>'+pc.toFixed(1)+'%</b></span>'+bar;
}
function movementBar(prior, current, barPct){
  var neg = current<prior ? " neg" : "";
  return '<span class="mbar"><i class="'+neg.trim()+'" style="width:'+barPct+'%"></i></span>';
}
function acctRow(r, acct, maxPct, z){
  var pct = r[2] ? Math.abs((r[3]-r[2])/r[2]*100) : 0;
  var w = Math.max(10, Math.round(pct/maxPct*100));
  var here = (r[0]===acct);
  return '<div class="srow'+(z%2?" z":"")+(here?" here":"")+'"'+(here?' id="hererow"':'')+'>'+
      '<span class="acctline"><span class="no">'+r[0]+'</span>'+
        '<span class="nm">'+esc(r[1])+'</span></span>'+
      figCells(r[2], r[3], w)+
      movementBar(r[2], r[3], w)+
    '</div>';
}
function totalRow(label, pr, cu, cls){
  return '<div class="srow '+cls+'">'+
      '<span class="acctline"><span class="no"></span><span class="nm">'+label+'</span></span>'+
      figCells(pr, cu, null)+
    '</div>';
}
function statement(acct, wide, bk){
  bk = bk || BOOK1;
  var mo = bk.months || MONTHS_DEFAULT;
  var maxPct = 0;
  bk.rows.forEach(function(r){ if(r[2]) maxPct = Math.max(maxPct, Math.abs((r[3]-r[2])/r[2]*100)); });
  var body = "", z = 0;
  bk.groups.forEach(function(g){
    body += '<div class="sgrp">'+g.title+'</div>';
    g.accts.forEach(function(a){
      var r = rowFor(a, bk); if(!r) return;
      z++;
      body += acctRow(r, acct, maxPct, z);
    });
    body += totalRow(g.total, sumOf(g.accts,2,bk), sumOf(g.accts,3,bk), "sub");
  });
  var netP = sumOf(bk.groups[0].accts,2,bk), netC = sumOf(bk.groups[0].accts,3,bk);
  bk.groups.slice(1).forEach(function(g){ netP -= sumOf(g.accts,2,bk); netC -= sumOf(g.accts,3,bk); });
  body += totalRow("Net of the accounts shown", netP, netC, "net");
  return '<div class="stmt'+(wide?" stmt-wide":"")+'">'+
    '<div class="stmthead"><b>'+esc(bk.name)+'</b>'+
      '<span>'+esc(bk.sub)+'</span></div>'+
    '<div class="scols"><span class="sp"></span><span class="sp"></span>'+
      '<span>'+esc(mo[0])+'</span><span>'+esc(mo[1])+'</span><span>Change</span><span>Percent</span>'+
      '<span class="sp"></span></div>'+
    body+
    '<p class="cap">'+esc(bk.cap)+'</p></div>';
}

/* The reviewer prompt, in the wording the Second Pass challenger prompt already uses.

var HOWPROMPT = [
"You are a review assistant working inside a month-end close. You raise challenges. You never approve, never sign off, and you never rewrite the memo. The conclusion is mine.",
"",
"My threshold: a line owes commentary only when it clears both $[AMOUNT] and [PERCENT] percent. Both legs have to pass.",
"",

"",
"Run these four checks first, on every sentence, before you read for meaning.",

"2. Test every direction word (rose, fell, declined) against the sign of that account's movement.",

"4. From that list, name every account no sentence in the memo mentions. That silence is itself a challenge.",
"",

"",

/* one copy handler, used by the prompt box */
function copyText(btn, text, okLabel){
  function ok(){ btn.textContent = okLabel; }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent = "Select the text above"; }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else { fallback(); }
}

/* four boxes and arrows, green and gold, sized to read on a 375 pixel phone */

function cardBody(c, round, i){

    ? '<p class="says">What the memo says</p><p class="quote">'+esc(c.memo)+'</p>'
    : '<p class="says">What the memo says</p><p class="quote">Nothing. This account is not mentioned anywhere in the commentary.</p>';

     fact with the one line of the document it came out of and that document's

    ? '<div class="file"><h4>On file</h4><ul>'+c.file.map(function(f){
