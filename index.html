<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005239">
<title>Second Pass: Beat the Machine at Mason</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* George Mason Green, George Mason Gold, Logo Black and the accent palette,
     from brand.gmu.edu/brand-guide/brand-colors */
  --mason:#005239;
  --mason-deep:#003527;
  --mason-gold:#ffc733;
  --gold-line:#e0ac00;
  --ink:#333333;
  --ink-soft:#5a5d61;
  --paper:#f6f3ec;
  --card:#ffffff;
  --line:#dfd8c9;
  --accept:#005239;
  --accept-bg:#e3f2e8;
  --reject:#cc4824;
  --reject-bg:#fbe9e4;
  --machine:#004f71;
  --machine-bg:#e3eef4;
  --bar-old:#cfc6b2;
  --neg:#a83a1c;
  --gut:18px;
  --shadow:0 2px 0 rgba(0,82,57,.09), 0 8px 24px rgba(0,82,57,.09);
}
@media (max-width:399px){:root{--gut:12px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:17px/1.45 Figtree,"Open Sans","Franklin Gothic Book","Franklin Gothic",
       -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:0 var(--gut) 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:30px;line-height:1.12;margin:0 0 10px;letter-spacing:-.5px;color:var(--mason)}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;letter-spacing:-.3px;color:var(--mason)}
h3{font-size:19px;line-height:1.22;margin:0 0 6px;letter-spacing:-.2px;color:var(--mason)}

/* The university and college names set in type. No logo file and no Patriot mark. */
#mason{position:relative;background:var(--mason);color:#fff;margin:0 calc(var(--gut) * -1);
  padding:12px var(--gut) 22px;border-bottom:3px solid var(--mason-gold)}
/* the codename rides the band, right above the player's car */
#codetag{position:absolute;bottom:4px;left:0;transform:translateX(-50%);white-space:nowrap;
  font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--mason-gold);
  transition:left .32s cubic-bezier(.3,.8,.35,1)}
@media (prefers-reduced-motion:reduce){#codetag{transition:none}}
#mason b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;line-height:1.2}
#mason span{display:block;font-size:12.5px;letter-spacing:.3px;color:#dff0e4;margin-top:2px}
#masonfoot{margin:20px calc(var(--gut) * -1) 0;padding:14px var(--gut) 4px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.4;color:var(--ink-soft);text-align:center}
p{margin:0 0 14px}
.sub{color:var(--ink-soft);font-size:16px}
.tiny{font-size:13px;color:var(--ink-soft)}

#bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 8px}
#track{line-height:0}
#trk{display:block;width:100%;height:auto;overflow:visible}
#fill{transition:width .32s cubic-bezier(.3,.8,.35,1),fill .24s ease,fill-opacity .24s ease}
#carpos{transition:transform .32s cubic-bezier(.3,.8,.35,1)}
#carfx.burst{animation:burst .2s ease-out}
#carfx.pit{animation:pit .2s ease-in-out}
@keyframes burst{0%{transform:translateX(0)}45%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes pit{0%{transform:translateY(0)}50%{transform:translateY(6.5px)}100%{transform:translateY(0)}}
#burst{opacity:0}
#burst.on{animation:speedlines .2s ease-out}
@keyframes speedlines{0%{opacity:0;transform:translateX(3px)}35%{opacity:.85}100%{opacity:0;transform:translateX(-7px)}}
#trail,#flame{transform-box:fill-box;transform-origin:100% 50%;opacity:0;
  transition:opacity .24s ease,transform .24s ease}
#trail.on,#flame.on{opacity:1}
#trail.big{transform:scaleX(1.7)}
#flame.big{transform:scale(1.4,1.15)}
#chq{opacity:.5;transition:opacity .2s ease}
#chq.lit{opacity:1}
@media (prefers-reduced-motion:reduce){
  #fill,#carpos,#flame,#trail,#chq,.flaghead .chev{transition:none}
  #carfx.burst,#carfx.pit,#burst.on{animation:none}
  #trail.big,#flame.big{transform:none}
  .toast{animation:none}
}
#label{display:flex;justify-content:space-between;align-items:center;min-height:25px;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.scorepill{font-weight:700;color:var(--ink);background:#ece6d8;border-radius:99px;padding:3px 10px}

#screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
.icon{width:68px;height:68px;display:block;margin:0 0 14px}
.icon svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.big{width:96px;height:96px}

button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:14px;padding:16px;font-size:18px;font-weight:700;margin-top:12px;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:2px solid var(--line);background:var(--card);border-radius:14px;
  padding:15px 16px;font-size:17px;margin-top:10px;box-shadow:var(--shadow);
}
.choice:active{transform:translateY(1px)}
.choice.on{border-color:var(--ink);background:#fff}
.choice .tick{width:22px;height:22px;border-radius:99px;border:2px solid var(--line);flex:0 0 auto}
.choice.on .tick{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{
  border:2px solid var(--line);background:var(--card);border-radius:99px;
  padding:10px 14px;font-size:15px;font-weight:600;
}
.chip.on{border-color:var(--mason);background:var(--mason);color:#fff}
.chip.sm{padding:8px 12px;font-size:14px}

input[type=text],textarea{
  width:100%;font:inherit;padding:15px;border:2px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);
}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.acct{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.3px;background:var(--machine-bg);color:var(--machine);border-radius:99px;padding:5px 12px;margin-bottom:10px}
.move{font-size:16px;line-height:1.35;margin:0 0 12px}
.chart{width:100%;height:auto;display:block;margin:0 0 14px}
.says{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--machine);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.says svg{width:20px;height:20px;fill:none;stroke:var(--machine);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.quote{font-size:17px;line-height:1.4;margin:0}

.file{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 0}
.file h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
.file ul{margin:0;padding:0 0 0 16px}
.file li{font-size:14px;line-height:1.4;margin:0 0 5px}
.file li:last-child{margin-bottom:0}

.ask{font-weight:700;font-size:15px;margin:16px 0 0;color:var(--ink-soft)}
.two{display:flex;gap:10px;margin-top:10px}
.two .btn{margin-top:0;flex:1;padding:17px 6px;font-size:17px}
.btn.call{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.call:active{background:var(--paper)}

.verdict{border-radius:18px;padding:16px 18px;margin-bottom:12px;border:2px solid}
.verdict.good{background:var(--accept-bg);border-color:var(--accept)}
.verdict.bad{background:var(--reject-bg);border-color:var(--reject)}
.verdict h2{margin:0 0 4px;font-size:20px;color:var(--ink)}
.type{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.bonus{display:inline-block;background:var(--mason-gold);color:#333333;border:2px solid var(--gold-line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;margin-top:10px}
.why{margin:0 0 4px}
.toast{display:inline-block;background:var(--mason-gold);color:#333333;border:2px solid var(--gold-line);
  border-radius:99px;padding:5px 14px;font-weight:800;font-size:14px;margin:10px 0 0;
  animation:pop .22s ease-out both}
@keyframes pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}

.split{margin:16px 0 0}
.splitbar{height:12px;border-radius:99px;background:#e6e0d2;overflow:hidden;display:flex}
.splitbar i{display:block;height:100%}
.splitbar i.c{background:var(--ink)}
.splitbar i.k{background:var(--accept)}
.splitlab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:6px}
.key{display:inline-block;width:9px;height:9px;border-radius:99px;vertical-align:middle;margin-right:5px}
.key.c{background:var(--ink)}
.key.k{background:var(--accept)}

.link{background:none;border:none;padding:8px 0;text-decoration:underline;font-size:15px;color:var(--ink-soft)}
.hidden{display:none!important}

#sheet{position:fixed;inset:0;background:rgba(0,53,39,.58);z-index:20;display:flex;align-items:flex-end}
#sheetbody{background:var(--paper);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px 24px;max-width:520px;margin:0 auto}
/* the statement: round one reads it, and the Ledger button reopens it during play */
/* ---------- the statement. One grid, stacked on a phone, one line per row on a desk ---------- */
.stmtwrap{--pad:16px}
.stmt{--pad:16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0;
  padding:var(--pad);box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
.stmthead{background:var(--mason);margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;
  padding:16px var(--pad) 14px;border-bottom:2px solid var(--mason-gold)}
.stmthead b{display:block;font-size:20px;line-height:1.25;color:#fff;letter-spacing:-.2px}
.stmthead span{display:block;font-size:13px;line-height:1.45;color:var(--mason-gold);margin-top:3px}
.scols,.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:20px;row-gap:6px}
/* four numbers only sit on one line once there is room for them; below that May and June
   take the first line and Change and Percent the second, on the same gutters */
@media (min-width:480px){.scols,.srow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scols{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
  padding:12px 0 8px;border-bottom:1px solid var(--line)}
.scols span{text-align:right;padding:0;font-variant-numeric:tabular-nums}
.scols .sp{display:none}
.srow{position:relative;padding:12px 10px;margin:0 -10px;align-items:baseline;
  border-top:1px solid rgba(0,82,57,.10)}
.srow.z{background:rgba(0,82,57,.03)}
.srow .acctline{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.srow .no{flex:0 0 46px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.45;color:var(--ink-soft)}
.srow .nm{font-size:15px;line-height:1.45;color:var(--ink)}
.srow .fg{text-align:right;font-size:15px;line-height:1.45;padding:0;color:var(--ink);
  font-variant-numeric:tabular-nums}
.srow .fg.ch{font-weight:600}
.srow .fg.neg{color:var(--neg)}
.srow .pc{color:var(--ink-soft)}
.srow .pc b{font-weight:400}
/* the movement bar gets its own column on a desk, so it never sits behind a figure */
.wbar{display:none;align-self:center;height:6px;border-radius:99px;background:rgba(0,82,57,.08)}
.wbar i{display:block;height:100%;border-radius:99px;background:rgba(0,82,57,.55)}
.wbar i.neg{background:rgba(168,58,28,.50)}
.srow .mbar{grid-column:1/-1;height:4px;border-radius:99px;background:rgba(0,82,57,.07);
  margin-top:8px;overflow:hidden}
.srow .mbar i{display:block;height:100%;border-radius:99px;background:rgba(0,82,57,.45)}
.srow .mbar i.neg{background:rgba(168,58,28,.45)}
.sgrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mason);
  padding:16px 0 2px;margin-top:6px;border-top:1px solid rgba(0,82,57,.22)}
.srow.sub,.srow.net{padding-top:14px;padding-bottom:14px}
.srow.sub{border-top:1px solid var(--ink)}
.srow.sub .nm,.srow.sub .fg{font-weight:700}
.srow.net{border-top:2px solid var(--ink)}
.srow.net .nm,.srow.net .fg{font-weight:800}
.srow.sub,.srow.net{background:#fff}
.srow.here{background:rgba(255,199,51,.06);box-shadow:inset 4px 0 0 var(--mason-gold)}
.srow.here .nm{font-weight:700}
.cap{margin:14px 0 0;padding:12px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft);
  border-top:1px solid var(--line)}

/* the legend, and the orientation page it sits on */
.flagcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--mason);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:16px;margin:0 0 14px}
.flaghead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:none;padding:0;text-align:left;min-height:32px}
.flaghead h3{margin:0;font-size:17px}
.flaghead .chev{font-size:13px;color:var(--ink-soft);transition:transform .2s ease}
.flaghead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,82,57,.06);
  border:1px solid rgba(0,82,57,.20);border-radius:99px;padding:6px 11px;
  font-size:13px;line-height:1.45;font-weight:600;color:var(--ink)}
.fchip svg{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--mason);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.flagmore{margin-top:12px}
.flagmore p{margin:0;font-size:15px;line-height:1.45}
.flagmore p+p{margin-top:8px}
.hero{margin:0 0 14px}
.hero h2{margin:0 0 6px}
.hero p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.orient{display:block}
.orientside{display:none}
.stickygo{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px var(--gut);
  background:linear-gradient(to top,var(--paper) 74%,rgba(246,243,236,0))}
.stickygo .btn{margin:0 auto;max-width:484px}
@media (max-width:899px){#app.hasbar{padding-bottom:98px}}
@media (min-width:900px){
  #app.wide{max-width:1076px}
  .hero h2{font-size:28px}
  .orient{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;
    max-width:1040px;margin:0 auto}
  .orientside{display:block;position:sticky;top:96px}
  .orientmain .flagcard{display:none}
  .stickygo{display:none}
  .flaghead{pointer-events:none}
  .flaghead .chev{display:none}
  .stmt-wide{--pad:24px}
}
/* one line per account, with room for every figure and a column of its own for the bar */
@media (min-width:1200px){
  #app.wide{max-width:1320px}
  .orient{max-width:1280px}
  .stmt-wide .scols,.stmt-wide .srow{
    grid-template-columns:30px minmax(0,1fr) 116px 116px 112px 72px 72px;
    column-gap:20px;row-gap:0}
  .stmt-wide .srow.sub .fg,.stmt-wide .srow.net .fg{font-weight:600}
  .stmt-wide .scols .sp{display:block}
  .stmt-wide .srow{align-items:center;padding:10px;min-height:28px}
  .stmt-wide .srow.sub,.stmt-wide .srow.net{padding-top:14px;padding-bottom:14px}
  .stmt-wide .srow .acctline{display:contents}
  .stmt-wide .srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
  .stmt-wide .srow .fg{font-size:16px;padding:0}
  .stmt-wide .srow .mbar{display:none}
  .stmt-wide .wbar{display:block}
}

.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cardhead.plain{margin-bottom:10px;align-items:center}
.revlabel{font-size:13px;font-weight:700;color:var(--ink-soft)}
.ledgerbig{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;
  border:2px solid var(--ink-soft);background:var(--card);color:var(--ink);border-radius:99px;
  padding:13px 16px;font-size:16px;font-weight:700;margin:0 0 12px}
.ledgerbig svg{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ledgerbig:active{background:var(--paper);transform:translateY(1px)}
.ledgerhint{margin:0 0 14px;font-size:13px;line-height:1.4;color:var(--ink-soft);text-align:center}
.strip{background:var(--machine-bg);border-left:3px solid var(--machine);border-radius:0 10px 10px 0;
  padding:10px 12px;margin:0 0 14px;font-variant-numeric:tabular-nums}
.striptop{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.striptop b{color:var(--machine);font-size:13px}
.striptop span{font-size:14px;font-weight:600}
.stripnums{display:flex;gap:10px;align-items:flex-start}
.stripnums>span{flex:1;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.stripnums>span>i{display:block;font-style:normal;font-size:15px;font-weight:700;color:var(--ink);
  text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch{display:block;font-size:15px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
.stripnums .ch.neg{color:var(--neg)}
.stripnums .ch i{display:block;font-style:normal;font-size:13px;font-weight:400;color:var(--ink-soft);margin:0}

/* the basis row: one tap set between the call and the reveal */
.basis{margin-top:4px}
.basishint{margin:0 0 10px;text-align:center}
.basis .chips{margin:0 0 12px}
.basis .chip{flex:1 1 auto;min-width:0;font:inherit;font-size:15px;line-height:1.25;font-weight:600;
  color:var(--ink);cursor:pointer;text-align:center;overflow-wrap:anywhere}
.basis .chip:hover{border-color:var(--mason)}
.chip:focus-visible{outline:3px solid var(--mason-gold);outline-offset:2px}
.basis .chip.on{color:#fff}
.basiswords{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.basisinput{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;
  padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.basisinput:focus-visible{outline:3px solid var(--mason-gold);outline-offset:2px;border-color:var(--mason)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.final{text-align:center;overflow-wrap:anywhere}
.trophywrap{display:flex;justify-content:center;margin:4px 0 6px}
.trophy{width:132px;height:auto;animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
.trophy .glint{animation:sweep 1.1s ease-out .5s both}
@keyframes rise{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(130px)}}
@media (prefers-reduced-motion:reduce){.trophy,.trophy .glint{animation:none}.trophy .glint{opacity:0}}
.rankbig{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.05;color:var(--mason);
  overflow-wrap:anywhere}
.ranknote{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--ink-soft)}
.stats{display:flex;gap:8px;margin:0 0 10px}
.stats>div{min-width:0}
.lapwrap{margin:0 0 18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lap{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:6px 14px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats div{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px}
.stats b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px;line-height:1.2}
.earned{margin:12px 0 16px;font-size:16px;color:var(--ink-soft)}
/* the fresh case, scored on its own and set apart from the main score by a gold ring */
.fresh{margin:0 0 2px}
.fresh .lap{border-color:var(--gold-line);border-width:2px}
.badges{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:0 0 18px}
.medal{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;max-width:100%;
  opacity:0;transform:translateY(6px);animation:medalin .4s ease forwards}
.medal .disc{display:flex;align-items:center;justify-content:center;width:62px;height:62px;
  border-radius:50%;background:var(--paper);border:2px solid var(--mason-gold);
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.medal .disc svg{width:26px;height:26px;fill:none;stroke:var(--mason);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.medal em{font-style:normal;font-size:14px;line-height:1.3;text-align:center;color:var(--ink)}
@keyframes medalin{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.medal{animation:none;opacity:1;transform:none}}
.nobadge{margin:0 0 18px;font-size:14px;line-height:1.45;color:var(--ink-soft);text-align:center}
.sharecard{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:left}
.sharecard p{margin:0 0 10px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.sharecard .btn{margin-top:0;padding:11px;font-size:16px}
.coach{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:18px 0 0;text-align:left;box-shadow:var(--shadow)}
.coach h3{margin:0 0 10px}
.miss{border-top:1px solid var(--line);padding:10px 0 0;margin:10px 0 0}
.miss:first-of-type{border-top:none;padding-top:0;margin-top:0}
.miss b{display:block;font-size:15px}
.miss em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--machine);margin:2px 0 4px}
.miss span{display:block;font-size:14px;color:var(--ink-soft);line-height:1.4}

/* the practitioner note, reachable from the intro and from the end screen */
.howlink{display:block;width:100%;background:none;border:none;padding:12px 0 0;
  text-decoration:underline;font-size:15px;line-height:1.4;color:var(--ink-soft);text-align:center}
.linkrow{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 0 0}
.linkrow .howlink{width:auto;display:inline-block;padding:0}
.howwrap{text-align:left}
.howwrap h2{margin:0 0 14px}
.howwrap p{font-size:16px;line-height:1.45}
.howdiag{display:block;width:100%;max-width:420px;height:auto;margin:0 auto 18px}
.howlead{font-weight:700;color:var(--ink);margin:18px 0 10px}
.howgrp{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--mason);
  border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.howgrp.judge{border-left-color:var(--gold-line)}
.howgrp h3{margin:0 0 6px;font-size:17px}
.howgrp p{margin:0;font-size:15px;line-height:1.45}
.howscope{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:16px 0 0}
.howscope h3{margin:0 0 6px;font-size:17px}
.howscope p{margin:0;font-size:15px;line-height:1.45}
.howuse{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--mason-gold);
  border-radius:14px;padding:14px 16px;margin:16px 0 0;box-shadow:var(--shadow)}
.howuse h3{margin:0 0 6px;font-size:17px}
.howuse p{margin:0 0 10px;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.howuse textarea{min-height:210px;font-size:14px;line-height:1.5;background:var(--paper)}
.howuse .btn{margin-top:10px;padding:12px;font-size:16px}
a.btn{text-decoration:none;text-align:center}

/* ---------- test mode. Nothing leaves the page while this band is up. ---------- */
#testband{margin:0 calc(var(--gut) * -1);padding:9px var(--gut);background:#3a2a00;color:var(--mason-gold);
  border-bottom:2px solid var(--gold-line);font-size:13px;font-weight:800;letter-spacing:.4px;
  line-height:1.35;text-align:center;overflow-wrap:anywhere}
#testband span{display:block;font-weight:600;letter-spacing:0;color:#f3e2b0}
#masonfoot b{display:block;font-weight:600;margin-top:4px;color:var(--ink-soft);font-size:12px}

/* ---------- the data notice, read before anything is collected ---------- */
.notice{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--mason);
  border-radius:16px;padding:16px 18px;margin:0 0 12px;box-shadow:var(--shadow);text-align:left}
.notice h3{margin:0 0 8px;font-size:17px}
.notice ul{margin:0;padding:0 0 0 18px}
.notice li{font-size:15px;line-height:1.45;margin:0 0 8px}
.notice li:last-child{margin-bottom:0}
.notice p{margin:0;font-size:15px;line-height:1.45}
.noticever{margin:10px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink-soft)}

/* ---------- the ledger-only picks, one optional step before the memo ---------- */
.prepick{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--gold-line);
  border-radius:16px;padding:16px 18px;margin:16px 0 0;box-shadow:var(--shadow)}
.prepick h3{margin:0 0 4px;font-size:17px}
.prepick p{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink-soft)}
.prepick .chips{margin:0 0 12px}
.prepick .chip{font-size:14px;font-weight:600;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.prepick .chip:disabled{opacity:.4;cursor:not-allowed}
.prepick .two{margin-top:0}

/* ---------- the round two results screen, everything at once ---------- */
.res{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;
  margin:0 0 12px;box-shadow:var(--shadow);border-left:4px solid var(--line)}
.res.good{border-left-color:var(--accept)}
.res.bad{border-left-color:var(--reject)}
.resline{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin:0 0 6px}
.resline b{font-size:16px;line-height:1.3}
.rescall{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;border:2px solid}
.rescall.good{background:var(--accept-bg);border-color:var(--accept);color:var(--accept)}
.rescall.bad{background:var(--reject-bg);border-color:var(--reject);color:var(--reject)}
.res em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--machine)}
.res p{margin:6px 0 0;font-size:15px;line-height:1.45}
.res .yours{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--ink-soft);overflow-wrap:anywhere}

/* ---------- the record and the send, side by side at the end ---------- */
.actions{margin:18px 0 0;text-align:left}
.actions h3{margin:0 0 6px}
.actions p{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink-soft)}
.sendstate{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.recordbox{width:100%;min-height:190px;font:inherit;font-size:12px;line-height:1.45;padding:12px;
  border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);
  margin:10px 0 0;white-space:pre;overflow:auto}
:focus-visible{outline:3px solid var(--mason-gold);outline-offset:2px}
</style>

entary is owed on this line.","file":["Inbound freight, account 5100, rose 34.5 percent in the same month.","A line owes commentary only when it clears both $25,000 and 10 percent."],"key":"flag","type":"arithmetic","why":"The fall is $65,000 and 34.9 percent, so both legs clear and this line owes an explanation the memo never gives. The rise in inbound freight is context, not proof of what happened to the billing, so the ask here is a billing bridge for account 4200 rather than a cause you supply yourself.","tell":"The subtraction is right there on the ledger. $186,000 less $121,000 is $65,000, not $6,500.","post":{"flag":"Reject","stand":"Accept"}},{"n":2,"icon":"wrench","acct":"6200","name":"Repairs and maintenance, depots","prior":41000,"current":118600,"memo":"Depot repairs and maintenance of $118,600 reflects the roof and dock leveler program, which finished on June 30. The remaining work on that same roof and dock leveler program is scheduled to finish in August, and that spend is not yet in these numbers.","file":["Halyard closes on the fifth business day of the following month."],"key":"flag","type":"timing","why":"One program cannot be finished on June 30 and still have work running into August, so the memo contradicts itself and a reviewer cannot tell which version is true. Completion on its own does not settle the accounting either: the question is what June work was performed, how much of it is recorded, and whether any performed June work is still unrecorded. If roof and dock leveler work does continue, ask as well whether it is a routine repair or an improvement that belongs in fixed assets.","tell":"Two sentences in the same memo describe one program as finished and as unfinished, and neither one tells you what June work was actually performed.","post":{"flag":"Accept","stand":"Reject"}},{"n":3,"icon":"truck","acct":"5100","name":"Inbound freight","prior":214000,"current":287800,"memo":"Inbound freight declined to $287,800 as carrier fuel surcharges /* Eight of the fourteen Halyard lines carry a problem and six are clean. Neither number
   is printed anywhere, because a player who knew the split could work the odds instead
   of the ledger. The five Brightwater lines are three problems and two clean. */
function bindCases(){
  ROWS = CASE1.ledger;
  ROWS2 = CASE2.ledger;
  THRESHOLD = CASE1.threshold;
  POLICY_SCOPE = CASE1.policyScope;
  EVIDENCE_NOTE = CASE1.evidenceNote;
  CARDS = CASE1.cards;
  CARDS2 = CASE2.cards;
  GROUPS = CASE1.groups;
  GROUPS2 = CASE2.groups;
  BOOK1 = {rows:ROWS, groups:GROUPS, name:CASE1.company, sub:CASE1.period, cap:CASE1.caption};
  BOOK2 = {rows:ROWS2, groups:GROUPS2, name:CASE2.company, sub:CASE2.period, cap:CASE2.caption};
  ASSESS = CASE2.mode === "assessment";
}

/* the fetch, with the generated copy behind it. Nothing renders until one of the two wins. */
function loadCases(then){
  function fallback(){ CASE_SOURCE = "inline fallback"; bindCases(); then(); }
  if(typeof fetch !== "function"){ return fallback(); }
  var want = ["cases/halyard-v3.json", "cases/brightwater-v3.json"];
  Promise.all(want.map(function(u){
    return fetch(u, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error(u+" "+r.status);
      return r.json();
    });
  })).then(function(pair){
    if(!pair[0] || !pair[0].cards || pair[0].cards.length!==14) throw new Error("halyard case is not fourteen lines");
    if(!pair[1] || !pair[1].cards || pair[1].cards.length!==5) throw new Error("brightwater case is not five lines");
    CASE1 = pair[0]; CASE2 = pair[1];
    CASE_SOURCE = "cases/ files";
    bindCases(); then();
  }).catch(fallback);
}

/* ---------- the run survives a refresh ----------
   Everything above lives in sessionStorage under one key, written after every state change,
   so a reload drops the player back on the screen they were on with their calls intact.
   It is per tab and it goes when the tab goes, which is the right lifetime for a drill. */
var SKEY = "btm.run.v1";
var restoring = false;
function saveRun(){
  if(restoring) return;
  try{ window.sessionStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){}
}
function clearRun(){ try{ window.sessionStorage.removeItem(SKEY); }catch(e){} }
function restoreRun(){
  var raw = null;
  try{ raw = window.sessionStorage.getItem(SKEY); }catch(e){ return false; }
  if(!raw) return false;
  var was;
  try{ was = JSON.parse(raw); }catch(e){ return false; }
  if(!was || typeof was !== "object" || !was.attemptId) return false;
  if(!Array.isArray(was.calls) || was.calls.length !== 14) return false;
  if(!Array.isArray(was.r2calls) || was.r2calls.length !== 5) return false;
  restoring = true;
  Object.keys(was).forEach(function(k){ S[k] = was[k]; });
  restoring = false;
  /* a send that was in flight when the tab reloaded is not a send that landed */
  if(S.sendState === "sending") S.sendState = "not sent";
  S.testAttempt = S.testAttempt || TEST_MODE;
  return true;
}

  var px = (tr.left - br.left) + (x/300)*tr.width;
  var half = tag.getBoundingClientRect().width/2;
  px = Math.max(half+6, Math.min(br.width-half-6, px));
  tag.style.left = px.toFixed(1)+"px";
}

/* a right call is a short burst, a wrong one drops into the pit and rejoins */
function carFx(right){
  var fx = document.getElementById("carfx"), bu = document.getElementById("burst");
  if(!fx) return;
  fx.classList.remove("burst","pit");
  if(bu) bu.classList.remove("on");
  fx.getBoundingClientRect();
  fx.classList.add(right ? "burst" : "pit");
  if(right && bu) bu.classList.add("on");
  setTimeout(function(){
    fx.classList.remove("burst","pit");
    if(bu) bu.classList.remove("on");
  }, 240);
}
function lapMs(){
  if(!S.lapStart) return 0;
  return (S.lapEnd || Date.now()) - S.lapStart;
}
function lapText(){
  var t = Math.round(lapMs()/1000), m = Math.floor(t/60), sec = t%60;
  return m + ":" + (sec<10 ? "0" : "") + sec;
}
function lapMinutes(){ return String(Math.max(1, Math.round(lapMs()/60000))); }

function progress(){
  var trk = document.getElementById("track");
  var quiet = barQuiet();
  if(trk) trk.hidden = quiet;
  if(!quiet) paintTrack();
  var lab = document.getElementById("step");
  var sc = document.getElementById("score");
  if(S.step>=3 && S.step<=16){
    var seen = doneIn(S.calls);
    lab.textContent = "Line "+(S.step-2)+" of 14";
    if(seen){ sc.classList.remove("hidden"); sc.textContent = "Right "+(S.caught+S.cleared)+" of "+seen; }
    else sc.classList.add("hidden");
  } else if(S.step>=18 && S.step<=22){
    /* assessment: progress and nothing else. No running score, because a pill that moved
       after every call would tell the player whether the last one landed. */
    var seen2 = doneIn(S.r2calls);
    lab.textContent = ASSESS ? ((S.step-17)+" of 5") : ("Fresh line "+(S.step-17)+" of 5");
    if(!ASSESS && seen2){ sc.classList.remove("hidden"); sc.textContent = "Right "+(S.r2caught+S.r2cleared)+" of "+seen2; }
    else sc.classList.add("hidden");
  } else if(S.step===0){ lab.textContent=""; sc.classList.add("hidden"); }
  else { lab.textContent = "Second Pass"; sc.classList.add("hidden"); }
}

/* every ledger function takes the book it is reading, so the five account dental
   statement of round two runs through the same component as the fourteen account one */
function bookOf(n){ return n===2 ? BOOK2 : BOOK1; }
function rowFor(acct, bk){
  var rows = (bk || BOOK1).rows;
  for(var i=0;i<rows.length;i++){ if(rows[i][0]===acct) return rows[i]; }
  return null;
}
function moveCell(d){ return d<0 ? "("+money(d)+")" : (d>0 ? "+"+money(d) : "$0"); }

/* the account under review, printed on the card as its statement line */
function strip(acct, bk){
  var r = rowFor(acct, bk); if(!r) return "";
  return '<div class="strip"><div class="striptop"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>'+
    '<div class="stripnums"><span>May<i>'+money(r[2])+'</i></span>'+
    '<span>June<i>'+money(r[3])+'</i></span>'+
    '<span>Change'+changeCell(r[2], r[3])+'</span></div></div>';

/* ---------- the statement, one component for the orientation screen and the sheet ---------- */

function sumOf(accts, col, bk){
  var t = 0;
  accts.forEach(function(a){ var r = rowFor(a, bk); if(r) t += r[col]; });
  return t;
}
function changeCell(prior, current){
  var d = current - prior;
  var pc = prior ? (d/prior*100).toFixed(1)+"%" : "0.0%";
  return '<span class="ch '+(d<0?"neg":"pos")+'">'+moveCell(d)+'<i>'+pc+'</i></span>';
}
/* One row per account. On a phone it stacks, on a desk it reads as one line, and the
   movement bar takes a column of its own there and a line under the figures here. */
function figCells(prior, current, barPct){
  var d = current - prior;
  var pc = (prior ? (d/prior*100) : 0);
  var neg = d<0 ? " neg" : "";
  var bar = (barPct===null) ? "" :
    '<span class="wbar"><i class="'+(neg?"neg":"")+'" style="width:'+barPct+'%"></i></span>';
  return '<span class="fg">'+money(prior)+'</span>'+
         '<span class="fg">'+money(current)+'</span>'+
         '<span class="fg ch'+neg+'">'+moveCell(d)+'</span>'+
         '<span class="fg pc'+neg+'"><b>'+pc.toFixed(1)+'%</b></span>'+bar;
}
function movementBar(prior, current, barPct){
  var neg = current<prior ? " neg" : "";
  return '<span class="mbar"><i class="'+neg.trim()+'" style="width:'+barPct+'%"></i></span>';
}
function acctRow(r, acct, maxPct, z){
  var pct = r[2] ? Math.abs((r[3]-r[2])/r[2]*100) : 0;
  var w = Math.max(10, Math.round(pct/maxPct*100));
  var here = (r[0]===acct);
  return '<div class="srow'+(z%2?" z":"")+(here?" here":"")+'"'+(here?' id="hererow"':'')+'>'+
      '<span class="acctline"><span class="no">'+r[0]+'</span>'+
        '<span class="nm">'+esc(r[1])+'</span></span>'+
      figCells(r[2], r[3], w)+
      movementBar(r[2], r[3], w)+
    '</div>';
}
function totalRow(label, pr, cu, cls){
  return '<div class="srow '+cls+'">'+
      '<span class="acctline"><span class="no"></span><span class="nm">'+label+'</span></span>'+
      figCells(pr, cu, null)+
    '</div>';
}
function statement(acct, wide, bk){
  bk = bk || BOOK1;
  var maxPct = 0;
  bk.rows.forEach(function(r){ if(r[2]) maxPct = Math.max(maxPct, Math.abs((r[3]-r[2])/r[2]*100)); });
  var body = "", z = 0;
  bk.groups.forEach(function(g){
    body += '<div class="sgrp">'+g.title+'</div>';
    g.accts.forEach(function(a){
      var r = rowFor(a, bk); if(!r) return;
      z++;
      body += acctRow(r, acct, maxPct, z);
    });
    body += totalRow(g.total, sumOf(g.accts,2,bk), sumOf(g.accts,3,bk), "sub");
  });
  var netP = sumOf(bk.groups[0].accts,2,bk), netC = sumOf(bk.groups[0].accts,3,bk);
  bk.groups.slice(1).forEach(function(g){ netP -= sumOf(g.accts,2,bk); netC -= sumOf(g.accts,3,bk); });
  body += totalRow("Net of the accounts shown", netP, netC, "net");
  return '<div class="stmt'+(wide?" stmt-wide":"")+'">'+
    '<div class="stmthead"><b>'+esc(bk.name)+'</b>'+
      '<span>'+esc(bk.sub)+'</span></div>'+
    '<div class="scols"><span class="sp"></span><span class="sp"></span>'+
      '<span>May</span><span>June</span><span>Change</span><span>Percent</span>'+
      '<span class="sp"></span></div>'+
    body+
    '<p class="cap">'+esc(bk.cap)+'</p></div>';
}

  var box = document.getElementById("prepicks");
  if(!box) return;
  var picked = S.prepicks.slice();
  var btns = Array.prototype.slice.call(box.querySelectorAll(".chip"));
  function paint(){
    btns.forEach(function(b){
      var code = ROWS[Number(b.getAttribute("data-p"))][0];
      var on = picked.indexOf(code) > -1;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.disabled = !on && picked.length >= PREPICK_MAX;
    });
  }
  btns.forEach(function(b){
    function toggle(){
      var code = ROWS[Number(b.getAttribute("data-p"))][0];
      var at = picked.indexOf(code);
      if(at > -1) picked.splice(at,1);
      else if(picked.length < PREPICK_MAX) picked.push(code);
      else return;
      paint();
    }
    b.addEventListener("click", toggle);
    b.addEventListener("keydown", function(e){
      if(e.key === " " || e.key === "Spacebar" || e.code === "Space" || e.key === "Enter"){ e.preventDefault(); toggle(); }
    });
  });
  paint();
  function leave(skipped){
    S.prepicks = skipped ? [] : picked.slice();
    S.prepickSkipped = skipped || picked.length === 0;
    saveRun();

/* ---------- the basis row ----------
   One tap row between the call and the reveal, so the response sheet carries the reason
   the player actually held rather than a label the answer key supplied afterwards. At
   least one chip. The line of their own words is offered on a flag and never required. */
var BASIS_FLAG = ["figure does not tie", "direction wrong", "no source on file",
                  "wrong period", "wrong account", "nothing written where owed"];
var BASIS_HOLD = "the figure and reason hold";
function basisChips(val){
  return (val==="stand") ? [BASIS_HOLD].concat(BASIS_FLAG) : BASIS_FLAG.slice();
}

function basisStep(i, val, round){
  var c = (round===2) ? CARDS2[i] : CARDS[i];
  var opts = basisChips(val);
  var picked = [];
  var wordsBox = (val==="flag")
    ? '<label class="basiswords" for="basiswords">In your words (optional)</label>'+
      '<input type="text" id="basiswords" class="basisinput" maxlength="140" '+
      'placeholder="One line, if you want to add one">'
    : "";
  screen.innerHTML =
    '<div class="card">'+
      cardBody(c, round, i)+
      '<div class="basis">'+
        '<p class="ask">You said '+(val==="flag" ? "flag it" : "let it stand")+'. What is your basis?</p>'+
        '<p class="tiny basishint">Tap at least one. More than one is fine.</p>'+
        '<div class="chips" role="group" aria-label="Your basis">'+
          opts.map(function(o,k){
            return '<button type="button" class="chip" data-k="'+k+'" aria-pressed="false">'+esc(o)+'</button>';
          }).join("")+
        '</div>'+
        wordsBox+
        '<button class="btn" id="basisgo" disabled>Continue</button>'+
      '</div>'+
    '</div>';
  wireLedger();
  var go2 = document.getElementById("basisgo");
  Array.prototype.forEach.call(screen.querySelectorAll(".chip"), function(b){
    function toggle(){
      var k = Number(b.getAttribute("data-k"));
      var at = picked.indexOf(k);
      if(at === -1){ picked.push(k); b.classList.add("on"); b.setAttribute("aria-pressed","true"); }
      else { picked.splice(at,1); b.classList.remove("on"); b.setAttribute("aria-pressed","false"); }
      go2.disabled = picked.length === 0;
    }
    b.addEventListener("click", toggle);
    /* the space bar and the return key, spelled out rather than left to the default,
       so the row works the same on a keyboard as it does under a thumb */
    b.addEventListener("keydown", function(e){
      if(e.key === " " || e.key === "Spacebar" || e.code === "Space" || e.key === "Enter"){ e.preventDefault(); toggle(); }
    });
  });
  go2.addEventListener("click", function(){
    if(!picked.length) return;
    picked.sort(function(a,b2){ return a-b2; });
    var chosen = picked.map(function(k){ return opts[k]; });
    var wordsEl = document.getElementById("basiswords");
    var words = wordsEl ? wordsEl.value.replace(/[\r\n|]+/g," ").trim() : "";
    var spent = S.itemStart ? Math.max(0, Math.round((Date.now()-S.itemStart)/1000)) : 0;
    if(round===2){ S.r2basis[i] = chosen; S.r2words[i] = words; S.r2secs[i] = spent; answer2(i,val); }
    else { S.basis[i] = chosen; S.words[i] = words; S.secs[i] = spent; answer(i,val); }
  });
  window.scrollTo(0,0);
}


function answer(i, val){
  var c = CARDS[i];
  S.calls[i] = val;
  if(i === 13) S.lapEnd = Date.now();
  var right = (val === c.key);
  if(right){
    if(c.key==="flag") S.caught++; else S.cleared++;
    S.streak++;
    if(S.streak > S.best) S.best = S.streak;
  } else {
    if(val === "flag") S.falseFlags++;
    S.streak = 0;
  }
  carFx(right);
  reveal(i, right);
}

/* ---------- generated summaries. Nothing here is typed by the player. ---------- */
/* the round one free text question, entry.1115022539, now carries the ledger-only picks.
   A skip posts as a skip rather than as an empty cell, so the two can be told apart. */
function prepickLine(){
  if(!S.prepicks || !S.prepicks.length) return "Prepicks: skipped.";
  return "Prepicks: " + S.prepicks.join("; ") + ".";
}
/* the player's own basis, in the shape the response sheet reads:
   Basis: no source on file; wrong period | Words: the freight moved */
function basisText(chips, words){
  var out = "Basis: " + ((chips && chips.length) ? chips.join("; ") : "none recorded");
  if(words) out += " | Words: " + words;
  return out;
}

function flaggedAccounts(){
  var out = [];
  CARDS.forEach(function(c){ if(c.key==="flag" && out.indexOf(c.acct)===-1) out.push(c.acct); });
  return out;
}
function acctName(code){
  for(var i=0;i<ROWS.length;i++){ if(ROWS[i][0]===code) return code+" "+ROWS[i][1]; }
  return code;
}
function missedCards(){
  var out = [];
  CARDS.forEach(function(c,idx){ if(S.calls[idx] !== c.key) out.push(c); });
  return out;
}
function missedCards2(){
  var out = [];
  CARDS2.forEach(function(c,idx){ if(S.r2calls[idx] !== c.key) out.push(c); });
  return out;
}
/* ---------- the fresh case, scored on its own ----------
   The whole of round two rides in one string on question C, which asks the player
   nothing and carried only a placeholder before 13 September 2026. F is a flag and S
   is let it stand, in card order, so the sheet can be read without opening the game. */
function r2Right(){ return S.r2caught + S.r2cleared; }
function letters(list){
  return list.map(function(v){ return (v==="flag") ? "F" : "S"; }).join("");
}
function r2Seconds(){
  if(!S.r2Start) return 0;
  return Math.round(((S.r2End || Date.now()) - S.r2Start)/1000);
}
function r2Line(){
  var bas = [];
  for(var i=0;i<5;i++){
    bas.push((i+1)+": "+basisText(S.r2basis[i], S.r2words[i]));
  }
  return "Round2: "+r2Right()+"/5; calls "+letters(S.r2calls.map(function(v){ return v || "stand"; }))+
         "; key "+letters(CARDS2.map(function(c){ return c.key; }))+
         "; seconds "+r2Seconds()+". Round2 basis, by line: "+bas.join(" || ")+".";
}
/* The organization taps ride at the front of question A, behind a fixed prefix, so the
   responses sheet can be counted by chapter without a new form question. */
function orgLine(){ return "Organizations: " + S.orgs.join("; ") + "."; }
function caseLine(){
  return "Cases: " + CASE1.version + " (practice, 14 lines) and " + CASE2.version +
         " (" + (ASSESS ? "assessment" : "practice") + ", 5 lines), dated " + CASE1.date +
         ", loaded from " + CASE_SOURCE + ".";
}
function versionLine(){
  return "Product: " + PRODUCT_STAMP + ". Notice: " + NOTICE_VERSION +
         ". Mode: round one practice, round two " + (ASSESS ? "assessment" : "practice") +
         (S.testAttempt ? ". TEST ATTEMPT, exclude from reports." : ".");
}
function summaryA(){
  return orgLine() + " " + versionLine() + " " + caseLine();
}

function summaryB(){
  var miss = missedCards();
  var parts = [];
  /* the attempt identifier. Every retry of the same run posts this same string, so a row
     that appears twice is one attempt sent twice and must be counted once. */
  parts.push("Attempt id: " + S.attemptId + ", run " + S.runIndex + " in this tab.");
  parts.push(miss.length
    ? "Lines missed: " + miss.map(function(c){ return c.n+" "+c.acct+" ("+c.type+")"; }).join("; ") + "."
    : "No lines missed.");
  parts.push("Pattern: " + patternLine());
  parts.push("Result: " + (S.caught+S.cleared) + " of 14 calls correct, " + S.caught + " caught, " +
             S.cleared + " let stand correctly, " + S.falseFlags + " false flag" + (S.falseFlags===1?"":"s") +
             ", rank " + rank() + ".");
  parts.push("Four questions on the form (expected quality, confidence before, confidence after, close experience) are not asked in this version. They carry a placeholder value the question accepts and are not participant answers.");
  parts.push("Longest run of correct calls: " + S.best + ".");
  return parts.join(" ");
}

function typeNoun(type, n){
  if(type==="clean line") return n===1 ? "clean line" : "clean lines";
  return type + (n===1 ? " problem" : " problems");
}
function patternLine(){
  var tally = {};
  CARDS.forEach(function(c,idx){
    if(!tally[c.type]) tally[c.type] = {tot:0, miss:0};
    tally[c.type].tot++;
    if(S.calls[idx] !== c.key) tally[c.type].miss++;
  });
  var clean = [], bad = [];
  Object.keys(tally).forEach(function(t){
    var v = tally[t];
    if(v.miss===0 && v.tot>=2) clean.push({t:t, tot:v.tot});
    if(v.miss>0) bad.push({t:t, tot:v.tot, miss:v.miss});
  });
  if(!bad.length) return "you agreed with the answer key on all fourteen lines.";
  bad.sort(function(a,b){ return b.miss - a.miss; });
  var worst = bad[0];
  var badBit;
  if(worst.miss === worst.tot && worst.tot > 1) badBit = (worst.tot===2 ? "both " : "all "+worst.tot+" ") + typeNoun(worst.t, worst.tot) + " got past you";
  else if(worst.miss === worst.tot) badBit = "the " + typeNoun(worst.t,1) + " got past you";
  else badBit = "you missed " + worst.miss + " of the " + worst.tot + " " + typeNoun(worst.t, worst.tot);
  if(clean.length){
    clean.sort(function(a,b){ return b.tot - a.tot; });
    return "you caught every " + typeNoun(clean[0].t, 1) + ", and " + badBit + ".";
  }
  if(bad.length > 1){
    var second = bad[1];
    return badBit + ", and the " + typeNoun(second.t,1) + " went the same way.";
  }
  return badBit + ".";
}

/* Flagging all fourteen now scores eight, which lands at Trainee. */
function rank(){
  var right = S.caught + S.cleared;
  if(right>=14) return "Partner";
  if(right>=13) return "Manager";
  if(right>=11) return "Senior";
  if(right>=9) return "Staff";
  return "Trainee";
}
function tier(){
  var right = S.caught + S.cleared;
  if(right>=14) return "sweep";
  if(right>=13) return "gold";
  if(right>=11) return "silver";
  return "bronze";
}
function allStandsRight(){
  return CARDS.every(function(c,idx){ return c.key!=="stand" || S.calls[idx]==="stand"; });
}

/* ---------- payload and submit ---------- */
/* PLACEHOLDER_MODE decides what the four unasked questions carry. "numeric" posts a value the
   question actually accepts, which is what Google Forms requires while all four are marked
   required. Once Khaled makes those four questions optional in the form editor, change this one
   word to "empty" and the four fields post nothing at all. Nothing else has to change.
   See README, "The four questions that are not asked". */
var PLACEHOLDER_MODE = "numeric";
var PLACEHOLDERS = PLACEHOLDER_MODE === "empty"
  ? { expect:"", confPre:"", experience:"", confPost:"" }
  : { expect:"3", confPre:"5", experience:"Once or twice", confPost:"5" };

function payload(){
  var p = {};
  p["entry."+E.codename] = S.codename;
  /* the ledger-only picks, taken before a memo sentence was read */
  p["entry."+E.round1] = prepickLine();
  /* Four questions on the form are not asked in this version: expected quality, confidence
     before, close experience and, below, final confidence. All four are marked required and
     three of them are linear scales, so the posted value has to be one the question accepts.
     These are placeholders, not answers, and the findings script must exclude them.
     PLACEHOLDER_MODE is the one switch. */
  p["entry."+E.expect] = PLACEHOLDERS.expect;
  p["entry."+E.confPre] = PLACEHOLDERS.confPre;
  p["entry."+E.experience] = PLACEHOLDERS.experience;
  for(var i=0;i<14;i++){
    var c = CARDS[i];
    var call = S.calls[i] || "stand";
    p["entry."+E.call[i]] = c.post[call];
    p["entry."+E.why[i]] = basisText(S.basis[i], S.words[i]) +
                           " || Line "+c.n+", account "+c.acct+". Called: "+call+". Key: "+c.key+
                           ". Type: "+c.type+". "+(S.calls[i]===c.key ? "Correct." : "Missed.");
  }
  p["entry."+E.confPost] = PLACEHOLDERS.confPost;
  p["entry."+E.qa] = summaryA();
  p["entry."+E.qb] = summaryB();
  /* question C asks the player nothing, so the fresh case rides here rather than
     costing the form a new question. The fourteen Why fields are left alone. */
  p["entry."+E.qc] = r2Line() + " Fresh case: " + CASE2.company + ", case version " +
                     CASE2.version + ", five lines, " +
                     (ASSESS ? "run as an assessment with no feedback between lines. " : "run as practice. ") +
                     "A company the player had not seen. Not a player answer to question C.";
  p["entry."+E.qd] = lapMinutes();
  var fbzx = String(Math.floor(Math.random()*9007199254740991));
  p["fvv"] = "1";
  p["pageHistory"] = "0,1,2";
  p["fbzx"] = fbzx;
  p["partialResponse"] = '[null,null,"'+fbzx+'"]';
  p["submissionTimestamp"] = "-1";
  return p;
}

function asText(){
  var out = ["Second Pass: Beat the Machine at Mason", "Codename: "+S.codename, orgLine(),
             versionLine(), caseLine(), "Attempt id: "+S.attemptId, ""];
  out.push("Round one: "+prepickLine());
  out.push("Four questions on the form were not asked in this version and carry a placeholder value, not an answer.");
  out.push("");
  for(var i=0;i<14;i++){
    out.push("Line "+(i+1)+" ("+CARDS[i].acct+"): "+S.calls[i]+", key "+CARDS[i].key+", "+
             CARDS[i].type+". "+basisText(S.basis[i], S.words[i]));
  }
  out.push("");
  for(var j=0;j<5;j++){
    out.push("Fresh line "+(j+1)+" ("+CARDS2[j].acct+"): "+S.r2calls[j]+", key "+CARDS2[j].key+", "+
             CARDS2[j].type+". "+basisText(S.r2basis[j], S.r2words[j]));
  }
  out.push("");
  out.push(summaryA());
  out.push(summaryB());
  out.push(r2Line());
  out.push("Lap time: "+lapText()+", posted as "+lapMinutes()+" minute(s)");
  return out.join("\n");
}

/* ---------- the attempt record ----------
   The fields the build handoff calls the minimum attempt record, in the names this codebase
   already uses. Everything shown to the player is in it, nothing is invented, and the four
   form questions nobody was asked are reported as not asked rather than as answers. */
function itemRecord(c, idx, round){
  var call = (round===2) ? S.r2calls[idx] : S.calls[idx];
  var chips = (round===2) ? S.r2basis[idx] : S.basis[idx];
  var words = (round===2) ? S.r2words[idx] : S.words[idx];
  var secs  = (round===2) ? S.r2secs[idx] : S.secs[idx];
  return {
    item: (round===2 ? "r2-" : "r1-") + c.n,
    round: round,
    caseVersion: (round===2 ? CASE2.version : CASE1.version),
    mode: (round===2 && ASSESS) ? "assessment" : "practice",
    account: c.acct,
    accountName: c.name,
    errorType: c.type,
    /* one call per line in this build, so the original decision and the final decision are
       the same value. They are kept apart because a later build lets a challenge change one. */
    originalDecision: call,
    finalDecision: call,
    actualReasonChips: chips || [],
    actualReasonWords: words || "",
    evidenceReferences: (c.file || []).slice(),
    confidence: null,
    confidenceNote: "not asked in this version",
    assistanceRevealed: false,
    elapsedActiveSeconds: secs || 0,
    skippedOrMissing: (call === null) ? "no call recorded" : null,
    feedbackRevealedAt: (round===2 && ASSESS)
      ? (S.r2Revealed ? new Date(S.r2Revealed).toISOString() : null)
      : "immediately after the call",
    keyDecision: c.key,
    decisionResult: (call === c.key) ? "agrees with key" : "does not agree"
  };
}
function attemptRecord(sentPayload){
  var responses = [];
  CARDS.forEach(function(c,i){ responses.push(itemRecord(c,i,1)); });
  CARDS2.forEach(function(c,i){ responses.push(itemRecord(c,i,2)); });
  var active = 0;
  responses.forEach(function(r){ active += r.elapsedActiveSeconds; });
  return {
    record: "Second Pass attempt record",
    recordFormat: "btm-attempt-1",
    attempt: {
      id: S.attemptId,
      pseudonym: S.codename,
      pseudonymNote: "A codename is a pseudonym and not anonymity.",
      organizations: S.orgs.slice(),
      role: null,
      roleNote: "not collected in this version",
      noticeVersion: NOTICE_VERSION,
      productVersion: PRODUCT_STAMP,
      caseVersions: {roundOne: CASE1.version, roundTwo: CASE2.version, caseSource: CASE_SOURCE},
      form: FORM_POST,
      modes: {roundOne: "practice", roundTwo: ASSESS ? "assessment" : "practice"},
      firstAttempt: S.runIndex === 1,
      runIndex: S.runIndex,
      assistanceSource: "none. No model challenge runs in this build.",
      started: S.started ? new Date(S.started).toISOString() : null,
      completed: S.completedAt ? new Date(S.completedAt).toISOString() : null,
      submissionState: S.sendState,
      submissionAttempts: S.sendAttempts,
      testAttempt: !!S.testAttempt,
      testAttemptNote: S.testAttempt
        ? "Test mode was on. Nothing was posted and this attempt is excluded from reports."
        : "Test mode was off."
    },
    prepicks: {
      picks: (S.prepicks || []).slice(),
      skipped: !!S.prepickSkipped,
      postedTo: "entry." + E.round1,
      question: "Before the memo: tap up to three lines you would ask about first, or skip."
    },
    responses: responses,
    scoring: {
      keyVersions: {roundOne: CASE1.version, roundTwo: CASE2.version},
      roundOne: {right: S.caught + S.cleared, of: 14, caught: S.caught,
                 letStandCorrectly: S.cleared, falseFlags: S.falseFlags,
                 longestRun: S.best, rank: rank()},
      roundTwo: {right: r2Right(), of: 5, caught: S.r2caught,
                 letStandCorrectly: S.r2cleared, falseFlags: S.r2false},
      humanRubricScores: null,
      scorerId: null,
      outOfKeyFinding: null,
      adjudication: null,
      exclusionReason: S.testAttempt ? "test attempt" : null,
      finalResolution: null,
      rubricNote: "The three-dimension reasoning rubric is scored by a person outside this page."
    },
    timing: {
      roundOneLapSeconds: Math.round(lapMs()/1000),
      roundOneLapMinutesPosted: lapMinutes(),
      roundTwoSeconds: r2Seconds(),
      elapsedActiveSeconds: active
    },
    notAsked: {
      questions: ["expected quality", "confidence before", "confidence after", "close experience"],
      note: "Not asked on screen. The form marks all four required, so a placeholder the " +
            "question accepts is posted. Drop these four columns rather than averaging them.",
      placeholderMode: PLACEHOLDER_MODE
    },
    payload: sentPayload || payload(),
    payloadNote: S.testAttempt
      ? "Test mode. This is the payload the page would have sent, and it was not sent."
      : (S.sendState === "sent, not confirmed"
        ? "This payload was posted to the form. The receiver does not confirm receipt to this page."
        : "This payload has not been posted.")
  };
}
function recordText(){ return JSON.stringify(attemptRecord(window.__BTM_LAST_POST), null, 2); }

/* ---------- the send ----------
   Voluntary, and off entirely in test mode. A retry reuses the same attempt id, so two rows
   under one id are one attempt sent twice and get counted once. The hidden frame's load event
   proves the request left the page and nothing more, which is what the state says. */
var sending = false;
function sendResults(onState){
  if(sending) return;
  var p = payload();
  window.__BTM_LAST_POST = p;
  S.sendAttempts++;
  if(S.testAttempt){
    S.sendState = "not sent, test mode";
    saveRun();
    return onState();
  }
  sending = true;
  S.sendState = "sending";
  saveRun();
  onState();
  var f = document.createElement("form");
  f.action = FORM_POST; f.method = "POST"; f.target = "gfsink"; f.style.display = "none";
  Object.keys(p).forEach(function(k){
    var inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = p[k];
    f.appendChild(inp);
  });
  document.body.appendChild(f);
  var settled = false;
  var sink = document.getElementById("gfsink");
  function finish(state){
    if(settled) return;
    settled = true; sending = false;
    S.sendState = state; saveRun(); onState();
  }
  var timer = setTimeout(function(){ finish("send did not go through"); }, 12000);
  sink.addEventListener("load", function(){
    clearTimeout(timer);
    finish("sent, not confirmed");
  });
  try{ f.submit(); }
  catch(err){ clearTimeout(timer); finish("send did not go through"); }
}

/* ---------- the trophy, drawn to the tier ---------- */
/* green and gold, with the cup carrying the tier */
var TROPHY = {
  bronze:{body:"#a7c6b6", dark:"#005239", name:"green"},
  silver:{body:"#4f9377", dark:"#005239", name:"deep green"},
  gold:{body:"#ffc733", dark:"#005239", name:"gold"},
  sweep:{body:"#ffc733", dark:"#005239", name:"gold, clean sweep"}
};
function trophySvg(t){
  var c = TROPHY[t];
  var star = t==="sweep"
    ? '<path d="M50 4l3.6 7.6 8.4 1.2-6 5.9 1.4 8.3L50 23.1l-7.4 3.9 1.4-8.3-6-5.9 8.4-1.2z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="1.4" stroke-linejoin="round"/>'
    : "";
  return '<svg class="trophy '+t+'" viewBox="0 0 100 104" role="img" aria-label="'+c.name+' trophy">'+
    '<defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".75"/>'+
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
      '<clipPath id="cupclip"><path d="M30 30h40v18a20 20 0 0 1-40 0z"/></clipPath></defs>'+
    star+
    '<path d="M30 30h40v18a20 20 0 0 1-40 0z" fill="'+c.body+'" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<g clip-path="url(#cupclip)"><rect class="glint" x="-40" y="28" width="26" height="44" fill="url(#shine)"/></g>'+
    '<path d="M30 34H20a10 10 0 0 0 10 12M70 34h10a10 10 0 0 1-10 12" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M50 68v12M36 92h28l-3-12H39z" fill="none" stroke="'+c.dark+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="M32 98h36" stroke="'+c.dark+'" stroke-width="3.4" stroke-linecap="round"/>'+
  '</svg>';
}

/* ---------- the badges, earned off the key. Only what was earned shows, best three first ---------- */
function got(n){ var c = CARDS[n-1]; return S.calls[n-1] === c.key; }
function badges(){
  var right = S.caught + S.cleared;
  return [
    {t:"Clean sweep",        on: right===14, i:"coins"},
    /* the only badge the fresh case can earn, and it sits second because reading a
       company cold is the hardest thing on the card */
    {t:"Cold read",          on: r2Right()===5, i:"ledger"},
    {t:"Hot lap",            on: S.best>=5, i:"fuel"},
    {t:"Nothing over-flagged", on: allStandsRight(), i:"badge"},
    {t:"Arithmetic hawk",    on: got(1) && got(8), i:"scales"},
    {t:"Unsupported driver caught", on: got(7), i:"glass"},
    {t:"Read the silence",   on: got(11), i:"flag"},
    {t:"Traced the movement", on: got(12) && got(14), i:"brief"},
    {t:"Timing and drift",   on: got(2) && got(3), i:"calendar"}
  ].filter(function(x){ return x.on; }).slice(0,3);
}

function earnedLine(){
  var right = S.caught + S.cleared;
  /* not "matches the ledger": several of these calls turn on the evidence on file rather
     than on arithmetic, so what a call agrees with is the answer key. */
  if(right===14) return "All fourteen of your calls agree with the answer key.";
  if(right===0) return "None of your fourteen calls agree with the answer key.";
  return right + " of your fourteen calls agree with the answer key.";
}


/* ---------- the two actions at the end ----------
   The run is finished either way. One button hands the player their own record, the other
   posts to the form, and neither is required to reach this screen. */
function actionsBlock(){
  return '<div class="actions">'+
    '<h3>Your record</h3>'+
    '<p>Everything this run collected, as a file you keep. It needs nobody\'s permission and it '+
      'does not send anything.</p>'+
    '<button class="btn ghost" id="saverec">Save my record</button>'+
    '<div id="recwrap" hidden><textarea class="recordbox" id="recbox" readonly spellcheck="false"></textarea>'+
      '<button class="btn ghost" id="copyrec">Copy the record</button></div>'+
    '<h3 style="margin-top:18px">Send your results</h3>'+
    '<p>Voluntary. It posts your calls to the Google Form responses sheet described in the '+
      'notice at the start.</p>'+
    '<button class="btn" id="sendres">Send my results</button>'+
    '<p class="sendstate" id="sendstate"></p>'+
  '</div>';
}
function wireActions(){
  var wrap = document.getElementById("recwrap"), box = document.getElementById("recbox");
  document.getElementById("saverec").addEventListener("click", function(){
    var text = recordText();
    box.value = text;
    wrap.hidden = false;
    var name = "second-pass-" + S.attemptId + ".json";
    var saved = false;
    try{
      var blob = new Blob([text], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      saved = true;
    }catch(e){ saved = false; }
    this.textContent = saved ? ("Saved as " + name) : "Your record is below, copy it";
  });
  document.getElementById("copyrec").addEventListener("click", function(){
    copyText(this, box.value, "Copied");
  });
  var state = document.getElementById("sendstate");
  var btn = document.getElementById("sendres");
  function paint(){
    var s = S.sendState;
    if(s === "sending"){ btn.disabled = true; btn.textContent = "Sending"; state.textContent = "Sending."; return; }
    btn.disabled = false;
    if(s === "sent, not confirmed"){
      btn.textContent = "Send again";
      state.textContent = "Sent. The receiver does not confirm receipt to this page. " +
        "A second send reuses attempt id " + S.attemptId + ", so a retry cannot double count.";
    } else if(s === "send did not go through"){
      btn.textContent = "Try sending again";
      state.textContent = "The send did not go through. Nothing is lost: save your record above " +
        "and send it to Khaled, or try again. A retry reuses attempt id " + S.attemptId + ".";
    } else if(s === "not sent, test mode"){
      btn.textContent = "Send my results";
      state.textContent = "Test mode is on, so nothing was sent. The payload the page would have " +
        "posted is in your record above under \"payload\".";
    } else {
      btn.textContent = "Send my results";
      state.textContent = S.testAttempt
        ? "Test mode is on. This button writes the would-be payload into your record and posts nothing."
        : "";
    }
  }
  btn.addEventListener("click", function(){ sendResults(paint); });
  paint();
}

function done(){
  if(!S.completedAt){ S.completedAt = Date.now(); saveRun(); }
  var miss = missedCards();
  var miss2 = missedCards2();
  var freshBlock = miss2.length
    ? '<div class="coach" style="margin-top:14px"><h3>On the memo you had not seen</h3>'+
      miss2.map(function(c){
        return '<div class="miss"><b>Fresh line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+'</div>'
    : '<div class="coach" style="margin-top:14px"><h3>On the memo you had not seen</h3>'+
      '<p class="tiny" style="margin:0">All five fresh calls agree with the answer key, on a company you had not seen, which is the read that matters.</p></div>';
  var coachInner;
  if(!miss.length){
    coachInner = '<div class="coach"><h3>Nothing to fix</h3><p class="tiny" style="margin:0">This read out lists the lines that got past you, and there are none.</p></div>'+freshBlock;
  } else {
    coachInner = '<div class="coach"><h3>Where it got past you</h3>'+
      miss.map(function(c){
        return '<div class="miss"><b>Line '+c.n+', '+esc(c.name)+', account '+c.acct+'</b>'+
               '<em>'+esc(c.type)+'</em>'+
               '<span>'+esc(c.tell)+'</span></div>';
      }).join("")+
      (S.falseFlags > 0
        ? '<p class="tiny" style="margin:14px 0 0">'+(S.falseFlags===1?"One of those was a line":"Those were lines")+
          ' that owed nothing and read correctly, and flagging a line like that costs the controller time on work that was already right.</p>'
        : "")+
      '<p class="tiny" style="margin:14px 0 0">'+esc(patternLine().charAt(0).toUpperCase()+patternLine().slice(1))+'</p></div>'+freshBlock;
  }
  var share = "I agreed with the answer key on " + (S.caught+S.cleared) + " of 14 lines in Second Pass: Beat the Machine at Mason.";
  var b = badges();
  var medals = b.length
    ? '<div class="badges">'+b.map(function(x,i){
        return '<span class="medal" style="animation-delay:'+(i*150)+'ms">'+
          '<span class="disc"><svg viewBox="0 0 24 24">'+I[x.i]+'</svg></span>'+
          '<em>'+x.t+'</em></span>';
      }).join("")+'</div>'
    : '<p class="nobadge">Next run, start with the arithmetic.</p>';
  screen.innerHTML =
    '<div class="final">'+
      '<div class="trophywrap">'+trophySvg(tier())+'</div>'+
      '<div class="rankbig">'+rank()+'</div>'+
      '<p class="ranknote">Trainee through Partner are ranks in this drill. They say nothing about professional seniority.</p>'+
      '<p class="tiny" style="margin:6px 0 0">'+esc(S.codename)+'</p>'+
      '<p class="earned">'+esc(earnedLine())+'</p>'+
      '<p class="fresh"><span class="lap">Fresh case: '+r2Right()+' of 5</span></p>'+
      '<p class="tiny" style="margin:4px 0 14px">A second company, read once, scored on its own.</p>'+
      '<div class="stats">'+
        '<div><b>'+S.caught+'</b><span>caught</span></div>'+
        '<div><b>'+S.cleared+'</b><span>let stand correctly</span></div>'+
        '<div><b>'+S.falseFlags+'</b><span>false flags</span></div>'+
      '</div>'+
      '<p class="lapwrap"><span class="lap">Lap time '+lapText()+'</span>'+
        '<span class="lap">Best streak '+S.best+'</span></p>'+
      medals+
      '<div class="sharecard"><p>'+esc(share)+'</p><button class="btn ghost" id="copyshare">Copy</button></div>'+
      '<button class="btn ghost" id="playagain">Play again</button>'+
      '<button class="btn ghost" id="showmiss">'+((miss.length+miss2.length)
          ? "See the "+(miss.length+miss2.length)+" that got past you"
          : "See the full read out")+'</button>'+
      '<div id="missbox" hidden>'+coachInner+'</div>'+
      actionsBlock()+
      '<button class="howlink" id="howlink">How this works in a real close</button>'+
    '</div>';
  wireActions();
  document.getElementById("howlink").addEventListener("click", openHow);
  document.getElementById("step").textContent = "Done";
  document.getElementById("score").classList.add("hidden");
  /* a second run keeps the codename and the chips and posts its own row to the form */
  document.getElementById("playagain").addEventListener("click", function(){
    S.calls = []; S.basis = []; S.words = []; S.secs = [];
    for(var k=0;k<14;k++){ S.calls.push(null); S.basis.push(null); S.words.push(""); S.secs.push(0); }
    S.r2calls = []; S.r2basis = []; S.r2words = []; S.r2secs = [];
    for(var k2=0;k2<5;k2++){ S.r2calls.push(null); S.r2basis.push(null); S.r2words.push(""); S.r2secs.push(0); }
    S.caught = 0; S.cleared = 0; S.falseFlags = 0; S.streak = 0; S.best = 0;
    S.r2caught = 0; S.r2cleared = 0; S.r2false = 0; S.r2Start = 0; S.r2End = 0; S.r2Revealed = 0;
    S.confPost = null; S.qd = null;
    S.prepicks = []; S.prepickSkipped = false;
    S.started = Date.now(); S.lapStart = 0; S.lapEnd = 0; S.itemStart = 0; S.completedAt = 0;
    /* a second run is a second attempt, so it gets its own id rather than reusing the first
       one, which is what keeps a retry of one run distinct from a fresh run */
    S.attemptId = newAttemptId();
    S.runIndex = (S.runIndex || 1) + 1;
    S.sendState = "not sent"; S.sendAttempts = 0;
    sending = false;
    go(1);
  });
  var mb = document.getElementById("missbox"), sm = document.getElementById("showmiss");
  sm.addEventListener("click", function(){
    mb.hidden = !mb.hidden;
    sm.textContent = mb.hidden
      ? ((miss.length+miss2.length) ? "See the "+(miss.length+miss2.length)+" that got past you" : "See the full read out")
      : "Hide";
  });
  document.getElementById("copyshare").addEventListener("click", function(){
    var self = this;
    function done2(){ self.textContent = "Copied"; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(share).then(done2, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = share; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done2(); }catch(e){ self.textContent = "Select the line above"; }
      ta.remove();
    }
  });
}

/* three taps on the footer line turn test mode on and off, for a facilitator standing at the
   front of a room with no address bar to edit. It is a toggle, and the band says which way. */
function wireTestTap(){
  var foot = document.getElementById("masonfoot");
  if(!foot) return;
  var taps = 0, last = 0;
  foot.addEventListener("click", function(){
    var now = Date.now();
    taps = (now - last < 700) ? taps + 1 : 1;
    last = now;
    if(taps >= 3){
      taps = 0;
      TEST_MODE = !TEST_MODE;
      S.testAttempt = TEST_MODE;
      if(!TEST_MODE && S.sendState === "not sent, test mode") S.sendState = "not sent";
      saveRun();
      paintTestBand();
      render();
    }
  });
}

loadCases(function(){
  restoreRun();
  paintTestBand();
  wireTestTap();
  buildTrack();
  render();
  /* the brand face lands after the first paint and the codename gets wider, so place it again */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!barQuiet()) paintTrack(); });
  window.addEventListener("resize", function(){ if(!barQuiet()) paintTrack(); });
  window.__BTM = S;
  window.__BTM_CARDS = CARDS;
  window.__BTM_CARDS2 = CARDS2;
  window.__BTM_RECORD = attemptRecord;
  window.__BTM_CASES = {source:CASE_SOURCE, one:CASE1.version, two:CASE2.version,
                        date:CASE1.date, assessment:ASSESS, product:PRODUCT_STAMP,
                        test:TEST_MODE, attempt:S.attemptId};
});
})();
